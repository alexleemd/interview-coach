      h("span", { class: "sum-main" },
        h("span", { class: "cue-meta" },
          coversGap(t) ? tag("Gap to prepare", "warn") : null,
          topicFocus(t).map(anyFocusName).filter(Boolean).map(name => tag(name))),
        h("span", { class: "story-title" }, t.title)),
      h("span", { class: "sum-side" }, statusEl, icon("chevron", "chev"))),
    h("div", { class: "cue-body" },
      t.why ? block("Why it matters", h("p", null, rich(t.why))) : null,
      block("What to know", [points, recall]),
      h("div", { class: "btn-row" }, toggle),
      t.say ? block("How to use it in an answer", h("p", null, rich(t.say))) : null,
      questions.length ? block("Questions to expect", h("ul", { class: "topic-questions" }, questions.map(q => h("li", null,
        linkButton(q.q, () => { pending.question = q.id; go("questions"); }), " ", practiceTag(state.qStatus[q.id]))))) : null,
      t.more ? h("p", { class: "small muted" }, "To go deeper. " + t.more) : null,
      h("div", { class: "sheet" }, checkRow("studied-" + t.id, "I can explain this without looking", null, !!state.study[t.id], false, v => {
        if (v) state.study[t.id] = true; else delete state.study[t.id];
        statusEl.replaceChildren(studiedTag(v));
        saveSoon();
      }, false))));
}

/* ---------- Step 3: Stories ---------- */

function renderStories() {
  const n = PACK.storySlots.length;
  const lead = "Interviewers ask for real examples. Prepare " + numberWord(n) + " short stories using situation, task, action and result, one for each thing the client is looking for. Spoken, each should take about two minutes."
    + (PACK.storyDrafts ? " Start from the drafts and put them in your own words." : "")
    + " Keep names out, so say a manager, a vendor or the client rather than naming people or companies.";
  const target = pending.story || (PACK.storySlots.find(s => storyStatus(s.id) !== "done") || {}).id || null;
  const scrollTo = pending.story;
  pending.story = null;
  if (scrollTo) {
    postRender = () => {
      const el = byId("story-" + scrollTo);
      if (!el) return;
      el.open = true;
      el.scrollIntoView({ block: "start" });
      el.querySelector("summary").focus({ preventScroll: true });
    };
  }
  return h("div", { class: "view" },
    viewHead("Your stories", lead),
    renderExample(),
    section("Your " + numberWord(n) + " stories", null,
      h("div", { class: "stack" }, PACK.storySlots.map(slot => renderStoryCard(slot, false, slot.id === target)))),
    section("Extra stories", PACK.extraStoriesHint || "Add more examples if you have them.",
      h("div", { class: "stack", id: "extra-stories" }, state.customStories.map(id => renderStoryCard(customSlot(id), true, false))),
      h("div", null, h("button", { type: "button", class: "btn", onclick: addCustomStory }, icon("plus"), "Add another story"))),
    section("Coverage", "Which qualities and activities your stories cover. A story counts once all four parts are written.",
      h("ul", { class: "sheet rows", id: "coverage" }, renderCoverageRows())));
}

function statusTagFor(status) {
  if (status === "done") return tag("Done", "good");
  if (status === "started") return tag("Started", "warn");
  return tag("Not started", "outline");
}

function storyTimeText(id) {
  const words = storyWords(id);
  if (!words) return "The spoken length shows here as you write.";
  const sec = spokenSeconds(words);
  let note = "";
  if (sec < 60) note = " (a bit short)";
  else if (sec > 180) note = " (try to trim it)";
  return plural(words, "word") + ", about " + fmtDuration(sec) + " spoken" + note;
}

function renderStoryCard(slot, isCustom, openIt) {
  const st = storyData(slot.id);
  const emptyTitle = isCustom ? "Not written yet" : slot.prompt;
  const titleEl = h("span", { class: "story-title" + (st.title.trim() ? "" : " is-empty") }, st.title.trim() || emptyTitle);
  const statusEl = h("span", null, statusTagFor(storyStatus(slot.id)));
  const timeEl = h("span", { class: "small muted" }, storyTimeText(slot.id));

  /* Coverage only moves when a story's status or its tags change, so typing inside a field leaves it alone. */
  let lastStatus = storyStatus(slot.id);
  const changed = tagsChanged => {
    const status = storyStatus(slot.id);
    statusEl.replaceChildren(statusTagFor(status));
    timeEl.textContent = storyTimeText(slot.id);
    if (tagsChanged || status !== lastStatus) {
      lastStatus = status;
      updateCoverage();
    }
    saveSoon();
  };

  const titleId = "story-" + slot.id + "-title";
  const titleInput = h("input", {
    type: "text", id: titleId, autocomplete: "off",
    placeholder: "A short name you will recognize",
    oninput: e => {
      st.title = e.target.value;
      titleEl.textContent = st.title.trim() || emptyTitle;
      titleEl.classList.toggle("is-empty", !st.title.trim());
      changed();
    }
  });
  titleInput.value = st.title;

  const starFields = STAR.map(part => {
    const id = "story-" + slot.id + "-" + part.key;
    const ta = h("textarea", { id, class: "ruled", rows: "4", "aria-describedby": id + "-help", oninput: e => { st[part.key] = e.target.value; changed(); } });
    ta.value = st[part.key];
    return h("div", { class: "field" },
      h("label", { class: "field-label", for: id }, part.label),
      h("span", { class: "field-help", id: id + "-help" }, part.help),
      ta);
  });

  const draft = !isCustom && PACK.storyDrafts ? PACK.storyDrafts[slot.id] : null;
  const draftEl = draft ? draftBlock("Draft from your CV",
    h("div", { class: "draft-body" },
      draft.title ? h("p", { class: "draft-title" }, draft.title) : null,
      STAR.map(p => draft[p.key] ? h("p", { class: "draft-line" }, h("strong", null, p.label + ". "), draft[p.key]) : null)),
    "Use this draft",
    () => {
      let filled = 0;
      ["title", "s", "t", "a", "r"].forEach(k => {
        if (!draft[k] || String(st[k] || "").trim()) return;
        st[k] = draft[k];
        filled++;
        const input = byId(k === "title" ? titleId : "story-" + slot.id + "-" + k);
        if (input) input.value = draft[k];
      });
      if (Array.isArray(draft.tags) && !st.tags.length) {
        st.tags = draft.tags.filter(t => t !== slot.focus && FOCUS_ITEMS.some(f => f.id === t));
        st.tags.forEach(t => { const cb = byId("story-" + slot.id + "-shows-" + t); if (cb) cb.checked = true; });
      }
      titleEl.textContent = st.title.trim() || emptyTitle;
      titleEl.classList.toggle("is-empty", !st.title.trim());
      changed(true);
      return filled;
    }) : null;

  return h("details", { class: "cue anim", id: "story-" + slot.id, open: !!openIt },
    h("summary", null,
      h("span", { class: "sum-main" },
        h("span", { class: "cue-meta" }, h("span", { class: "label slot-label" }, slot.label), slot.focus ? tag(focusName(slot.focus)) : null),
        titleEl),
      h("span", { class: "sum-side" }, statusEl, icon("chevron", "chev"))),
    h("div", { class: "cue-body" },
      slot.focus ? h("p", { class: "story-prompt" }, slot.prompt) : null,
      slot.hints && slot.hints.length ? h("ul", { class: "hints" }, slot.hints.map(t => h("li", null, t))) : null,
      draftEl,
      h("div", { class: "field" }, h("label", { class: "field-label", for: titleId }, "Title"), titleInput),
      h("div", { class: "star-grid" }, starFields),
      tagChips(slot, st, changed),
      h("div", { class: "story-foot" }, timeEl,
        isCustom ? h("button", { type: "button", class: "btn btn-small btn-danger", onclick: () => removeCustomStory(slot.id) }, icon("trash"), "Delete story") : null)));
}

function tagChips(slot, st, onChange) {
  const row = h("div", { class: "chips" });
  FOCUS_ITEMS.filter(x => x.id !== slot.focus).forEach(x => {
    const id = "story-" + slot.id + "-shows-" + x.id;
    const cb = h("input", {
      type: "checkbox", id, checked: st.tags.indexOf(x.id) >= 0,
      onchange: e => {
        const set = new Set(st.tags);
        if (e.target.checked) set.add(x.id); else set.delete(x.id);
        st.tags = Array.from(set);
        onChange(true);
      }
    });
    row.appendChild(h("label", { class: "chip", for: id }, cb, icon("check", "chip-check"), h("span", null, x.name)));
  });
  return h("fieldset", { class: "field" }, h("legend", { class: "field-label" }, "This story also shows"), row);
}

function renderCoverageRows() {
  return FOCUS_ITEMS.map(item => {
    const covering = allStoryIds().filter(id => {
      const slot = slotFor(id);
      const st = state.stories[id];
      const tags = st && Array.isArray(st.tags) ? st.tags : [];
      return (slot && slot.focus === item.id) || tags.indexOf(item.id) >= 0;
    });
    const done = covering.filter(id => storyStatus(id) === "done");
    const started = covering.filter(id => storyStatus(id) === "started");
    let status;
    if (done.length) status = tag("Covered", "good");
    else if (started.length) status = tag("Started", "warn");
    else status = tag("No story yet", "outline");
    const names = done.concat(started).map(id => slotFor(id).label).join(", ");
    return h("li", { class: "check-row cov-row" },
      h("span", { class: "check-text" },
        h("span", { class: "check-main" }, item.name),
        names ? h("span", { class: "check-sub" }, names) : null),
      status);
  });
}

function updateCoverage() {
  const host = byId("coverage");
  if (host) host.replaceChildren(...renderCoverageRows());
}

function renderExample() {
  const ex = PACK.exampleStory;
  const sec = spokenSeconds(countWords([ex.s, ex.t, ex.a, ex.r].join(" ")));
  return h("details", { class: "cue anim" },
    h("summary", null,
      h("span", { class: "sum-main" },
        h("span", { class: "cue-meta" }, h("span", { class: "label" }, "Example"), tag("Invented", "outline")),
        h("span", { class: "story-title" }, "See what a finished story looks like")),
      h("span", { class: "sum-side" }, icon("chevron", "chev"))),
    h("div", { class: "cue-body" },
      h("p", { class: "story-prompt" }, ex.title),
      h("div", { class: "example-star" }, STAR.map(part => block(part.label, h("p", { class: "body-s" }, ex[part.key])))),
      h("div", { class: "tag-row" }, (ex.tags || []).map(t => tag(focusName(t)))),
      h("p", { class: "small muted" }, "Spoken, this takes about " + fmtDuration(sec) + ". It is invented to show the shape, so your stories should come from your own work.")));
}

function addCustomStory() {
  const id = "extra-" + Date.now().toString(36);
  state.customStories.push(id);
  storyData(id);
  saveSoon();
  const card = renderStoryCard(customSlot(id), true, true);
  byId("extra-stories").appendChild(card);
  reveal(card);
  const first = card.querySelector("input");
  if (first) first.focus({ preventScroll: true });
  updateCoverage();
}

/* Deleting is a slip you can take back: the card turns into an Undo row in the same place. */
function removeCustomStory(id) {
  const index = state.customStories.indexOf(id);
  const data = state.stories[id];
  state.customStories = state.customStories.filter(x => x !== id);
  delete state.stories[id];
  saveSoon();
  const card = byId("story-" + id);
  const undoBtn = h("button", {
    type: "button", class: "btn btn-small",
    onclick: () => {
      state.customStories.splice(Math.min(index, state.customStories.length), 0, id);
      state.stories[id] = data;
      saveSoon();
      const restored = renderStoryCard(customSlot(id), true, true);
      row.replaceWith(restored);
      relabelExtras();
      reveal(restored);
      updateCoverage();
      const first = restored.querySelector("summary");
      if (first) first.focus({ preventScroll: true });
    }
  }, "Undo");
  const row = h("div", { class: "undo-row", role: "status" }, h("span", null, "Story deleted."), undoBtn);
  if (card) card.replaceWith(row);
  relabelExtras();
  updateCoverage();
  undoBtn.focus({ preventScroll: true });
  setTimeout(() => {
    if (!row.isConnected) return;
    if (motionOK() && row.animate) {
      const anim = row.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: "ease-out" });
      anim.onfinish = () => row.remove();
    } else {
      row.remove();
    }
  }, 10000);
}

function relabelExtras() {
  state.customStories.forEach((id, i) => {
    const card = byId("story-" + id);
    if (!card) return;
    const label = card.querySelector("summary .slot-label");
    if (label) label.textContent = "Extra " + (i + 1);
  });
}

/* ---------- Step 4: Questions ---------- */

function renderQuestions() {
  if (pending.question) {
    const qid = pending.question;
    pending.question = null;
    state.ui.area = "all";
    state.ui.status = "all";
    postRender = () => {
      const el = byId("q-" + qid);
      if (!el) return;
      el.open = true;
      el.scrollIntoView({ block: "start" });
      el.querySelector("summary").focus({ preventScroll: true });
    };
  }
  const lead = PACK.questions.length + " questions an interviewer could ask for this role. Open one, think through your answer and say it out loud. Then mark how it went, so the mock interview can focus on the ones that need work.";
  const areaSel = h("select", {
    id: "q-area",
    onchange: e => { state.ui.area = e.target.value; saveSoon(); drawQuestionList(); }
  }, h("option", { value: "all" }, "All areas"), PACK.areas.map(a => h("option", { value: a.id }, a.name)));
  areaSel.value = PACK.areas.some(a => a.id === state.ui.area) ? state.ui.area : "all";
  const statusSel = h("select", {
    id: "q-status",
    onchange: e => { state.ui.status = e.target.value; saveSoon(); drawQuestionList(); }
  },
    h("option", { value: "all" }, "All questions"),
    h("option", { value: "todo" }, "Not practiced"),
    h("option", { value: "again" }, "Practice again"),
    h("option", { value: "done" }, "Okay or strong"));
  statusSel.value = ["all", "todo", "again", "done"].indexOf(state.ui.status) >= 0 ? state.ui.status : "all";
  return h("div", { class: "view" },
    viewHead("Practice questions", lead),
    h("div", { class: "filters" },
      h("div", { class: "field" }, h("label", { class: "field-label", for: "q-area" }, "Area"), h("span", { class: "select-wrap" }, areaSel)),
      h("div", { class: "field" }, h("label", { class: "field-label", for: "q-status" }, "Show"), h("span", { class: "select-wrap" }, statusSel))),
    h("div", { class: "count-row", id: "q-counts" }, renderCounts()),
    h("div", { class: "stack", id: "q-list" }, renderQuestionGroups()));
}

function practiceTag(s) {
  if (s === "again") return tag("Practice again", "warn");
  if (s === "okay") return tag("Okay");
  if (s === "strong") return tag("Strong", "good");
  return tag("Not practiced", "outline");
}

function renderCounts() {
  const c = { strong: 0, okay: 0, again: 0, todo: 0 };
  PACK.questions.forEach(q => { const s = state.qStatus[q.id]; if (c[s] !== undefined) c[s]++; else c.todo++; });
  /* These are numbers to read, so they are set as text and not as tags that look like filters. */
  return [
    h("span", null, c.strong + " strong"),
    h("span", null, c.okay + " okay"),
    h("span", null, c.again + " to practice again"),
    h("span", null, c.todo + " not practiced")
  ];
}

function filteredQuestions() {
  return PACK.questions.filter(q => {
    if (state.ui.area !== "all" && q.area !== state.ui.area) return false;
    const s = state.qStatus[q.id];
    if (state.ui.status === "todo" && s) return false;
    if (state.ui.status === "again" && s !== "again") return false;
    if (state.ui.status === "done" && s !== "okay" && s !== "strong") return false;
    return true;
  });
}

function renderQuestionGroups() {
  const qs = filteredQuestions();
  if (!qs.length) return [h("p", { class: "empty" }, "No questions match these filters. Choose All areas and All questions to see every question.")];
  return PACK.areas.map(area => {
    const inArea = qs.filter(q => q.area === area.id);
    if (!inArea.length) return null;
    return h("section", { class: "q-group", "aria-label": area.name },
      h("div", { class: "q-group-head" }, h("h2", { class: "display-s" }, area.name), h("span", { class: "small muted" }, plural(inArea.length, "question"))),
      h("div", { class: "sheet rows" }, inArea.map(renderQuestion)));
  }).filter(Boolean);
}

function drawQuestionList() {
  byId("q-list").replaceChildren(...renderQuestionGroups());
}

function renderQuestion(q) {
  const statusSlot = h("span", null, practiceTag(state.qStatus[q.id]));
  return h("details", { class: "qrow anim", id: "q-" + q.id },
    h("summary", null,
      h("span", { class: "sum-main" },
        h("span", { class: "q-text" }, q.q),
        h("span", { class: "q-tags" }, tag(TYPE_LABEL[q.type]), statusSlot)),
      icon("chevron", "chev")),
    h("div", { class: "qrow-body" },
      block("Why they ask", h("p", null, q.why)),
      block("A strong answer covers", h("ul", { class: "bullets" }, q.covers.map(c => h("li", null, rich(c))))),
      block("Watch out for", h("p", null, q.avoid)),
      q.story ? h("p", null, "Use ", linkButton(storyLabel(q.story), () => { pending.story = q.story; go("stories"); }), " for this one.") : null,
      q.link === "prep" ? h("p", null, "Prepare this in ", linkButton("Prep", () => go("prep")), ".") : null,
      noteField(q),
      rateRow(q, statusSlot)));
}

function noteField(q) {
  const id = "note-" + q.id;
  const ta = h("textarea", {
    id, rows: "3",
    placeholder: "Your answer in a few words per point",
    oninput: e => {
      const v = e.target.value;
      if (v.trim()) state.qNotes[q.id] = v; else delete state.qNotes[q.id];
      saveSoon();
    }
  });
  ta.value = state.qNotes[q.id] || "";
  return h("div", { class: "field" }, h("label", { class: "field-label", for: id }, "Your notes"), ta);
}

function rateRow(q, statusSlot) {
  const row = h("div", { class: "rate", role: "group", "aria-label": "How did it go?" },
    h("span", { class: "label", "aria-hidden": "true" }, "How did it go?"));
  RATINGS.forEach(r => {
    row.appendChild(h("button", {
      type: "button", class: "btn btn-small", "data-rate": r.value,
      "aria-pressed": String(state.qStatus[q.id] === r.value),
      onclick: () => {
        const now = state.qStatus[q.id] === r.value ? null : r.value;
        if (now) state.qStatus[q.id] = now; else delete state.qStatus[q.id];
        row.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.getAttribute("data-rate") === now)));
        statusSlot.replaceChildren(practiceTag(now));
        const counts = byId("q-counts");
        if (counts) counts.replaceChildren(...renderCounts());
        saveSoon();
      }
    }, r.label));
  });
  return row;
}

/* ---------- Step 5: Scenarios as a ticket with an interview transcript ---------- */

let play = null;

function renderScenarios() {
  if (pending.scenario) {
    startPlay(pending.scenario);
    pending.scenario = null;
    postRender = () => { animateConversation(null); focusEl("scn-prompt"); };
  }
  const lead = "Interviewers often describe a situation and ask what you would do. Pick an answer at each step to see how an interviewer would likely hear it. More than one answer can be reasonable, but one is usually stronger.";
  return h("div", { class: "view" },
    viewHead("Scenarios", lead),
    h("div", { class: "view-host", id: "scn-host" }, play ? renderPlay() : renderQueue()));
}

function drawScenarioHost(direction) {
  const host = byId("scn-host");
  if (!host) return;
  pushTransition(host, play ? renderPlay() : renderQueue(), direction);
}

function startPlay(id) {
  const s = scenarioById(id);
  if (!s) return;
  play = { id, nodeId: s.start, path: [], done: false, fresh: true };
}

function scenarioRatingTag(r) {
  if (r === "strong") return tag("Strong", "good");
  if (r === "okay") return tag("Partly there", "warn");
  return tag("Weak", "bad");
}

function priorityTag(p) {
  if (/1/.test(p)) return tag(p, "bad");
  if (/2/.test(p)) return tag(p, "warn");
  return tag(p, "outline");
}

function openScenario(id) {
  startPlay(id);
  drawScenarioHost("forward");
  animateConversation(null);
  focusEl("scn-prompt");
}

function renderQueue() {
  /* Only the next scenario to play carries the main button, so the list has one obvious place to start. */
  const upNext = PACK.scenarios.find(s => !state.scenarios[s.id]) || null;
  return h("ul", { class: "sheet rows", "aria-label": "Scenarios" }, PACK.scenarios.map(s => {
    const res = state.scenarios[s.id];
    return h("li", { class: "queue-row" },
      h("span", { class: "queue-text" },
        h("span", { class: "tag-row" }, h("span", { class: "ticket-no" }, s.code), tag(s.ticketType), priorityTag(s.priority)),
        h("span", { class: "display-s" }, s.title),
        h("span", { class: "queue-teaser" }, s.teaser),
        h("span", { class: "tag-row queue-status" },
          res ? tag(res.strong + " of " + res.total + " strongest last time", res.strong === res.total ? "good" : null) : tag("Not played", "outline"))),
      h("button", {
        type: "button", class: "btn" + (s === upNext ? " btn-primary" : ""),
        "aria-label": (res ? "Play again: " : "Play: ") + s.title,
        onclick: () => openScenario(s.id)
      }, res ? "Play again" : "Play"));
  }));
}

function entry(kind, who, text, opts) {
  const o = opts || {};
  return h("div", { class: "entry entry-" + kind, "data-new": o.isNew ? "1" : null },
    h("span", { class: "entry-who" }, who),
    h("p", { class: "entry-text", id: o.id || null, tabindex: o.id ? "-1" : null }, text));
}

function coachEntry(choice, isLast, isNew) {
  return h("div", { class: "entry entry-coach", "data-new": isNew ? "1" : null },
    h("span", { class: "entry-who" }, "Coach"),
    h("div", { class: "entry-text", id: isLast ? "scn-last" : null, tabindex: isLast ? "-1" : null },
      h("div", { class: "coach-head" }, scenarioRatingTag(choice.rating), h("span", { class: "label" }, "How an interviewer hears it")),
      h("p", null, choice.reaction),
      h("p", { class: "coach-tip" }, h("strong", null, "Tip. "), choice.tip)));
}

function renderPlay() {
  const s = scenarioById(play.id);
  const fresh = play.fresh;
  const log = h("div", { class: "transcript" });
  play.path.forEach((step, i) => {
    const node = s.nodes[step.nodeId];
    const choice = node.choices[step.choice];
    const isLast = i === play.path.length - 1;
    log.append(
      entry("update", i === 0 ? "Situation" : "Update", node.setup),
      entry("them", "Interviewer", node.prompt),
      entry("you", "You", choice.text, { id: isLast ? "scn-you-last" : null }),
      coachEntry(choice, isLast, fresh && isLast));
  });

  let tail;
  if (!play.done) {
    const node = s.nodes[play.nodeId];
    log.append(
      entry("update", play.path.length === 0 ? "Situation" : "Update", node.setup, { isNew: fresh }),
      entry("them", "Interviewer", node.prompt, { id: "scn-prompt", isNew: fresh }));
    tail = h("div", { class: "decision", role: "group", "aria-labelledby": "scn-prompt", "data-new": fresh ? "1" : null },
      h("p", { class: "label" }, "Your answer"),
      node.choices.map((c, i) => h("button", {
        type: "button", class: "choice",
        onclick: e => choose(i, e.currentTarget)
      }, h("span", { class: "choice-key", "aria-hidden": "true" }, KEYS[i]), h("span", null, c.text))));
  } else {
    tail = renderWrapUp(s, fresh);
  }

  return h("div", { class: "play" },
    h("button", { type: "button", class: "btn btn-small btn-quiet play-back", onclick: () => { play = null; drawScenarioHost("back"); } }, "Back to all scenarios"),
    h("article", { class: "ticket", "aria-label": s.code + " " + s.title },
      h("div", { class: "ticket-head" },
        h("span", { class: "ticket-no" }, s.code),
        tag(s.ticketType),
        priorityTag(s.priority),
        h("span", null, PACK.scenarioHeaderNote || "Assigned to you"),
        play.done ? tag("Resolved", "good") : tag("In progress", "accent")),
      h("div", { class: "ticket-body" },
        h("h2", { class: "display-m" }, s.title),
        log,
        tail)));
}

function choose(i, button) {
  const from = button ? button.getBoundingClientRect() : null;
  const s = scenarioById(play.id);
  const node = s.nodes[play.nodeId];
  const choice = node.choices[i];
  play.path.push({ nodeId: play.nodeId, choice: i });
  if (choice.next && s.nodes[choice.next]) {
    play.nodeId = choice.next;
  } else {
    play.done = true;
    recordScenario(s);
  }
  play.fresh = true;
  byId("scn-host").replaceChildren(renderPlay());
  animateConversation(from);
  const coach = byId("scn-last");
  if (coach) {
    coach.focus({ preventScroll: true });
    setTimeout(() => coach.scrollIntoView({ block: "nearest", behavior: motionOK() ? "smooth" : "auto" }), 80);
  }
}

/* Your answer travels from the button you tapped into the transcript, then new lines arrive in order. */
function animateConversation(from) {
  if (play) play.fresh = false;
  const you = byId("scn-you-last");
  if (from && you) flipFrom(you, from);
  const fresh = Array.from(document.querySelectorAll('#scn-host [data-new="1"]'));
  fresh.forEach((el, k) => {
    el.removeAttribute("data-new");
    reveal(el, (from ? 120 : 0) + k * 70);
  });
}

function recordScenario(s) {
  const total = play.path.length;
  const strong = play.path.filter(st => s.nodes[st.nodeId].choices[st.choice].rating === "strong").length;
  const prev = state.scenarios[s.id];
  state.scenarios[s.id] = { strong, total, plays: (prev && prev.plays ? prev.plays : 0) + 1 };
  saveSoon();
}

function renderWrapUp(s, isNew) {
  const r = state.scenarios[s.id];
  const msg = r.strong === r.total
    ? "You picked the strongest answer every time."
    : "You picked the strongest answer in " + r.strong + " of " + r.total + " decisions.";
  const idx = PACK.scenarios.indexOf(s);
  const next = PACK.scenarios.slice(idx + 1).concat(PACK.scenarios.slice(0, idx)).find(x => !state.scenarios[x.id]) || PACK.scenarios[idx + 1] || null;
  return h("div", { class: "wrap-up", "data-new": isNew ? "1" : null },
    h("p", { class: "score" }, h("span", { class: "score-num" }, r.strong + " of " + r.total), h("span", { class: "score-of" }, "strongest answers")),
    h("p", null, msg),
    block("What a strong answer covers", h("ul", { class: "bullets" }, s.wrapUp.map(t => h("li", null, t)))),
    h("p", { class: "small muted" }, "If you have a real example of this from your own work, add it in ", linkButton("Stories", () => go("stories")), "."),
    h("div", { class: "btn-row" },
      next ? h("button", { type: "button", class: "btn btn-primary", onclick: () => openScenario(next.id) }, "Next scenario") : null,
      h("button", { type: "button", class: "btn", onclick: () => openScenario(s.id) }, "Play again"),
      h("button", { type: "button", class: "btn", onclick: () => { play = null; drawScenarioHost("back"); } }, "All scenarios")));
}

/* ---------- Step 6: Mock interview with cards you throw into a tray ---------- */

let mock = null;
let tickTimer = 0;
let shownSecond = -1;

function renderMock() {
  const lead = "A timed practice round. Answer each question out loud as if the interviewer is in front of you, then rate yourself by putting the card in a tray.";
  cleanupFn = () => {
    stopTicker();
    if (mock && !mock.done && !mock.pausedAt) mock.pausedAt = Date.now();
    if (mock) mock.flying = false;
  };
  postRender = () => { if (mock && !mock.done && !mock.pausedAt) startTicker(); else tick(); };
  return h("div", { class: "view" },
    viewHead("Mock interview", lead),
    h("div", { class: "view-host", id: "mock-host" }, mockContent()));
}

function mockContent() {
  if (!mock) return renderMockSetup();
  if (mock.done) return renderMockSummary();
  return renderMockStage();
}

function drawMock(direction) {
  const host = byId("mock-host");
  if (!host) return;
  pushTransition(host, mockContent(), direction);
  shownSecond = -1;
  if (mock && !mock.done && !mock.pausedAt) startTicker();
  else { stopTicker(); tick(); }
}

function lengthMinutes(n) { return n >= 10 ? "About 25 minutes." : "About 15 minutes."; }

function renderMockSetup() {
  const opener = questionById(PACK.mock.opener);
  const closer = questionById(PACK.mock.closer);
  const len = Number(state.ui.mockLength) || 6;
  const lenHelp = h("p", { class: "small muted" }, lengthMinutes(len));
  return h("div", { class: "sheet sheet-pad mock-setup" },
    h("h2", { class: "display-s" }, "Set up a round"),
    segmented("Length", "mock-length", [
      { value: 6, label: "6 questions" },
      { value: 10, label: "10 questions" }
    ], len, v => { state.ui.mockLength = v; lenHelp.textContent = lengthMinutes(v); saveSoon(); }, lenHelp),
    segmented("Focus", "mock-focus", [
      { value: "mixed", label: "Mixed" },
      { value: "weak", label: "Weak spots first" }
    ], state.ui.mockFocus, v => { state.ui.mockFocus = v; saveSoon(); },
      h("p", { class: "small muted" }, "Weak spots first picks questions you marked Practice again or have not practiced yet.")),
    h("p", { class: "muted" },
      "Every round starts with “" + stripEnd(opener.q) + "” and ends with “" + stripEnd(closer.q) + "”. Answer out loud and keep going if you stumble, as you would in the real interview."),
    h("div", { class: "btn-row" }, h("button", { type: "button", class: "btn btn-primary btn-large", onclick: startMock }, icon("play"), "Start the round")));
}

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function weakness(q) {
  const s = state.qStatus[q.id];
  if (s === "again") return 3;
  if (!s) return 2;
  if (s === "okay") return 1;
  return 0;
}

function pickMockQuestions(n, focus) {
  const opener = PACK.mock.opener;
  const closer = PACK.mock.closer;
  const middleCount = Math.max(0, n - 2);
  /* The pack format ends the areas with the closing one, whatever its id, and the round already ends on the closer. */
  const closing = PACK.areas[PACK.areas.length - 1].id;
  const areas = shuffle(PACK.areas.map(a => a.id).filter(a => a !== closing));
  const pools = {};
  areas.forEach(a => {
    let qs = shuffle(PACK.questions.filter(q => q.area === a && q.id !== opener && q.type !== "closer"));
    if (focus === "weak") qs = qs.sort((x, y) => weakness(y) - weakness(x));
    pools[a] = qs;
  });
  let order = areas;
  if (focus === "weak") {
    order = areas.slice().sort((x, y) => (pools[y][0] ? weakness(pools[y][0]) : -1) - (pools[x][0] ? weakness(pools[x][0]) : -1));
  }
  const middle = [];
  for (let round = 0; middle.length < middleCount; round++) {
    let added = false;
    for (const a of order) {
      if (middle.length >= middleCount) break;
      const q = pools[a][round];
      if (q) { middle.push(q.id); added = true; }
    }
    if (!added) break;
  }
  return [opener].concat(middle, [closer]).filter(id => questionById(id));
}

function startMock() {
  mock = {
    ids: pickMockQuestions(Number(state.ui.mockLength) || 6, state.ui.mockFocus),
    index: 0, ratings: {}, times: {},
    startedAt: Date.now(), pausedAt: null, pausedTotal: 0,
    showGuide: false, done: false, flying: false
  };
  drawMock("forward");
  focusEl("mock-q");
}

function mockElapsed() {
  if (!mock) return 0;
  const end = mock.pausedAt || Date.now();
  return Math.max(0, (end - mock.startedAt - mock.pausedTotal) / 1000);
}

function mockTarget() {
  const q = questionById(mock.ids[mock.index]);
  return (q && PACK.mock.targets[q.type]) || 120;
}

/* The stage keeps the trays in place while cards come and go. */
function renderMockStage() {
  const trays = h("div", { class: "trays", id: "mock-trays", role: "group", "aria-labelledby": "trays-label" },
    RATINGS.map(r => h("button", { type: "button", class: "tray", "data-rate": r.value, onclick: () => rateMock(r.value) }, r.label)));
  return h("div", { class: "deck" },
    h("div", { class: "card-slot", id: "mock-slot" }, buildMockCard()),
    h("div", { class: "trays-head" },
      h("span", { class: "label", id: "trays-label" }, "How did it go?"),
      h("span", { class: "small muted" }, "Tap a tray, or throw the card left or right.")),
    trays,
    h("div", { class: "btn-row" },
      h("button", { type: "button", class: "btn-link small", onclick: () => rateMock(null) }, "Skip this question"),
      h("button", { type: "button", class: "btn-link small", onclick: endMock }, "End the round")));
}

function buildMockCard() {
  const q = questionById(mock.ids[mock.index]);
  const target = mockTarget();
  const guide = h("div", { class: "guide", id: "mock-guide", hidden: !mock.showGuide },
    block("A strong answer covers", h("ul", { class: "bullets" }, q.covers.map(c => h("li", null, rich(c))))),
    block("Watch out for", h("p", null, q.avoid)));
  const guideBtn = h("button", {
    type: "button", class: "btn btn-small",
    "aria-expanded": String(mock.showGuide), "aria-controls": "mock-guide",
    onclick: () => {
      mock.showGuide = !mock.showGuide;
      guide.hidden = !mock.showGuide;
      if (mock.showGuide) reveal(guide, 0, 8);
      guideBtn.setAttribute("aria-expanded", String(mock.showGuide));
      guideBtn.textContent = mock.showGuide ? "Hide the guide" : "Show what a strong answer covers";
    }
  }, mock.showGuide ? "Hide the guide" : "Show what a strong answer covers");
  const pauseBtn = h("button", { type: "button", class: "btn btn-small", id: "mock-pause", onclick: togglePause },
    icon(mock.pausedAt ? "play" : "pause"), mock.pausedAt ? "Resume" : "Pause");

  const card = h("article", { class: "card-q", id: "mock-card", "aria-labelledby": "mock-q" },
    h("div", { class: "card-head" },
      h("span", { class: "label" }, "Question " + (mock.index + 1) + " of " + mock.ids.length),
      tag(areaName(q.area)),
      tag(TYPE_LABEL[q.type], "outline")),
    h("div", { class: "card-body" },
      h("h2", { class: "card-question", id: "mock-q", tabindex: "-1" }, q.q),
      h("div", { class: "clock" },
        h("span", { class: "clock-time", id: "mock-timer", role: "timer", "aria-label": "Time on this question" }, clockParts(mockElapsed())),
        h("span", { class: "clock-target", id: "mock-target" }, "Aim for about " + fmtDuration(target)),
        h("div", { class: "budget", id: "mock-budget", "aria-hidden": "true" },
          h("span", { class: "budget-fill", id: "mock-budget-fill" }),
          h("span", { class: "budget-tick" })),
        h("span", { class: "budget-mark", "aria-hidden": "true" }, fmtDuration(target))),
      h("div", { class: "btn-row" }, pauseBtn, guideBtn),
      guide));
  attachThrow(card);
  return card;
}

/*
  The card tracks the pointer 1:1 once a sideways drag passes 10px. On release, the throw is
  projected forward from its speed, and the card lands in the tray it is heading for or springs
  back if the throw was too short. X and Y move on separate springs.
*/
function attachThrow(card) {
  let g = null;
  const sx = new Spring(0, paint, { precision: 0.3 });
  const sy = new Spring(0, paint, { precision: 0.3 });
  const sp = new Spring(0, paint, { precision: 0.01 });
  /* The card lifts a little off the page while it is held. */
  const sl = new Spring(0, paint, { precision: 0.005 });
  function paint() {
    const rot = Math.max(-6, Math.min(6, sx.x * 0.025));
    const scale = (1 - 0.6 * sp.x) * (1 + 0.02 * sl.x);
    card.style.transform = "translate3d(" + sx.x.toFixed(2) + "px," + sy.x.toFixed(2) + "px,0) rotate(" + rot.toFixed(2) + "deg) scale(" + scale.toFixed(3) + ")";
    card.style.opacity = String(1 - 0.9 * sp.x);
  }
  function markTray(rate) {
    const t = byId("mock-trays");
    if (t) t.querySelectorAll(".tray").forEach(b => b.classList.toggle("is-target", b.getAttribute("data-rate") === rate));
  }
  card.addEventListener("pointerdown", e => {
    if (e.button !== undefined && e.button !== 0) return;
    if (e.target.closest("button, a, input, textarea, select, .guide")) return;
    if (!mock || mock.flying) return;
    g = { id: e.pointerId, x0: e.clientX, y0: e.clientY, active: false, samples: [] };
  });
  card.addEventListener("pointermove", e => {
    if (!g || e.pointerId !== g.id) return;
    const dx = e.clientX - g.x0;
    const dy = e.clientY - g.y0;
    if (!g.active) {
      if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { g = null; return; }
      if (Math.abs(dx) < 10) return;
      g.active = true;
      g.x0 = e.clientX;
      g.y0 = e.clientY;
      g.bx = sx.x;
      g.by = sy.x;
      sx.stop();
      sy.stop();
      sl.to(1, { damping: 1, response: 0.22 });
      card.classList.add("is-dragging");
      try { card.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
    }
    const x = g.bx + (e.clientX - g.x0);
    const y = g.by + (e.clientY - g.y0) * 0.25;
    sx.x = x; sx.v = 0;
    sy.x = y; sy.v = 0;
    paint();
    const w = card.offsetWidth;
    markTray(x < -w * 0.2 ? "again" : x > w * 0.2 ? "strong" : null);
    const now = performance.now();
    g.samples.push({ x, t: now });
    while (g.samples.length > 2 && now - g.samples[0].t > 100) g.samples.shift();
  });
  const release = e => {
    if (!g || e.pointerId !== g.id) return;
    const was = g;
    g = null;
    if (!was.active) return;
    card.classList.remove("is-dragging");
    sl.to(0, { damping: 1, response: 0.3 });
    markTray(null);
    const f = was.samples[0];
    const l = was.samples[was.samples.length - 1];
    const v = f && l && l.t > f.t ? ((l.x - f.x) / (l.t - f.t)) * 1000 : 0;
    const projected = sx.x + project(v, 0.99);
    const w = card.offsetWidth;
    if (projected < -w * 0.4) { card._releaseV = v; rateMock("again"); }
    else if (projected > w * 0.4) { card._releaseV = v; rateMock("strong"); }
    else {
      sx.to(0, { damping: 0.8, response: 0.32, velocity: v });
      sy.to(0, { damping: 0.8, response: 0.32 });
    }
  };
  card.addEventListener("pointerup", release);
  card.addEventListener("pointercancel", release);

  /* Flies the card into a tray, keeping the speed of the throw if there was one. */
  card._fly = (rate, done) => {
    const tray = byId("mock-trays") && byId("mock-trays").querySelector('[data-rate="' + rate + '"]');
    if (!tray || !motionOK()) { done(); return; }
    const cr = card.getBoundingClientRect();
    const tr = tray.getBoundingClientRect();
    const baseX = (cr.left + cr.right) / 2 - sx.x;
    const baseY = (cr.top + cr.bottom) / 2 - sy.x;
    tray.classList.add("is-target");
    sx.to((tr.left + tr.right) / 2 - baseX, { damping: 1, response: 0.4, velocity: card._releaseV || 0 });
    sy.to((tr.top + tr.bottom) / 2 - baseY, { damping: 1, response: 0.4 });
    sp.to(1, { damping: 1, response: 0.4, onRest: () => { tray.classList.remove("is-target"); done(); } });
  };
}

/* A new card is dealt from just above, the way a card comes off a stack. */
function deal(card) {
  if (!motionOK()) { fadeIn(card); return; }
  card.style.opacity = "0";
  const s = new Spring(0, p => {
    card.style.opacity = String(Math.min(1, p * 1.3));
    card.style.transform = "translateY(" + (-24 * (1 - p)).toFixed(2) + "px) rotate(" + (-1.2 * (1 - p)).toFixed(3) + "deg)";
  }, { precision: 0.002 });
  s.to(1, { damping: 1, response: 0.4, onRest: () => { card.style.opacity = ""; card.style.transform = ""; } });
}

function tick() {
  if (!mock || mock.done) return;
  const timer = byId("mock-timer");
  if (!timer) return;
  const sec = mockElapsed();
  const target = mockTarget();
  const over = sec > target;
  const whole = Math.floor(sec);
  if (whole !== shownSecond) {
    shownSecond = whole;
    timer.replaceChildren(...clockParts(sec));
    const label = byId("mock-target");
    if (label) {
      label.textContent = mock.pausedAt ? "Paused"
        : over ? "Past " + fmtDuration(target) + ". Start wrapping up."
        : "Aim for about " + fmtDuration(target);
    }
  }
  const fill = byId("mock-budget-fill");
  const bar = byId("mock-budget");
  if (fill) fill.style.width = Math.min(100, (sec / (target * 1.5)) * 100).toFixed(2) + "%";
  if (bar) bar.classList.toggle("is-over", over);
}

/* The stopwatch runs on a timer rather than animation frames, so it keeps counting wherever the coach is open. */
function startTicker() { stopTicker(); shownSecond = -1; tick(); tickTimer = setInterval(tick, 200); }
function stopTicker() { if (tickTimer) clearInterval(tickTimer); tickTimer = 0; }

function togglePause() {
  if (!mock) return;
  if (mock.pausedAt) {
    mock.pausedTotal += Date.now() - mock.pausedAt;
    mock.pausedAt = null;
    startTicker();
  } else {
    mock.pausedAt = Date.now();
    stopTicker();
  }
  const b = byId("mock-pause");
  if (b) b.replaceChildren(icon(mock.pausedAt ? "play" : "pause"), mock.pausedAt ? "Resume" : "Pause");
  shownSecond = -1;
  tick();
}

function rateMock(r) {
  if (!mock || mock.done || mock.flying) return;
  const qid = mock.ids[mock.index];
  mock.times[qid] = mockElapsed();
  if (r) {
    mock.ratings[qid] = r;
    state.qStatus[qid] = r;
    saveSoon();
  }
  const card = byId("mock-card");
  if (r && card && card._fly) {
    mock.flying = true;
    stopTicker();
    card._fly(r, () => {
      if (!mock || !mock.flying) return;
      mock.flying = false;
      nextMockQuestion();
    });
  } else {
    nextMockQuestion();
  }
}

function nextMockQuestion() {
  mock.index++;
  mock.showGuide = false;
  if (mock.index >= mock.ids.length) {
    finishMock();
    return;
  }
  mock.startedAt = Date.now();
  mock.pausedAt = null;
  mock.pausedTotal = 0;
  const slot = byId("mock-slot");
  if (!slot) { drawMock("forward"); return; }
  const card = buildMockCard();
  slot.replaceChildren(card);
  deal(card);
  startTicker();
  focusEl("mock-q");
}

function finishMock() {
  mock.done = true;
  state.mockRounds = (state.mockRounds || 0) + 1;
  saveSoon();
  drawMock("forward");
  focusEl("mock-done");
}

function endMock() {
  if (!mock) return;
  mock.ids = mock.ids.slice(0, mock.index);
  if (!mock.ids.length) {
    mock = null;
    drawMock("back");
    return;
  }
  finishMock();
}

function renderMockSummary() {
  const answered = mock.ids.filter(id => mock.times[id] !== undefined);
  const total = answered.reduce((sum, id) => sum + mock.times[id], 0);
  const again = answered.filter(id => mock.ratings[id] === "again").length;
  return h("div", { class: "sheet sheet-pad" },
    h("h2", { class: "display-m", id: "mock-done", tabindex: "-1" }, "Round done"),
    h("p", { class: "muted" }, plural(answered.length, "question") + " in " + fmtDuration(total) + "."),
    h("ul", { class: "result-list" }, answered.map(id => {
      const q = questionById(id);
      return h("li", null,
        h("span", { class: "result-q" }, q.q),
        h("span", { class: "result-time" }, fmtClock(mock.times[id])),
        mock.ratings[id] ? practiceTag(mock.ratings[id]) : tag("Skipped", "outline"));
    })),
    h("div", { class: "btn-row" },
      h("button", { type: "button", class: "btn btn-primary", onclick: () => { mock = null; drawMock("back"); } }, "Set up another round"),
      again ? h("button", {
        type: "button", class: "btn",
        onclick: () => { state.ui.status = "again"; state.ui.area = "all"; saveSoon(); go("questions"); }
      }, "See the " + again + " to practice again") : null));
}

/* ---------- Step 7: AI practice ---------- */

function storyTitles() {
  return allStoryIds().map(id => {
    const st = state.stories[id];
    const title = st && typeof st.title === "string" ? st.title.trim() : "";
    return title ? storyLabel(id) + ": " + title : null;
  }).filter(Boolean);
}

function buildPrompt() {
  const ai = state.ai;
  const intro = state.prep.intro.trim();
  const titles = storyTitles();
  const opener = stripEnd(questionById(PACK.mock.opener).q);
  const closer = stripEnd(questionById(PACK.mock.closer).q);
  const L = [];
  L.push("I have a client interview coming up and want to practice. Please act as the client’s interviewer.");
  L.push("");
  L.push("The role");
  PACK.aiBrief.forEach(line => L.push("- " + line));
  L.push("");
  L.push("How to run the practice");
  L.push("- Ask one question at a time and wait for my answer.");
  L.push("- Ask " + ai.count + " questions in total. Start with “" + opener + "” and end with “" + closer + "”.");
  L.push("- Mix questions about my past experience (“Tell us about a time…”) with " + (PACK.aiSituations || "practical situations from the job") + ".");
  L.push("- The client wants to know whether I can do the work. Ask about my skills and experience and not about why I want the role.");
  L.push("- If an answer is vague or misses something important, ask one follow-up question, as a real interviewer would.");
  if (ai.mode === "coach") {
    L.push("- After each answer, give me short feedback: what worked, what was missing and one concrete way to make it stronger. Then ask the next question.");
  } else {
    L.push("- Do not give feedback during the interview. At the end, give feedback on each answer and a summary against the qualities above, with the three most important things to improve.");
  }
  L.push("- Keep your questions short and natural. I will answer out loud, so keep your replies short enough to listen to.");
  L.push("- Do not invent facts about the client or the applications. If a scenario needs a detail, make it clearly hypothetical.");
  if (ai.includeIntro && intro) {
    L.push("");
    L.push("My planned intro");
    L.push(intro);
  }
  if (ai.includeStories && titles.length) {
    L.push("");
    L.push("Stories I have prepared (ask about them where they fit)");
    titles.forEach(t => L.push("- " + t));
  }
  L.push("");
  L.push("Start with a short greeting and your first question.");
  return L.join("\n");
}

function renderAI() {
  const lead = "Saying your answers out loud is the best practice. This step writes a prompt you paste into " + APP.aiTool + ", which then plays the interviewer. The coach itself does not use AI or send anything anywhere.";
  const pre = h("pre", { class: "prompt", id: "ai-prompt", tabindex: "0", "aria-label": "Prompt to copy" }, buildPrompt());
  const redraw = () => { pre.textContent = buildPrompt(); };
  const hasIntro = !!state.prep.intro.trim();
  const titles = storyTitles();
  const copyStatus = h("span", { class: "small muted", id: "ai-copy-status", role: "status" });
  return h("div", { class: "view" },
    viewHead("Practice out loud with " + APP.aiTool, lead),
    section("How to use it", null,
      h("ol", { class: "sheet steps-list" },
        h("li", null, "Pick a mode and the number of questions below."),
        h("li", null, "Copy the prompt."),
        h("li", null, "Paste it into a new chat in " + APP.aiTool + " on your work account (not a personal one) and answer out loud."))),
    section("Mode", null,
      optionCards("ai-mode", "Mode", [
        { value: "coach", label: "Coach me after each answer", sub: "Short feedback after every answer, then the next question." },
        { value: "interview", label: "Real interview", sub: "No feedback until the end, like the real thing." }
      ], state.ai.mode, v => { state.ai.mode = v; saveSoon(); redraw(); })),
    section("Length", null,
      segmented("Number of questions", "ai-count", [
        { value: 5, label: "5" }, { value: 8, label: "8" }, { value: 12, label: "12" }
      ], Number(state.ai.count) || 8, v => { state.ai.count = v; saveSoon(); redraw(); })),
    section("Include", "Both stay out of the prompt until you tick them. Check them for client names and other people’s names first.",
      h("div", { class: "sheet rows" },
        checkRow("ai-intro", "My 60 second intro", hasIntro ? null : "Write it in Prep first.", state.ai.includeIntro && hasIntro, !hasIntro,
          v => { state.ai.includeIntro = v; saveSoon(); redraw(); }),
        checkRow("ai-stories", "My story titles", titles.length ? null : "Give your stories a title first.", state.ai.includeStories && titles.length > 0, titles.length === 0,
          v => { state.ai.includeStories = v; saveSoon(); redraw(); }))),
    section("The prompt", "Check it before you paste it. It contains only what you see here.",
      h("div", { class: "prompt-box" },
        pre,
        h("div", { class: "btn-row" },
          h("button", { type: "button", class: "btn btn-primary", onclick: e => copyPrompt(pre, copyStatus, e.currentTarget) }, icon("copy"), "Copy prompt"),
          copyStatus))),
    h("p", { class: "small muted" }, "Whatever you paste goes to " + APP.aiTool + ", so leave out client names, other people’s names and anything confidential."),
    h("p", { class: "small muted" }, "If you would rather not use " + APP.aiTool + ", run another round of the ", linkButton("mock interview", () => go("mock")), " instead."));
}

async function copyPrompt(pre, statusEl, btn) {
  const ok = await copyText(pre.textContent);
  if (ok) {
    flashCopied(btn);
    statusEl.textContent = "Copied. Paste it into " + APP.aiTool + ".";
    state.aiCopied = true;
    saveSoon();
  } else {
    selectNode(pre);
    statusEl.textContent = "Copying is blocked here. The prompt is selected, so press Ctrl+C (Cmd+C on a Mac) to copy it.";
  }
}

/* ---------- Step 8: Prep ---------- */

function introMeter() {
  const words = countWords(state.prep.intro);
  const sec = spokenSeconds(words);
  let verdict = null;
  if (words > 0 && words < 130) verdict = h("span", { class: "is-warn" }, "A bit short");
  else if (words > 200) verdict = h("span", { class: "is-warn" }, "A bit long");
  else if (words >= 130) verdict = h("span", { class: "is-good" }, "Good length");
  return [
    h("span", null, plural(words, "word")),
    h("span", null, "about " + fmtDuration(sec) + " spoken"),
    h("span", null, "aim for 130 to 200 words"),
    verdict
  ];
}

function askCountText() {
  const n = state.prep.ask.length;
  if (n === 0) return "None picked yet.";
  return n + " picked." + (n > 4 ? " That may be more than you will have time for." : "");
}

function renderPrep() {
  const lead = "Your intro, the points you want them to remember, the questions you will ask and a checklist for the day.";
  const meter = h("div", { class: "meter", id: "intro-meter" }, introMeter());
  const intro = h("textarea", {
    id: "prep-intro", class: "ruled", rows: "7",
    placeholder: "Write it the way you would say it.",
    oninput: e => { state.prep.intro = e.target.value; meter.replaceChildren(...introMeter()); saveSoon(); }
  });
  intro.value = state.prep.intro;

  const placeholders = PACK.messagePlaceholders || DEFAULT_MESSAGE_PLACEHOLDERS;
  const introDraft = PACK.introDraft ? draftBlock("Draft from your CV",
    h("p", { class: "draft-line" }, PACK.introDraft),
    "Use this draft",
    () => {
      if (state.prep.intro.trim()) return 0;
      state.prep.intro = PACK.introDraft;
      intro.value = PACK.introDraft;
      meter.replaceChildren(...introMeter());
      saveSoon();
      return 1;
    }) : null;
  const messageDrafts = Array.isArray(PACK.messageDrafts) && PACK.messageDrafts.length ? draftBlock("Suggestions from your CV",
    h("ol", { class: "draft-list" }, PACK.messageDrafts.slice(0, 3).map(t => h("li", null, t))),
    "Use these",
    () => {
      let filled = 0;
      PACK.messageDrafts.slice(0, 3).forEach((t, i) => {
        if (String(state.prep.messages[i] || "").trim()) return;
        state.prep.messages[i] = t;
        const input = byId("prep-message-" + (i + 1));
        if (input) input.value = t;
        filled++;
      });
      if (filled) saveSoon();
      return filled;
    }) : null;
  const messages = state.prep.messages.slice(0, 3).map((m, i) => {
    const id = "prep-message-" + (i + 1);
    const input = h("input", {
      type: "text", id, autocomplete: "off", placeholder: placeholders[i],
      oninput: e => { state.prep.messages[i] = e.target.value; saveSoon(); }
    });
    input.value = m;
    return h("div", { class: "field" }, h("label", { class: "field-label", for: id }, "Message " + (i + 1)), input);
  });

  const askCount = h("p", { class: "small muted", id: "ask-count" }, askCountText());
  const askGroups = PACK.askQuestions.map(g => h("div", null,
    h("h3", { class: "display-s group-title" }, g.group),
    h("div", { class: "sheet rows" }, g.items.map(item => checkRow(
      "ask-" + item.id, item.text, null, state.prep.ask.indexOf(item.id) >= 0, false,
      v => {
        const set = new Set(state.prep.ask);
        if (v) set.add(item.id); else set.delete(item.id);
        state.prep.ask = Array.from(set);
        askCount.textContent = askCountText();
        saveSoon();
      }, false)))));
  const ownAsk = h("textarea", {
    id: "prep-own-ask", rows: "3",
    placeholder: "One question per line",
    oninput: e => { state.prep.ownAsk = e.target.value; saveSoon(); }
  });
  ownAsk.value = state.prep.ownAsk || "";

  const checkGroups = PACK.checklist.map(g => h("div", null,
    h("h3", { class: "display-s group-title" }, g.group),
    h("div", { class: "sheet rows" }, g.items.map(item => checkRow(
      "check-" + item.id, item.text, null, !!state.prep.checks[item.id], false,
      v => {
        if (v) state.prep.checks[item.id] = true; else delete state.prep.checks[item.id];
        saveSoon();
      }, true)))));

  const introHints = PACK.introHints || DEFAULT_INTRO_HINTS;

  return h("div", { class: "view" },
    viewHead("Get ready", lead),
    section("Your 60 second intro", "This is your answer to “Tell us about yourself”. Cover these " + numberWord(introHints.length) + " points.",
      h("div", { class: "cue sheet-pad" },
        h("ul", { class: "hints" }, introHints.map(t => h("li", null, t))),
        introDraft,
        h("div", { class: "field" }, h("label", { class: "field-label", for: "prep-intro" }, "Your intro"), intro),
        meter)),
    section("Three things they should remember", "If the interviewers remember only three things about you, what should they be? Repeat them in your closing answer.",
      h("div", { class: "sheet sheet-pad" }, messageDrafts, messages)),
    section("Questions to ask them", "Pick three or four.",
      askCount,
      h("div", { class: "ask-groups" }, askGroups),
      h("div", { class: "sheet sheet-pad" }, h("div", { class: "field" }, h("label", { class: "field-label", for: "prep-own-ask" }, "Your own questions"), ownAsk))),
    section("Checklist", null, h("div", { class: "ask-groups" }, checkGroups)));
}

/* ---------- Cheat sheet ---------- */

function renderTerms() {
  return h("div", { class: "view" },
    viewHead("Cheat sheet", PACK.termsLead || "Plain explanations of terms that may come up in the interview."),
    h("dl", { class: "sheet rows" }, PACK.terms.map(t => h("div", { class: "term" },
      h("dt", { class: "display-s" }, t.term),
      h("dd", null, t.text)))));
}

/* ---------- Copy all notes and clear ---------- */

function buildNotes() {
  const L = [];
  L.push("# Interview notes: " + PACK.role);
  L.push("");
  L.push("Copied " + fmtDate(new Date()) + " from the " + APP.name.toLowerCase() + " v" + APP.version + ".");
  L.push("");
  if (state.prep.intro.trim()) {
    L.push("## My 60 second intro", "", state.prep.intro.trim(), "");
  }
  const msgs = state.prep.messages.map(m => String(m || "").trim()).filter(Boolean);
  if (msgs.length) {
    L.push("## Three things they should remember", "");
    msgs.forEach((m, i) => L.push((i + 1) + ". " + m));
    L.push("");
  }
  const stories = allStoryIds().filter(id => storyStatus(id) !== "empty");
  if (stories.length) {
    L.push("## My stories", "");
    stories.forEach(id => {
      const st = state.stories[id];
      L.push("### " + storyLabel(id) + (st.title.trim() ? ": " + st.title.trim() : ""));
      L.push("");
      STAR.forEach(p => { if (String(st[p.key] || "").trim()) L.push("**" + p.label + ".** " + st[p.key].trim(), ""); });
      const shows = (st.tags || []).map(focusName).filter(Boolean);
      if (shows.length) L.push("*Also shows " + shows.join(", ") + ".*", "");
    });
  }
  const asks = PACK.askQuestions.flatMap(g => g.items).filter(i => state.prep.ask.indexOf(i.id) >= 0).map(i => i.text);
  const own = String(state.prep.ownAsk || "").split("\n").map(s => s.trim()).filter(Boolean);
  if (asks.length || own.length) {
    L.push("## Questions to ask them", "");
    asks.concat(own).forEach(q => L.push("- " + q));
    L.push("");
  }
  const studied = studyTopics().filter(t => state.study[t.id]);
  if (studied.length) {
    L.push("## Study topics I can explain", "");
    studied.forEach(t => L.push("- " + t.title));
    L.push("");
  }
  const qs = PACK.questions.filter(q => state.qNotes[q.id] || state.qStatus[q.id]);
  if (qs.length) {
    L.push("## Practice questions", "");
    qs.forEach(q => {
      L.push("### " + q.q);
      L.push("");
      if (state.qStatus[q.id]) L.push("How it went: " + RATINGS.find(r => r.value === state.qStatus[q.id]).label, "");
      if (state.qNotes[q.id]) L.push(state.qNotes[q.id].trim(), "");
    });
  }
  const played = PACK.scenarios.filter(s => state.scenarios[s.id]);
  if (played.length) {
    L.push("## Scenarios", "");
    played.forEach(s => { const r = state.scenarios[s.id]; L.push("- " + s.code + " " + s.title + ": " + r.strong + " of " + r.total + " strongest picks last time"); });
    L.push("");
  }
  if (L.length <= 4) L.push("No notes written yet.");
  return L.join("\n");
}

async function copyAllNotes() {
  const text = buildNotes();
  const ok = await copyText(text);
  const fb = byId("copy-fallback");
  if (ok) {
    fb.hidden = true;
    flashCopied(byId("copy-all"));
    toast("Notes copied. Paste them into a document to keep a copy.");
    return;
  }
  const ta = h("textarea", { id: "copy-fallback-text", readonly: true, "aria-label": "All your notes" });
  ta.value = text;
  fb.replaceChildren(
    h("p", null, "Copying is blocked here. Select the text below and copy it with Ctrl+C (Cmd+C on a Mac)."),
    ta,
    h("div", null, h("button", { type: "button", class: "btn btn-small", onclick: () => { fb.hidden = true; } }, "Close")));
  fb.hidden = false;
  ta.focus();
  ta.select();
}

function setupClear() {
  const zone = byId("clear-zone");
  const closed = () => zone.replaceChildren(
    h("button", { type: "button", class: "btn-link small", onclick: open }, "Clear all my notes"));
  const open = () => {
    zone.replaceChildren(h("div", { class: "confirm", role: "group", "aria-label": "Clear all notes" },
      h("p", null, "This removes your stories, notes, ratings and ticks from this browser. Copy your notes first if you want to keep them."),
      h("div", { class: "confirm-actions" },
        h("button", {
          type: "button", class: "btn btn-small btn-danger", id: "clear-confirm",
          onclick: () => {
            state = defaultState();
            mock = null;
            play = null;
            stopTicker();
            saveNow();
            showStaleNote();
            closed();
            route();
            toast("All notes cleared.");
          }
        }, "Clear everything"),
        h("button", { type: "button", class: "btn btn-small", onclick: closed }, "Cancel"))));
    const confirmBtn = byId("clear-confirm");
    if (confirmBtn) confirmBtn.focus();
  };
  closed();
}

/* ---------- Start ---------- */

const RENDER = {
  brief: renderBrief,
  study: renderStudy,
  stories: renderStories,
  questions: renderQuestions,
  scenarios: renderScenarios,
  mock: renderMock,
  "ai-practice": renderAI,
  prep: renderPrep,
  terms: renderTerms
};

function init() {
  loadState();
  byId("brand-meta").textContent = PACK.role;
  buildNav(byId("nav"), false);
  buildNav(byId("nav-drawer"), true);
  byId("copy-all").prepend(icon("copy"));
  setSaveStatus();
  showStaleNote();
  byId("copy-all").addEventListener("click", copyAllNotes);
  setupClear();
  setupDrawer();
  setupDisclosures();
  placeTools();
  if (NARROW) {
    const onWidth = () => {
      if (!NARROW.matches && drawerState.open) closeDrawer(true);
      placeTools();
      moveMarker(byId("nav"), "jump");
    };
    if (NARROW.addEventListener) NARROW.addEventListener("change", onWidth);
    else if (NARROW.addListener) NARROW.addListener(onWidth);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => moveMarker(byId("nav"), "jump"));
  /* Lets :active press states show the moment a finger lands in iOS Safari. */
  document.addEventListener("touchstart", () => {}, { passive: true });
  const skip = document.querySelector(".skip-link");
  if (skip) skip.addEventListener("click", () => byId("main").focus());
  activeView = viewFromHash() || "brief";
  window.addEventListener("hashchange", onHashChange);
  route();
}

/*
  A coach file carries its pack and starts at once. A blank coach has no pack, so the Set up
  screen (setup.js, only in the blank build) collects the role and then calls start with it.
*/
let started = false;
function start(pack) {
  if (started) return;
  started = true;
  PACK = pack;
  STORE_KEY = "client-interview-coach:" + PACK.id + ":v1";
  FOCUS_ITEMS = PACK.qualities.map(q => ({ id: q.id, name: q.name }))
    .concat(PACK.activities.map(a => ({ id: a.id, name: a.name })));
  init();
}

/* The phone header only shows its edge once content has scrolled under it. */
function setupScrollEdge() {
  const bar = byId("topbar");
  if (!bar) return;
  let scrolled = null;
  const check = () => {
    const now = (window.scrollY || document.documentElement.scrollTop || 0) > 4;
    if (now === scrolled) return;
    scrolled = now;
    bar.classList.toggle("is-scrolled", now);
  };
  window.addEventListener("scroll", check, { passive: true });
  check();
}

function boot() {
  setupScrollEdge();
  const pack = readPack();
  if (pack) start(pack);
  else if (typeof window.coachSetup === "function") window.coachSetup(start);
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

</script>
