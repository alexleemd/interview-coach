<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Interview Coach</title>
<meta name="description" content="Client interview prep: study topics, stories, practice questions, branching scenarios, a timed mock interview and a ChatGPT practice prompt.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F4F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000033" media="(prefers-color-scheme: dark)">
<style>
/*
  Look: a native feeling app in the firm's navy, white and sky blue.
  Layout: a sidebar holds the eight steps beside one centered reading column. On phones the
  sidebar becomes a panel that slides in from the left, under a translucent header.
  Surfaces: grouped lists on white cards over a cool grey ground, with hairlines instead of boxes.
  Translucent materials are kept for the parts that float over content: the phone header, the
  panel and the toast. The sidebar on a wide screen has nothing passing under it, so it is solid.
  Color follows the firm's CV template. Navy is the ink and the main action. Sky blue has two
  jobs only: it marks what is selected, and it highlights a phrase. Text the coach wrote for you,
  its drafts and its feedback, sits in an outlined note.
  Type: the system font of the device (San Francisco on Apple devices, Segoe UI on Windows), so
  the file embeds no fonts and still works offline. Tracking tightens as the size grows.
  Motion lives in app.js, as springs that start from what is on screen. The styles here only
  handle press, hover and state changes, and each one has a calmer form for reduced motion.
*/

:root {
  /* Color: the firm's navy (#000033) and white, with its sky blue (#A6E3FA) for selection */
  color-scheme: light;
  --bg: #F2F4F9;
  --surface: #FFFFFF;
  --surface-2: #F5F6FA;
  --ink: #000033;
  --ink-2: rgba(0, 0, 51, 0.68);
  --ink-3: rgba(0, 0, 51, 0.56);
  --ink-4: rgba(0, 0, 51, 0.3);
  --ring: rgba(0, 0, 51, 0.42);
  --hairline: rgba(0, 0, 51, 0.1);
  --hairline-strong: rgba(0, 0, 51, 0.18);
  --fill: rgba(0, 0, 51, 0.05);
  --fill-2: rgba(0, 0, 51, 0.08);
  --fill-3: rgba(0, 0, 51, 0.13);
  --tint: #000033;
  --tint-hover: #1B1B5E;
  --on-tint: #FFFFFF;
  --sky: #A6E3FA;
  --sky-deep: #5BC8F2;
  --on-sky: #000033;
  --select: rgba(166, 227, 250, 0.66);
  --sky-soft: rgba(166, 227, 250, 0.3);
  --mark: rgba(166, 227, 250, 0.6);
  --mark-ink: #000033;
  /* Status inks are dark enough to read at 4.5:1 on their own soft fill over any ground they sit on. */
  --good: #176B36;
  --good-soft: rgba(40, 180, 90, 0.16);
  --warn: #8A5000;
  --warn-soft: rgba(255, 159, 10, 0.18);
  --bad: #B3241A;
  --bad-soft: rgba(255, 59, 48, 0.12);
  --focus: #000033;
  --focus-halo: rgba(91, 200, 242, 0.45);

  /* Materials and depth */
  --material-bar: rgba(242, 244, 249, 0.8);
  --material-thick: rgba(255, 255, 255, 0.86);
  --material-hud: rgba(0, 0, 51, 0.84);
  --on-hud: #FFFFFF;
  --hud-icon: #A6E3FA;
  --edge-light: rgba(255, 255, 255, 0.7);
  --scrim: rgba(0, 0, 40, 0.3);
  --thumb: #FFFFFF;
  --icon-bg: linear-gradient(155deg, #2A2A86 0%, #000033 64%);
  --icon-ink: #FFFFFF;
  --shadow-card: 0 0 0 1px rgba(0, 0, 51, 0.05), 0 1px 2px rgba(0, 0, 51, 0.04), 0 3px 10px -4px rgba(0, 0, 51, 0.06);
  --shadow-panel: 0 0 0 1px rgba(0, 0, 51, 0.06), 0 1px 2px rgba(0, 0, 51, 0.04), 0 14px 36px -18px rgba(0, 0, 51, 0.22);
  --shadow-raised: 0 0 0 1px rgba(0, 0, 51, 0.05), 0 2px 4px rgba(0, 0, 51, 0.04), 0 18px 40px -16px rgba(0, 0, 51, 0.24);
  --shadow-float: 0 0 0 1px rgba(0, 0, 51, 0.06), 0 4px 10px rgba(0, 0, 51, 0.07), 0 30px 70px -20px rgba(0, 0, 51, 0.4);
  --shadow-thumb: 0 0 0 0.5px rgba(0, 0, 51, 0.06), 0 1px 3px rgba(0, 0, 51, 0.14), 0 3px 8px -2px rgba(0, 0, 51, 0.1);

  /* Type: the device's own interface font */
  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;

  /* Shape and layout */
  --r-xs: 0.4375rem;
  --r-s: 0.625rem;
  --r-m: 0.875rem;
  --r-l: 1.25rem;
  --r-xl: 1.75rem;
  --rail-w: 17.5rem;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --press: 110ms;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
/* The page places its own content clear of notches and system bars. */
:root { padding: 0; }
html {
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 1.5rem);
  /* Scrollbars and native controls take their color from the palette. */
  scrollbar-color: var(--ink-4) transparent;
  accent-color: var(--tint);
}
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 1.0625rem;
  line-height: 1.47;
  font-kerning: normal;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding: 0 var(--gutter-r) 0 var(--gutter-l);
}
/* Content scrolls under the system bar at the top, behind a strip of the header material. */
body::before {
  content: ""; position: fixed; inset: 0 0 auto; z-index: 25;
  height: env(safe-area-inset-top, 0px);
  background: var(--material-bar);
  -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
}
::selection { background: var(--sky); color: #000033; }
[hidden] { display: none !important; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure, fieldset { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
p, li, dd { text-wrap: pretty; }
fieldset { border: 0; padding: 0; min-width: 0; }
legend { padding: 0; }
a { color: var(--ink); text-decoration-color: var(--sky-deep); text-decoration-thickness: 2px; text-underline-offset: 0.2em; }
a, button, summary, label { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
strong { font-weight: 600; }
mark {
  color: var(--mark-ink);
  background: var(--mark);
  padding: 0.06em 0.24em;
  margin: 0 -0.04em;
  border-radius: 0.3em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
.icon { width: 1em; height: 1em; flex: none; }
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link { position: absolute; left: -9999px; top: calc(0.75rem + env(safe-area-inset-top, 0px)); z-index: 60; border: 0; font: inherit; font-size: 0.9375rem; font-weight: 600; cursor: pointer; }
.skip-link:focus {
  left: var(--gutter-l);
  background: var(--surface); color: var(--ink);
  padding: 0.625rem 1rem; border-radius: 999px; box-shadow: var(--shadow-float);
}

/* ---------- Type scale (tracking tightens as size grows, leading shrinks) ---------- */
.display-xl { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.25rem, 1.55rem + 3vw, 3.5rem); line-height: 1.05; letter-spacing: -0.024em; }
.display-l { font-family: var(--font-display); font-weight: 700; font-size: clamp(2rem, 1.7rem + 1.3vw, 2.5rem); line-height: 1.1; letter-spacing: -0.021em; }
.display-m { font-family: var(--font-display); font-weight: 700; font-size: 1.375rem; line-height: 1.2; letter-spacing: -0.014em; }
.display-s { font-family: var(--font-display); font-weight: 600; font-size: 1.0625rem; line-height: 1.3; letter-spacing: -0.008em; }
.lead { font-size: clamp(1.0625rem, 1rem + 0.3vw, 1.1875rem); line-height: 1.45; letter-spacing: -0.004em; color: var(--ink-2); max-width: 38em; }
.body-s { font-size: 0.9375rem; line-height: 1.47; }
.small { font-size: 0.8125rem; line-height: 1.4; }
.label { font-size: 0.8125rem; font-weight: 600; line-height: 1.3; color: var(--ink-2); }
.muted { color: var(--ink-2); }

/* ---------- Frame ---------- */
.app {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  column-gap: clamp(1.25rem, 3vw, 3rem);
}
.topbar { display: none; }
/* The sidebar is its own pane and stays put while the content scrolls. Nothing passes under it, so it is solid. */
.rail {
  position: sticky; top: calc(0.75rem + env(safe-area-inset-top, 0px)); align-self: start;
  height: calc(100vh - 1.5rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  height: calc(100dvh - 1.5rem - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  margin-left: calc(0.75rem - var(--gutter-l));
  overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin;
  display: flex; flex-direction: column; gap: 1.375rem;
  padding: 1.125rem 0.75rem 1rem;
  border-radius: var(--r-xl);
  background: var(--surface);
  box-shadow: var(--shadow-panel);
}
main {
  min-width: 0; outline: none;
  padding-block: calc(3.5rem + env(safe-area-inset-top, 0px)) calc(5rem + env(safe-area-inset-bottom, 0px));
}
main:focus, main:focus-visible { outline: none; }
.view-host { position: relative; }
main > .view-host { max-width: 44rem; margin-inline: auto; }
.view { --view-gap: 2.75rem; display: flex; flex-direction: column; gap: var(--view-gap); }
/* Closing notes sit close under the section they belong to. */
.view > p.small { margin-top: calc(1.25rem - var(--view-gap)); padding-inline: 0.25rem; }
.view > p.small + p.small { margin-top: calc(0.5rem - var(--view-gap)); }

/* ---------- Brand ---------- */
.brand { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 0.75rem; padding: 0.125rem 0.375rem 0; }
.brand-mark {
  display: inline-grid; place-items: center; flex: none;
  width: 2.5rem; height: 2.5rem; border-radius: 0.6875rem;
  background: var(--icon-bg); color: var(--icon-ink);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 1px 2px rgba(0, 0, 51, 0.18), 0 8px 16px -8px rgba(0, 0, 51, 0.5);
}
.brand-mark svg { width: 1.3125rem; height: 1.3125rem; }
.brand-name { display: block; font-family: var(--font-display); font-weight: 600; font-size: 1.0625rem; line-height: 1.2; letter-spacing: -0.012em; }
.brand-meta { display: block; margin-top: 0.0625rem; font-size: 0.8125rem; line-height: 1.3; color: var(--ink-2); }

/* ---------- The steps (a selection pill follows the step you are on) ---------- */
.route-nav { position: relative; display: flex; flex-direction: column; gap: 0.75rem; }
.route-hl {
  position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 0;
  background: var(--select);
  border-radius: 0.75rem;
  transform-origin: center;
  pointer-events: none; opacity: 0; will-change: transform;
}
.route { list-style: none; margin: 0; padding: 0; position: relative; display: flex; flex-direction: column; gap: 0.125rem; }
.route-ref { padding-top: 0.75rem; border-top: 1px solid var(--hairline); }
.route-link {
  position: relative; z-index: 1;
  display: grid; grid-template-columns: 1.5rem minmax(0, 1fr) auto; align-items: center; column-gap: 0.75rem;
  min-height: 2.5rem; padding: 0.375rem 0.75rem 0.375rem 0.5rem; border-radius: 0.75rem;
  color: var(--ink); font-size: 0.9375rem; font-weight: 500; letter-spacing: -0.006em; text-decoration: none;
  appearance: none; width: 100%; border: 0; background: transparent;
  font-family: inherit; line-height: 1.3; text-align: left; cursor: pointer;
  transition: background-color 220ms ease, transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.route-link:active { transform: scale(0.98); transition-duration: var(--press); }
.route-link[aria-current="page"] { font-weight: 600; }
.route-progress { font-size: 0.8125rem; font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }

.dot {
  display: inline-grid; place-items: center; flex: none;
  width: 1.5rem; height: 1.5rem; border-radius: 50%;
  box-shadow: inset 0 0 0 1.5px var(--ring);
  color: var(--ink-2); font-size: 0.75rem; font-weight: 600; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.dot .icon { width: 0.8125rem; height: 0.8125rem; }
.dot.is-done { background: var(--tint); box-shadow: none; color: var(--on-tint); }
.dot-ref { border-radius: 0.4375rem; }
[aria-current="page"] > .dot-slot > .dot:not(.is-done) { color: var(--ink); }
/* A step that is under way: the ring fills clockwise with the share that is done. */
.dot.has-share { position: relative; box-shadow: inset 0 0 0 1.5px var(--ink-4); }
.dot.has-share::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--tint) calc(var(--share, 0) * 1turn), transparent 0);
  -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 2.75px), #000 calc(100% - 2.25px));
  mask: radial-gradient(closest-side, transparent calc(100% - 2.75px), #000 calc(100% - 2.25px));
}
.dot-slot { display: inline-grid; }
.plan-row .dot, .next .dot, .kit-row .dot, .stage-dot { width: 1.75rem; height: 1.75rem; font-size: 0.8125rem; }
.plan-row .dot .icon, .next .dot .icon, .kit-row .dot .icon, .stage-dot .icon { width: 0.9375rem; height: 0.9375rem; }

/* ---------- Notes tools ---------- */
.tools { display: flex; flex-direction: column; gap: 0.75rem; margin-top: auto; padding: 1rem 0.375rem 0; border-top: 1px solid var(--hairline); }
.save-status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--ink-2); }
.save-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--good); flex: none; transition: background-color 200ms ease; }
.save-status.is-saving .save-dot { background: var(--ink-4); }
.save-status.is-blocked .save-dot { background: var(--bad); }
.tools-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.875rem; }
.copy-fallback { display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.8125rem; color: var(--ink-2); }
.copy-fallback textarea { min-height: 9rem; font-size: 0.75rem; }
.confirm { display: flex; flex-direction: column; gap: 0.75rem; padding: 0.875rem; border-radius: var(--r-m); background: var(--bad-soft); font-size: 0.875rem; line-height: 1.4; }
.confirm-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }

/* ---------- Buttons (feedback lands on press) ---------- */
.btn {
  appearance: none; -webkit-appearance: none; position: relative;
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  min-height: 2.75rem; max-width: 100%; padding: 0.5rem 1.25rem;
  border: 0; border-radius: 1.375rem;
  background: var(--fill-2); color: var(--ink);
  font: inherit; font-size: 0.9375rem; font-weight: 600; line-height: 1.2; letter-spacing: -0.006em;
  cursor: pointer; text-decoration: none; text-align: center;
  transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1), background-color 180ms ease, color 180ms ease, box-shadow 180ms ease, opacity 180ms ease;
}
.btn:active { transform: scale(0.97); background: var(--fill-3); transition-duration: var(--press); }
.btn .icon { width: 1.0625em; height: 1.0625em; }
.btn-primary { background: var(--tint); color: var(--on-tint); }
.btn-primary:active { background: var(--tint-hover); }
.btn-quiet { background: transparent; color: var(--ink); padding-inline: 0.875rem; }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.btn-danger:active { background: var(--bad-soft); opacity: 0.8; }
.btn-small { min-height: 2.125rem; padding: 0.375rem 0.9375rem; font-size: 0.8125rem; letter-spacing: 0; }
.btn-large { min-height: 3.25rem; padding: 0.625rem 1.75rem; border-radius: 1.625rem; font-size: 1.0625rem; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn-link {
  appearance: none; background: none; border: 0; padding: 0.25rem 0; font: inherit; font-weight: 500;
  color: var(--ink); cursor: pointer; border-radius: 0.25rem;
  text-decoration: underline; text-decoration-color: var(--hairline-strong); text-decoration-thickness: 1.5px; text-underline-offset: 0.22em;
  transition: opacity 160ms ease, text-decoration-color 160ms ease;
}
.btn-link:active { opacity: 0.55; transition-duration: var(--press); }
.btn-link.small { font-size: 0.8125rem; color: var(--ink-2); }
.btn-row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.625rem 0.75rem; }

/* ---------- Sections and surfaces ---------- */
.hero, .view-head { display: flex; flex-direction: column; gap: 0.875rem; }
.section { display: flex; flex-direction: column; gap: 1rem; }
.section-head { display: flex; flex-direction: column; gap: 0.3125rem; padding-inline: 0.25rem; }
.section-sub { font-size: 0.9375rem; line-height: 1.47; color: var(--ink-2); max-width: 35em; }
.block { display: flex; flex-direction: column; gap: 0.25rem; }
.bullets { padding-left: 1.25rem; display: flex; flex-direction: column; gap: 0.375rem; }
.bullets li::marker { color: var(--ink-3); }
.bullets.roomy { gap: 0.875rem; }
.stack { display: flex; flex-direction: column; gap: 0.75rem; }
.sheet { background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow-card); min-width: 0; overflow: hidden; }
.sheet:is(ul, ol):not(.steps-list) { list-style: none; margin: 0; padding: 0; }
.sheet-pad { padding: 1.375rem; display: flex; flex-direction: column; gap: 1.125rem; }
/* Rows in a grouped list are split by a hairline that starts at the text, not at the edge. */
.rows > * + * {
  background-image: linear-gradient(var(--hairline), var(--hairline));
  background-repeat: no-repeat;
  background-position: right top;
  background-size: calc(100% - var(--row-inset, 1.375rem)) 1px;
}
.check-row.cov-row { grid-template-columns: minmax(0, 1fr) auto; align-items: center; cursor: default; }
/* A card inside a card sits back as a well. */
.cue-body .sheet, .sheet .sheet { background: var(--fill); box-shadow: none; border-radius: var(--r-m); }

/* ---------- Brief ---------- */
/* The plan is one line per step: its number, its name, how long it takes and how far you are. */
.plan { list-style: none; margin: 0; padding: 0; --row-inset: 4.125rem; }
.plan-row {
  appearance: none; width: 100%; border: 0; background: transparent; font: inherit; text-align: left;
  display: grid; grid-template-columns: 1.75rem minmax(0, 1fr) auto 0.5rem; column-gap: 1rem; align-items: center;
  min-height: 3.25rem; padding: 0.625rem 1.375rem; color: var(--ink); text-decoration: none;
  transition: background-color 260ms ease;
}
.plan-row::after { content: ""; grid-column: 4; width: 0.5rem; height: 0.5rem; }
button.plan-row { cursor: pointer; }
button.plan-row::after { border-right: 2px solid var(--ink-4); border-bottom: 2px solid var(--ink-4); border-radius: 1px; transform: rotate(-45deg); }
button.plan-row:active { background: var(--fill-2); transition-duration: 0s; }
.plan-text { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.75rem; min-width: 0; }
.plan-title { font-weight: 600; letter-spacing: -0.008em; }
.plan-time { font-size: 0.8125rem; color: var(--ink-2); }
.plan-status { grid-column: 3; font-size: 0.8125rem; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.def-row { display: grid; grid-template-columns: minmax(8.5rem, 11.5rem) minmax(0, 1fr); column-gap: 1.5rem; row-gap: 0.625rem; padding: 1.375rem; }
.def-term { display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; }
.def-body { display: flex; flex-direction: column; gap: 0.875rem; min-width: 0; }
/* A link inside a sentence */
.link-btn {
  appearance: none; display: inline; padding: 0; border: 0; background: none; border-radius: 0.25rem;
  font: inherit; font-weight: 600; color: var(--ink); text-align: left; cursor: pointer;
  text-decoration: underline; text-decoration-color: var(--sky-deep); text-decoration-thickness: 2px; text-underline-offset: 0.2em;
  transition: opacity 160ms ease;
}
.link-btn:active { opacity: 0.55; transition-duration: var(--press); }
/* The same link as a row of shortcuts to another step */
.link-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.link-row .link-btn {
  display: inline-flex; align-items: center; gap: 0.4375rem;
  min-height: 2rem; padding: 0.3125rem 0.75rem 0.3125rem 0.875rem; border-radius: 1rem;
  background: var(--fill-2); font-size: 0.875rem; line-height: 1.3; text-decoration: none;
  transition: background-color 180ms ease, transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.link-row .link-btn::after {
  content: ""; flex: none; width: 0.375rem; height: 0.375rem; margin-right: 0.125rem;
  border-right: 1.75px solid currentColor; border-bottom: 1.75px solid currentColor; border-radius: 1px;
  transform: rotate(-45deg); opacity: 0.55;
}
.link-row .link-btn:active { opacity: 1; transform: scale(0.97); background: var(--fill-3); transition-duration: var(--press); }

/* ---------- Tags ---------- */
/* A tag is a pill on one line. A long name wraps onto a second line inside it instead of running off the screen. */
.tag {
  display: inline-flex; align-items: center;
  min-height: 1.375rem; max-width: 100%; padding: 0.125rem 0.5625rem; border-radius: 0.6875rem;
  font-size: 0.75rem; font-weight: 600; line-height: 1.3; letter-spacing: 0.004em; overflow-wrap: anywhere;
  background: var(--fill-2); color: var(--ink-2);
}
.tag-outline { background: transparent; box-shadow: inset 0 0 0 1px var(--hairline-strong); }
.tag-good { background: var(--good-soft); color: var(--good); }
.tag-warn { background: var(--warn-soft); color: var(--warn); }
.tag-bad { background: var(--bad-soft); color: var(--bad); }
.tag-accent { color: var(--ink); }
.tag-row { display: flex; flex-wrap: wrap; gap: 0.375rem; align-items: center; }

/* ---------- Disclosures (spring height, the chevron turns as they open) ---------- */
details.anim { --open: 0; }
details.anim[open] { --open: 1; }
details.is-animating { overflow: hidden; }
.chev { width: 1rem; height: 1rem; color: var(--ink-3); flex: none; transform: rotate(calc(var(--open) * 90deg)); }
.cue { background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow-card); }
.cue > summary, .qrow > summary {
  list-style: none; cursor: pointer;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 1rem; align-items: center;
  min-height: 3.75rem; padding: 1rem 1.375rem;
  transition: background-color 260ms ease;
}
.cue > summary { border-radius: var(--r-l); }
.cue[open] > summary { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.cue > summary::-webkit-details-marker, .qrow > summary::-webkit-details-marker { display: none; }
.cue > summary:active, .qrow > summary:active { background: var(--fill-2); transition-duration: 0s; }
.cue > summary:focus-visible, .qrow > summary:focus-visible, button.plan-row:focus-visible { outline-offset: -3px; border-radius: 1rem; }
.cue-body {
  margin: 0 1.375rem; padding: 1.25rem 0 1.375rem; border-top: 1px solid var(--hairline);
  display: flex; flex-direction: column; gap: 1.125rem; opacity: var(--open);
}
.cue-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.5rem; }
.sum-main { display: flex; flex-direction: column; gap: 0.3125rem; min-width: 0; }
.sum-side { display: flex; align-items: center; gap: 0.75rem; }
.story-title { font-weight: 600; letter-spacing: -0.008em; }
.story-title.is-empty { color: var(--ink-2); font-weight: 400; letter-spacing: 0; }
.story-prompt { font-weight: 600; letter-spacing: -0.008em; }
.hints { padding-left: 1.25rem; color: var(--ink-2); font-size: 0.9375rem; display: flex; flex-direction: column; gap: 0.25rem; }
.hints li::marker { color: var(--ink-3); }
.star-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.125rem 1rem; }
.example-star { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem 1.375rem; }
.story-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem; }
/* Text the coach drafted for you sits in an outlined note until you make it your own. */
.draft {
  display: flex; flex-direction: column; gap: 0.75rem;
  padding: 1rem 1.125rem; border-radius: var(--r-m);
  box-shadow: inset 0 0 0 1px var(--hairline-strong);
}
.draft-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.125rem 0.75rem; }
.draft-body { display: flex; flex-direction: column; gap: 0.375rem; }
.draft-title { font-weight: 600; }
.draft-line { font-size: 0.9375rem; }
.draft-list { margin: 0; padding-left: 1.25rem; display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.9375rem; }
/* Study: the questions a topic points at, each with how practice went */
.topic-questions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.5rem; }
.topic-questions li { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 0.625rem; font-size: 0.9375rem; }
.pack-error { padding: 1.25rem 1.375rem; border-radius: var(--r-l); background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.undo-row {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem;
  padding: 0.75rem 0.875rem 0.75rem 1.375rem; border-radius: var(--r-l); background: var(--fill-2);
  font-size: 0.9375rem; color: var(--ink-2);
}

/* ---------- Fields ---------- */
.field { display: flex; flex-direction: column; gap: 0.375rem; min-width: 0; }
.field-label { font-size: 0.8125rem; font-weight: 600; color: var(--ink-2); }
.field-help { font-size: 0.8125rem; line-height: 1.4; color: var(--ink-2); max-width: 28rem; text-wrap: pretty; }
input[type="text"], textarea, select {
  width: 100%; font: inherit; font-size: 1rem; line-height: 1.45; color: var(--ink);
  background: var(--surface-2); border: 0; border-radius: var(--r-s);
  box-shadow: inset 0 0 0 1px var(--hairline);
  padding: 0.6875rem 0.875rem;
  caret-color: var(--tint);
  transition: box-shadow 160ms ease, background-color 160ms ease;
}
input[type="text"] { min-height: 2.75rem; }
textarea { min-height: 6rem; resize: vertical; line-height: 1.5; }
/* Fields for text you will say out loud get a little more room between lines. The class keeps its earlier name. */
textarea.ruled { line-height: 1.6; }
input::placeholder, textarea::placeholder { color: var(--ink-3); opacity: 1; }
input[type="text"]:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: none; background: var(--surface);
  box-shadow: inset 0 0 0 1.5px var(--focus), 0 0 0 4px var(--focus-halo);
}
/* A menu button: two small chevrons, one up and one down */
.select-wrap { position: relative; display: block; }
.select-wrap select { appearance: none; -webkit-appearance: none; min-height: 2.75rem; padding: 0 2.5rem 0 0.875rem; font-weight: 500; cursor: pointer; }
.select-wrap::before, .select-wrap::after {
  content: ""; position: absolute; right: 1rem; top: 50%; width: 0.375rem; height: 0.375rem; z-index: 1;
  border-right: 1.75px solid var(--ink-2); border-bottom: 1.75px solid var(--ink-2); border-radius: 1px;
  pointer-events: none;
}
.select-wrap::before { transform: translateY(-115%) rotate(-135deg); }
.select-wrap::after { transform: translateY(15%) rotate(45deg); }
.filters { display: grid; grid-template-columns: repeat(2, minmax(0, 15rem)); gap: 0.75rem 1rem; }
/* How practice stands, as a quiet line of numbers. It is information, so it does not look like a control. */
.count-row { display: flex; flex-wrap: wrap; gap: 0.25rem 0.875rem; padding-inline: 0.25rem; font-size: 0.8125rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ---------- Segmented control (the thumb slides on a spring) ---------- */
.option-row { display: flex; flex-direction: column; align-items: flex-start; gap: 0.5rem; }
.seg {
  position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: auto; gap: 0;
  padding: 0.1875rem; border-radius: 0.75rem; background: var(--fill-2);
  isolation: isolate; max-width: 100%;
}
.seg-thumb {
  position: absolute; top: 0.1875rem; bottom: 0.1875rem; left: 0; z-index: -1; opacity: 0;
  background: var(--thumb); border-radius: 0.5625rem; box-shadow: var(--shadow-thumb);
  will-change: transform;
}
.seg button {
  appearance: none; border: 0; background: transparent; color: var(--ink);
  min-height: 2.125rem; padding: 0.25rem 1.125rem; border-radius: 0.5625rem;
  font: inherit; font-size: 0.9375rem; font-weight: 500; letter-spacing: -0.006em; white-space: nowrap; cursor: pointer;
  transition: opacity 180ms ease;
}
.seg button[aria-pressed="true"] { font-weight: 600; }
.seg button:active { opacity: 0.55; transition-duration: var(--press); }
.seg button[aria-pressed="true"]:active { opacity: 1; }

/* ---------- Check boxes, option cards and chips ---------- */
.box {
  appearance: none; -webkit-appearance: none; flex: none; margin: 0.0625rem 0 0; cursor: pointer;
  width: 1.375rem; height: 1.375rem; border-radius: 0.4375rem;
  background: transparent; box-shadow: inset 0 0 0 1.5px var(--ring);
  display: inline-grid; place-content: center;
  transition: background-color 160ms ease, box-shadow 160ms ease, transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.box::after {
  content: ""; width: 0.375rem; height: 0.6875rem; margin-top: -0.125rem;
  border: solid var(--on-tint); border-width: 0 2.25px 2.25px 0; border-radius: 1px;
  opacity: 0; transform: rotate(45deg) scale(0.6); transition: transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 120ms ease;
}
.box:checked { background: var(--tint); box-shadow: inset 0 0 0 1.5px var(--tint); }
.box:checked::after { opacity: 1; transform: rotate(45deg) scale(1); }
.box:disabled { opacity: 0.4; cursor: not-allowed; }
.check-row {
  display: grid; grid-template-columns: 1.375rem minmax(0, 1fr); column-gap: 0.875rem; align-items: start;
  padding: 0.875rem 1.375rem; cursor: pointer; transition: background-color 260ms ease;
}
.rows:has(> .check-row:not(.cov-row)) { --row-inset: 3.625rem; }
.check-row:not(.cov-row):not(.is-disabled):active { background: var(--fill-2); transition-duration: 0s; }
.check-row:not(.is-disabled):active .box { transform: scale(0.9); transition-duration: var(--press); }
.check-row.is-disabled { cursor: not-allowed; }
.check-text { display: flex; flex-direction: column; gap: 0.125rem; }
.check-main { transition: color 200ms ease; }
.check-sub { font-size: 0.8125rem; color: var(--ink-2); }
.check-row.dim-done:has(.box:checked) .check-main { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-4); }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
.option {
  position: relative; display: flex; flex-direction: column; gap: 0.25rem;
  padding: 1.0625rem 1.25rem 1.125rem 3.125rem; border-radius: var(--r-l);
  background: var(--surface); box-shadow: var(--shadow-card); cursor: pointer;
  transition: box-shadow 200ms ease, background-color 200ms ease, transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.option:active { transform: scale(0.985); transition-duration: var(--press); }
.option-input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.option-dot {
  position: absolute; left: 1.25rem; top: 1.1875rem; width: 1.25rem; height: 1.25rem; border-radius: 50%;
  box-shadow: inset 0 0 0 1.5px var(--ring); transition: box-shadow 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.option:has(.option-input:checked) { background: var(--surface); box-shadow: 0 0 0 2px var(--tint), 0 6px 18px -10px rgba(0, 0, 51, 0.3); }
.option:has(.option-input:checked) .option-dot { box-shadow: inset 0 0 0 0.375rem var(--tint); }
.option:has(.option-input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 4px; }
.option-title { font-weight: 600; letter-spacing: -0.008em; }
.option-sub { font-size: 0.875rem; line-height: 1.4; color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.chip {
  position: relative; display: inline-flex; align-items: center; gap: 0.375rem;
  min-height: 2.125rem; padding: 0 0.875rem; border-radius: 999px;
  background: var(--fill-2); color: var(--ink);
  font-size: 0.875rem; font-weight: 500; cursor: pointer;
  transition: background-color 180ms ease, color 180ms ease, transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.chip:active { transform: scale(0.96); transition-duration: var(--press); }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.chip-check { width: 0; height: 0.875rem; opacity: 0; transition: width 180ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 140ms ease; }
.chip:has(input:checked) { background: var(--sky); color: var(--on-sky); font-weight: 600; }
.chip:has(input:checked) .chip-check { width: 0.875rem; opacity: 1; }
.chip:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- Questions ---------- */
.q-group { display: flex; flex-direction: column; gap: 0.625rem; }
.q-group + .q-group { margin-top: 0.75rem; }
.q-group-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; padding-inline: 0.25rem; }
.qrow > summary { align-items: start; padding: 1rem 1.375rem; }
.qrow > summary > .chev { margin-top: 0.25rem; }
.q-text { font-weight: 600; letter-spacing: -0.008em; }
.q-tags { display: flex; flex-wrap: wrap; gap: 0.375rem; margin-top: 0.5rem; }
.qrow-body {
  margin: 0 1.375rem; padding: 1.125rem 0 1.375rem; border-top: 1px solid var(--hairline);
  display: flex; flex-direction: column; gap: 1.125rem; opacity: var(--open);
}
.rate { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.rate .label { margin-right: 0.25rem; }
.rate .btn[aria-pressed="true"][data-rate="again"] { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1.5px var(--warn); }
.rate .btn[aria-pressed="true"][data-rate="okay"] { background: var(--fill-3); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.rate .btn[aria-pressed="true"][data-rate="strong"] { background: var(--good-soft); color: var(--good); box-shadow: inset 0 0 0 1.5px var(--good); }
.empty { padding: 1.125rem 1.375rem; border-radius: var(--r-l); background: var(--fill); color: var(--ink-2); font-size: 0.9375rem; }
.cue-body .empty, .sheet .empty { border-radius: var(--r-m); padding: 0.875rem 1rem; }

/* ---------- Scenarios: a ticket with the interview as a conversation ---------- */
.queue-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 1.25rem; align-items: center; padding: 1.25rem 1.375rem; }
.queue-text { display: flex; flex-direction: column; gap: 0.3125rem; min-width: 0; }
.queue-teaser { color: var(--ink-2); font-size: 0.9375rem; line-height: 1.4; }
.queue-status { margin-top: 0.375rem; }
.ticket-no { font-weight: 600; font-size: 0.8125rem; letter-spacing: 0.03em; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.play { display: flex; flex-direction: column; gap: 0.75rem; align-items: stretch; }
.play-back { align-self: flex-start; margin-left: -0.375rem; padding-left: 0.625rem; }
.play-back::before {
  content: ""; width: 0.4375rem; height: 0.4375rem; margin-right: -0.125rem;
  border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; border-radius: 1px;
  transform: rotate(45deg);
}
.ticket { background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-card); overflow: hidden; }
.ticket-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem;
  padding: 0.875rem 1.5rem; border-bottom: 1px solid var(--hairline);
  font-size: 0.8125rem; color: var(--ink-2);
}
.ticket-body { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.375rem; }
.transcript { display: flex; flex-direction: column; gap: 0.875rem; }
.entry { display: flex; flex-direction: column; gap: 0.3125rem; min-width: 0; }
.entry-who { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.004em; color: var(--ink-2); padding-inline: 0.875rem; }
.entry-text { min-width: 0; outline: none; }
.entry-text:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
/* The situation and each update are set as plain notes between the turns of the conversation. */
.entry-update { margin-block: 0.25rem; }
.entry-update .entry-who { padding-inline: 0; }
.entry-update .entry-text { font-size: 1rem; line-height: 1.5; max-width: 34rem; }
/* An update opens a new beat, so a hairline sets it off from the turn before it. */
.entry-update:not(:first-child) { margin-top: 0.625rem; padding-top: 1.25rem; border-top: 1px solid var(--hairline); }
/* The interviewer speaks from the left, you answer from the right. */
.entry-them, .entry-you { max-width: min(88%, 34rem); }
.entry-them { align-self: flex-start; }
.entry-you { align-self: flex-end; align-items: flex-end; }
.entry-them .entry-text, .entry-you .entry-text { padding: 0.625rem 0.9375rem; border-radius: 1.25rem; line-height: 1.4; }
.entry-them .entry-text { background: var(--fill-2); font-weight: 500; border-bottom-left-radius: 0.375rem; }
.entry-you .entry-text { background: var(--tint); color: var(--on-tint); border-bottom-right-radius: 0.375rem; }
.entry-coach .entry-who { padding-inline: 0; }
/* What the coach says about your answer is the same kind of outlined note as its drafts, so it never reads as a turn in the conversation. */
.entry-coach .entry-text { box-shadow: inset 0 0 0 1px var(--hairline-strong); border-radius: var(--r-m); padding: 0.875rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
.coach-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
/* The note spans the card, and its lines stay a readable length inside it. */
.entry-coach .entry-text > p { max-width: 34rem; }
.entry-coach .entry-text > .coach-tip { max-width: 32rem; }
.coach-tip { font-size: 0.9375rem; color: var(--ink-2); }
.coach-tip strong { color: var(--ink); }
.decision { display: flex; flex-direction: column; gap: 0.625rem; }
.choice {
  appearance: none; display: grid; grid-template-columns: 1.75rem minmax(0, 1fr); gap: 0.875rem; align-items: start;
  width: 100%; padding: 0.875rem 1.125rem 0.875rem 0.9375rem; border: 0; border-radius: var(--r-m);
  background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--hairline);
  color: var(--ink); font: inherit; font-size: 1rem; line-height: 1.45; text-align: left; cursor: pointer;
  transition: box-shadow 180ms ease, background-color 180ms ease, transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.choice:active { transform: scale(0.985); background: var(--sky-soft); box-shadow: inset 0 0 0 1.5px var(--tint); transition-duration: var(--press); }
.choice-key {
  display: inline-grid; place-items: center; width: 1.75rem; height: 1.75rem; border-radius: 50%;
  background: var(--fill-2); color: var(--ink);
  font-weight: 600; font-size: 0.8125rem;
}
.wrap-up { display: flex; flex-direction: column; gap: 1rem; padding-top: 1.375rem; border-top: 1px solid var(--hairline); }
.score { display: flex; align-items: baseline; gap: 0.625rem; flex-wrap: wrap; }
.score-num { font-family: var(--font-display); font-weight: 700; font-size: 3rem; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.score-of { font-weight: 600; color: var(--ink-2); }

/* ---------- Mock interview: a card you throw into a tray ---------- */
.deck { display: flex; flex-direction: column; gap: 1.125rem; }
.card-slot { position: relative; }
.card-q {
  position: relative; background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-raised);
  touch-action: pan-y; user-select: none; -webkit-user-select: none; cursor: grab; will-change: transform;
  transition: box-shadow 220ms ease;
}
.card-q.is-dragging { cursor: grabbing; box-shadow: var(--shadow-float); }
.card-q button { cursor: pointer; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; padding: 1.25rem 1.75rem 0; }
.card-body { padding: 1rem 1.75rem 1.75rem; display: flex; flex-direction: column; gap: 1.5rem; }
.card-question { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.625rem, 1.25rem + 1.8vw, 2.25rem); line-height: 1.14; letter-spacing: -0.021em; outline: none; }
.clock { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: end; column-gap: 1rem; row-gap: 0.75rem; }
.clock-time { font-family: var(--font-display); font-weight: 600; font-size: 3rem; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.clock-colon { display: inline-block; margin: 0 0.02em; transform: translateY(-0.07em); }
.clock-target { font-size: 0.9375rem; color: var(--ink-2); padding-bottom: 0.3125rem; }
.budget { grid-column: 1 / -1; position: relative; height: 0.375rem; border-radius: 999px; background: var(--fill-2); overflow: hidden; }
.budget-fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 999px; background: var(--tint); transition: width 200ms linear, background-color 300ms ease; }
.budget.is-over .budget-fill { background: var(--warn); }
.budget-tick { position: absolute; top: 0; bottom: 0; left: 66.667%; width: 2px; background: var(--surface); }
/* The mark on the bar is the time to aim for, so that time is written under it. */
.budget-mark {
  grid-column: 1 / -1; justify-self: start; margin: -0.375rem 0 0 66.667%; transform: translateX(-50%);
  font-size: 0.75rem; line-height: 1.2; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.guide { display: flex; flex-direction: column; gap: 0.875rem; padding: 1rem 1.125rem; border-radius: var(--r-m); background: var(--fill); user-select: text; -webkit-user-select: text; cursor: auto; }
.trays-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.75rem; padding-inline: 0.25rem; }
.trays { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.625rem; }
.tray {
  appearance: none; min-height: 4rem; padding: 0.5rem 0.75rem;
  border: 0; border-radius: var(--r-l); background: var(--fill-2); box-shadow: inset 0 0 0 1.5px transparent;
  color: var(--ink); font: inherit; font-size: 0.9375rem; font-weight: 600; line-height: 1.25; letter-spacing: -0.006em; cursor: pointer;
  display: grid; place-items: center; text-align: center;
  transition: background-color 180ms ease, box-shadow 180ms ease, color 180ms ease, transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.tray:active { transform: scale(0.97); transition-duration: var(--press); }
/* The tray a card is heading for grows a little to meet it. */
.tray.is-target { transform: scale(1.04); }
.tray[data-rate="again"].is-target { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1.5px var(--warn); }
.tray[data-rate="okay"].is-target { background: var(--fill-3); box-shadow: inset 0 0 0 1.5px var(--ink-2); }
.tray[data-rate="strong"].is-target { background: var(--good-soft); color: var(--good); box-shadow: inset 0 0 0 1.5px var(--good); }
.mock-setup { gap: 1.375rem; padding: 1.5rem; }
.result-list { list-style: none; padding: 0; margin: 0; }
.result-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 0.375rem 0.875rem; padding: 0.8125rem 0; border-top: 1px solid var(--hairline); font-size: 0.9375rem; }
.result-time { font-size: 0.8125rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ---------- AI practice ---------- */
.steps-list { margin: 0; padding: 1.25rem 1.375rem 1.25rem 2.875rem; display: flex; flex-direction: column; gap: 0.5rem; }
.steps-list li::marker { font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.prompt-box { display: flex; flex-direction: column; gap: 0.875rem; }
.prompt {
  margin: 0; white-space: pre-wrap; overflow-wrap: anywhere;
  font-family: var(--font-text); font-size: 0.875rem; line-height: 1.6; color: var(--ink);
  background: var(--surface); border-radius: var(--r-l); box-shadow: var(--shadow-card);
  padding: 1.25rem 1.375rem; max-height: 28rem; overflow: auto;
}

/* ---------- Prep ---------- */
.meter { display: flex; flex-wrap: wrap; gap: 0.25rem 0.875rem; font-size: 0.8125rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.meter .is-good { color: var(--good); font-weight: 600; }
.meter .is-warn { color: var(--warn); font-weight: 600; }
.ask-groups { display: flex; flex-direction: column; gap: 1.5rem; }
.group-title { margin-bottom: 0.625rem; padding-inline: 0.25rem; }

/* ---------- Cheat sheet ---------- */
.term { padding: 1rem 1.375rem 1.0625rem; display: flex; flex-direction: column; gap: 0.25rem; }
.term dd { margin: 0; color: var(--ink-2); font-size: 0.9375rem; }

/* ---------- Next step ---------- */
.next {
  display: grid; grid-template-columns: 1.75rem minmax(0, 1fr) auto; column-gap: 1rem; align-items: center;
  padding: 1.125rem 1.375rem; border: 0; border-radius: var(--r-l);
  color: var(--ink); text-decoration: none;
  appearance: none; width: 100%; background: var(--surface); box-shadow: var(--shadow-card); font: inherit; text-align: left; cursor: pointer;
  transition: box-shadow 220ms ease, transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.next::after {
  content: ""; width: 0.5625rem; height: 0.5625rem; margin-right: 0.25rem;
  border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); border-radius: 1px;
  transform: rotate(-45deg); transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.next:active { transform: scale(0.985); transition-duration: var(--press); }
.next-text { display: flex; flex-direction: column; gap: 0.125rem; }
.next-kicker { font-size: 0.8125rem; font-weight: 500; color: var(--ink-2); }
.next-title { font-family: var(--font-display); font-weight: 600; font-size: 1.1875rem; line-height: 1.25; letter-spacing: -0.012em; }

/* ---------- Steps panel (phones) ---------- */
.drawer-scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; }
.drawer {
  position: fixed; z-index: 31;
  top: calc(0.5rem + env(safe-area-inset-top, 0px));
  bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px));
  left: calc(0.5rem + env(safe-area-inset-left, 0px));
  width: min(20.5rem, calc(100vw - 3.75rem));
  display: flex; flex-direction: column; overflow: hidden;
  border-radius: var(--r-xl);
  background: var(--material-thick);
  -webkit-backdrop-filter: saturate(180%) blur(36px); backdrop-filter: saturate(180%) blur(36px);
  box-shadow: var(--shadow-float), inset 0 1px 0 var(--edge-light);
  transform: translate3d(-120%, 0, 0); will-change: transform; touch-action: pan-y;
}
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 0.75rem 0.625rem 0.75rem; }
.drawer-body { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 0.5rem 0.75rem 1.125rem; display: flex; flex-direction: column; gap: 1.5rem; }
.drawer-body .route-link { min-height: 2.75rem; font-size: 1rem; }

/* ---------- Toast ---------- */
.toast-host {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
  bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px));
  width: max-content; max-width: min(27rem, calc(100vw - 2rem - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 0.625rem;
  padding: 0.75rem 1.25rem 0.75rem 0.9375rem; border-radius: 1.5rem;
  background: var(--material-hud); color: var(--on-hud);
  -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);
  font-size: 0.9375rem; font-weight: 500; line-height: 1.35; letter-spacing: -0.004em; box-shadow: var(--shadow-float);
  will-change: transform, opacity;
}
.toast-icon { width: 1.25rem; height: 1.25rem; color: var(--hud-icon); }

/* ---------- Pointer hover (only where a pointer can hover, so nothing sticks after a tap) ---------- */
@media (hover: hover) {
  .route-link:not(.is-locked):not([aria-current="page"]):hover { background: var(--fill); }
  .btn:hover { background: var(--fill-3); }
  .btn-primary:hover { background: var(--tint-hover); }
  .btn-quiet:hover { background: var(--fill-2); }
  .btn-danger:hover { background: var(--bad-soft); box-shadow: inset 0 0 0 1.5px var(--bad); }
  .btn[disabled]:hover { background: var(--fill-2); }
  .btn-primary[disabled]:hover { background: var(--tint); }
  .btn-link:hover { text-decoration-color: currentColor; }
  .link-btn:hover { text-decoration-color: currentColor; }
  .link-row .link-btn:hover { background: var(--fill-3); }
  button.plan-row:hover { background: var(--fill); }
  .cue > summary:hover, .qrow > summary:hover { background: var(--fill); }
  .check-row:not(.cov-row):not(.is-disabled):hover { background: var(--fill); }
  .option:not(:has(.option-input:checked)):hover { box-shadow: 0 0 0 1px var(--hairline-strong), 0 6px 18px -10px rgba(0, 0, 51, 0.25); }
  .chip:not(:has(input:checked)):hover { background: var(--fill-3); }
  .seg button:not([aria-pressed="true"]):hover { opacity: 0.7; }
  .choice:hover { background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--tint); }
  .tray:hover { background: var(--fill-3); }
  .tray[data-rate="again"]:hover { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1.5px var(--warn); }
  .tray[data-rate="okay"]:hover { background: var(--fill-3); box-shadow: inset 0 0 0 1.5px var(--ink-2); }
  .tray[data-rate="strong"]:hover { background: var(--good-soft); color: var(--good); box-shadow: inset 0 0 0 1.5px var(--good); }
  .next:hover { box-shadow: var(--shadow-raised); }
  .next:hover::after { transform: translateX(0.1875rem) rotate(-45deg); }
  .peek > summary:hover { text-decoration-color: currentColor; }
}

/* ---------- Narrow screens ---------- */
@media (max-width: 860px) {
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 5.5rem); }
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  /* The header is a translucent bar. Content scrolls under it, and its edge only shows once it does. */
  .topbar {
    display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 0.875rem;
    position: sticky; top: 0; z-index: 20;
    margin-left: calc(-1 * var(--gutter-l));
    margin-right: calc(-1 * var(--gutter-r));
    padding: calc(0.5rem + env(safe-area-inset-top, 0px)) var(--gutter-r) 0 var(--gutter-l);
    background: var(--material-bar);
    -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
    box-shadow: 0 1px 0 transparent;
    transition: box-shadow 240ms ease;
  }
  .topbar.is-scrolled { box-shadow: 0 1px 0 var(--hairline), 0 10px 24px -18px rgba(0, 0, 51, 0.35); }
  .topbar .btn { background: var(--fill-2); }
  .topbar-where { display: flex; flex-direction: column; min-width: 0; }
  .topbar-count { font-size: 0.75rem; font-weight: 500; color: var(--ink-2); line-height: 1.3; font-variant-numeric: tabular-nums; }
  .topbar-title { font-family: var(--font-display); font-weight: 600; font-size: 1.0625rem; line-height: 1.25; letter-spacing: -0.012em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-progress { grid-column: 1 / -1; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0.25rem; padding: 0.625rem 0 0.625rem; }
  .topbar:has(.topbar-progress[hidden]) { padding-bottom: 0.5rem; }
  .bar-step { height: 0.1875rem; border-radius: 999px; background: var(--fill-3); transition: background-color 300ms ease; }
  .bar-step.is-done { background: var(--tint); }
  .bar-step.is-here { background: var(--sky-deep); }
  body::before { display: none; }
  main { padding-block: 1.5rem calc(3.5rem + env(safe-area-inset-bottom, 0px)); }
  .view { --view-gap: 2.25rem; }
}
@media (min-width: 861px) {
  .drawer, .drawer-scrim { display: none !important; }
}
@media (max-width: 720px) {
  .star-grid, .example-star { grid-template-columns: minmax(0, 1fr); }
  .def-row { grid-template-columns: minmax(0, 1fr); }
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .sheet-pad, .mock-setup { padding: 1.125rem; }
  .queue-row { grid-template-columns: minmax(0, 1fr); row-gap: 0.875rem; padding: 1.125rem; }
  .queue-row .btn { justify-self: start; }
  .ticket-body { padding: 1.125rem; }
  .ticket-head { padding: 0.75rem 1.125rem; }
  .card-head { padding: 1.125rem 1.25rem 0; }
  .card-body { padding: 0.875rem 1.25rem 1.25rem; gap: 1.25rem; }
  .clock-time { font-size: 2.5rem; }
  .options { grid-template-columns: minmax(0, 1fr); }
  .result-list li { grid-template-columns: minmax(0, 1fr) auto; }
  .result-list li .result-q { grid-column: 1 / -1; }
  .plan { --row-inset: 3.625rem; }
  .plan-row { grid-template-columns: 1.75rem minmax(0, 1fr) 0.5rem; column-gap: 0.75rem; padding: 0.625rem 1.125rem; }
  .plan-row > .dot { grid-column: 1; grid-row: 1; }
  .plan-text { grid-column: 2; grid-row: 1; }
  .plan-status { grid-column: 2; grid-row: 2; text-align: left; }
  .plan-row::after { grid-column: 3; grid-row: 1 / span 2; }
  .def-row, .cue > summary, .qrow > summary, .term { padding-inline: 1.125rem; }
  .cue-body, .qrow-body { margin-inline: 1.125rem; }
  .check-row { padding-inline: 1.125rem; }
  .rows { --row-inset: 1.125rem; }
  .rows:has(> .check-row:not(.cov-row)) { --row-inset: 3.375rem; }
  .entry-them, .entry-you { max-width: 92%; }
  /* On a phone the status of a card moves under its title, so the title keeps the full width. */
  .cue > summary > .sum-main { grid-column: 1; grid-row: 1; }
  .cue > summary > .sum-side { display: contents; }
  .cue > summary > .sum-side > span { grid-column: 1; grid-row: 2; margin-top: 0.5rem; }
  .cue > summary > .sum-side > .chev { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  .trays { gap: 0.5rem; }
  .tray { min-height: 3.75rem; padding-inline: 0.375rem; font-size: 0.875rem; }
}
/* Fingers get a 44px target even where the control looks smaller. */
@media (pointer: coarse) {
  .btn-small::before, .seg button::before, .chip::before, .link-row .link-btn::before, .btn-link::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2.75rem; transform: translateY(-50%);
  }
  .seg button, .link-row .link-btn, .btn-link { position: relative; }
  .seg button { min-height: 2.375rem; }
  .route-link { min-height: 2.75rem; }
  /* A phone zooms the page when a field with small text takes focus, so every field stays at 16px there. */
  .answer-zone textarea.answer-box, .copy-fallback textarea { font-size: 1rem; }
}

/* Without backdrop blur, the floating parts fall back to solid surfaces so nothing shows through as clutter. */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .drawer { background: var(--surface); }
  .topbar, body::before { background: var(--bg); }
  .toast { background: var(--ink); color: var(--bg); }
  .toast-icon { color: var(--bg); }
}

/* ---------- Accessibility preferences ---------- */
@media (prefers-contrast: more) {
  :root:root:root { --hairline: var(--ring); --hairline-strong: var(--ink); --ink-2: var(--ink); --ink-3: var(--ink); }
  .drawer, .topbar, .toast, body::before { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .drawer { background: var(--surface); }
  .topbar, body::before { background: var(--bg); }
  .sheet, .ticket, .cue, .card-q, .next, .prompt, .option, .rail { box-shadow: 0 0 0 1.5px var(--ring); }
  .tag, .btn:not(.btn-primary), .chip, .tray, .seg { box-shadow: inset 0 0 0 1px var(--ring); }
}
@media (prefers-reduced-transparency: reduce) {
  .drawer, .topbar, .toast, body::before { -webkit-backdrop-filter: none; backdrop-filter: none; }
  .drawer { background: var(--surface); }
  .topbar, body::before { background: var(--bg); }
  .toast { background: var(--ink); color: var(--bg); }
  .toast-icon { color: var(--bg); }
}
/* Less motion: nothing moves or scales, and a change of state fades from one to the other instead. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-property: opacity, color, background-color, box-shadow, text-decoration-color !important;
    transition-duration: 140ms !important;
    animation-duration: 0.01ms !important;
  }
  .btn:active, .route-link:active, .option:active, .chip:active, .choice:active, .tray:active, .tray.is-target,
  .next:active, .link-row .link-btn:active, .check-row:active .box { transform: none; }
}
@media (forced-colors: active) {
  .route-hl, .seg-thumb { forced-color-adjust: none; background: Highlight; }
  .route-link[aria-current="page"], .seg button[aria-pressed="true"] { forced-color-adjust: none; color: HighlightText; }
  .sheet, .cue, .ticket, .card-q, .next, .option, .rail, .drawer, .draft, .entry-coach .entry-text { border: 1px solid CanvasText; }
}

/*
  Set up screen of the blank coach. Only the blank build carries these styles.
  The sidebar shows the coach's steps greyed until a role is in, and the reading column holds four
  numbered stages: what the person knows about the client (optional), copy the prompt, send it in
  ChatGPT with the job description and the CV, and paste the answer. An answer that passes opens
  the coach at once. Stage numbers turn into checks when a stage is done. A role that needs a word
  first gets a card, with a sky blue mark passing over each part of the coach.
  Colors come from the same tokens as the coach.
*/

/* The sidebar before there is a role */
.is-setup .route-link.is-locked { cursor: default; color: var(--ink-3); }
.is-setup .route-link.is-locked:active { transform: none; }
.is-setup .route-link.is-locked .dot { color: var(--ink-3); box-shadow: inset 0 0 0 1.5px var(--ink-4); }
.is-setup.is-ready .route-link.is-locked { color: var(--ink); }
.is-setup.is-ready .route-link.is-locked .dot { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.locked-note { font-size: 0.8125rem; line-height: 1.4; color: var(--ink-2); padding-inline: 0.5rem; }
.is-ready .locked-note { color: var(--ink); font-weight: 600; }


.setup-notice { padding: 0.9375rem 1.125rem; border-radius: var(--r-m); background: var(--warn-soft); color: var(--warn); font-size: 0.9375rem; font-weight: 500; }

/* Stages */
.stage-head { display: grid; grid-template-columns: 1.75rem minmax(0, 1fr); align-items: center; column-gap: 0.875rem; row-gap: 0.3125rem; padding-inline: 0.25rem; }
.stage-head .section-sub { grid-column: 2; }
.stage-dot { background: var(--tint); color: var(--on-tint); box-shadow: none; transition: background-color 220ms ease, color 220ms ease; }
/* A stage that is done steps back, so the eye goes to the one that is next. */
.stage-dot.is-done { background: var(--fill-3); color: var(--ink); box-shadow: none; }

/* Fields that sit straight on the page read as white wells. */
.filters select { background: var(--surface); box-shadow: var(--shadow-card); }
.filters select:focus-visible { box-shadow: inset 0 0 0 1.5px var(--focus), 0 0 0 4px var(--focus-halo); }

/* A line that says a press did not work, or asks for another one, is set in the caution color. */
.is-stop { color: var(--warn); font-weight: 600; }

/* 1. What the person knows about the client: short fields in a card */
.note-field textarea { min-height: 4.25rem; }

/*
  3. What to do in ChatGPT: a small picture for each step, then a note under a hairline.
  A picture shows the part of ChatGPT where the step happens, drawn in the coach's own colors
  rather than copied from ChatGPT. The button to press carries a sky blue ring and a pointer.
*/
.send-card { container-type: inline-size; }
.walk { list-style: none; margin: 0; padding: 1.375rem; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem 1.125rem; }
@container (max-width: 34rem) { .walk { grid-template-columns: minmax(0, 1fr); } }
.walk-step { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
.walk-text { display: grid; grid-template-columns: 1.5rem minmax(0, 1fr); column-gap: 0.625rem; align-items: start; font-size: 0.9375rem; line-height: 1.4; }
.walk-text .dot { margin-top: -0.0625rem; color: var(--ink); }
.send-notes { margin: 0 1.375rem; padding: 1rem 0 1.25rem; border-top: 1px solid var(--hairline); color: var(--ink-2); font-size: 0.9375rem; }

.shot {
  --point-at: 0ms; --click-at: 560ms;
  position: relative; display: flex; height: 8.5rem; overflow: hidden;
  border-radius: var(--r-m); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--hairline);
  font-size: 0.6875rem; line-height: 1.25; font-weight: 500; color: var(--ink-2);
  -webkit-user-select: none; user-select: none;
}
.shot .icon { width: 0.875rem; height: 0.875rem; }
.shot-bar { display: block; flex: none; height: 0.375rem; border-radius: 999px; background: var(--fill-3); }
.shot-row { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
.shot-box { display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; padding: 0.4375rem; border-radius: 0.875rem; background: var(--surface); box-shadow: 0 0 0 1px var(--hairline-strong); }
.shot-round, .shot-send { display: inline-grid; place-items: center; flex: none; width: 1.5rem; height: 1.5rem; border-radius: 50%; }
.shot-round { color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--hairline-strong); }
.shot-round.is-on { background: var(--fill-2); color: var(--ink); }
.shot-send { margin-left: auto; background: var(--fill-3); color: var(--surface); }
.shot-send.is-ready { background: var(--ink); }
.shot-item { display: flex; align-items: center; gap: 0.4375rem; min-height: 1.625rem; padding: 0.25rem 0.5rem; border-radius: 0.5rem; color: var(--ink); font-weight: 600; white-space: nowrap; }
/* 1. New chat sits at the top of the sidebar */
.shot-side { flex: none; width: 46%; display: flex; flex-direction: column; gap: 0.5625rem; padding: 0.625rem 0.5rem; background: var(--fill); box-shadow: inset -1px 0 0 var(--hairline); }
.shot-side .shot-item { margin-bottom: 0.25rem; background: var(--surface); box-shadow: 0 0 0 1px var(--hairline); }
.shot-side .shot-bar { margin-left: 0.5rem; }
.shot-main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 0.625rem; }
/* 2. The + button opens a menu above the message box */
.shot-attach, .shot-paste { flex-direction: column; justify-content: flex-end; gap: 0.375rem; padding: 0.625rem; }
.shot-menu { align-self: flex-start; display: flex; flex-direction: column; gap: 0.125rem; padding: 0.375rem; border-radius: 0.75rem; background: var(--surface); box-shadow: 0 0 0 1px var(--hairline-strong), 0 8px 18px -10px rgba(0, 0, 51, 0.35); transform-origin: left bottom; }
.shot-menu .shot-bar { margin: 0.375rem 0.5rem; }
.shot-menu .shot-item { padding-right: 1.5rem; }
/* 3. The files and the prompt in the message box */
.shot-files { display: flex; flex-wrap: wrap; gap: 0.375rem; }
.shot-file { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.25rem 0.5rem 0.25rem 0.25rem; border-radius: 0.5rem; background: var(--fill); box-shadow: inset 0 0 0 1px var(--hairline); color: var(--ink); font-weight: 600; white-space: nowrap; }
.shot .shot-file .icon { width: 1.125rem; height: 1.125rem; padding: 0.1875rem; border-radius: 0.3125rem; background: var(--tint); color: var(--on-tint); }
.shot-typed { display: flex; flex-direction: column; gap: 0.3125rem; min-width: 0; padding-inline: 0.25rem; }
.shot-words { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 4. The answer as one code block, with Copy at the top */
.shot-copy { padding: 0.625rem; }
.shot-code { flex: 1; display: flex; flex-direction: column; min-width: 0; border-radius: 0.75rem; background: var(--surface); box-shadow: 0 0 0 1px var(--hairline-strong); }
.shot-code-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.3125rem 0.3125rem 0.3125rem 0.75rem; border-bottom: 1px solid var(--hairline); }
.shot-copybtn { display: inline-flex; align-items: center; gap: 0.3125rem; padding: 0.25rem 0.875rem 0.25rem 0.5rem; border-radius: 0.4375rem; color: var(--ink); font-weight: 600; }
.shot-code-body {
  display: flex; flex-direction: column; gap: 0.3125rem; min-width: 0; overflow: hidden; padding: 0.5625rem 0.75rem;
  font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.625rem; color: var(--ink); white-space: nowrap;
  -webkit-mask-image: linear-gradient(#000 40%, transparent); mask-image: linear-gradient(#000 40%, transparent);
}
/* The button to press. The pointer rests past the end of a label, and comes in from inside the picture. */
.shot-press { --from: translate(1.75rem, 1.5rem); position: relative; outline: 2px solid var(--sky-deep); outline-offset: 2px; }
.shot-send.shot-press { --from: translate(-2.25rem, -0.75rem); }
.shot-copybtn.shot-press { --from: translate(-1.75rem, 1.5rem); }
.shot .shot-cursor { position: absolute; left: 85%; top: 62%; width: 1.25rem; height: 1.25rem; overflow: visible; transform-origin: 23% 12%; }
.shot .shot-send .shot-cursor { left: 50%; top: 50%; }
.shot-cursor path { fill: var(--ink); stroke: var(--surface); stroke-width: 1.75; paint-order: stroke; }

/* Each picture plays once as it comes into view: what the step adds appears, then the pointer moves to the button and presses it. */
@media (prefers-reduced-motion: no-preference) {

  .walk-step.is-waiting .shot-press { outline-color: transparent; }
  .walk-step.is-waiting .shot-menu { opacity: 0; transform: scale(0.9); }
  .walk-step.is-waiting :is(.shot-typed > *, .shot-code-line) { clip-path: inset(0 100% 0 0); }
  .walk-step.is-waiting .shot-send.is-ready { background: var(--fill-3); }
  .walk-step.is-playing .shot-cursor { animation: shot-point 700ms cubic-bezier(0.3, 0.7, 0.2, 1) var(--point-at) both; }
  .walk-step.is-playing .shot-press { animation: shot-press 340ms ease var(--click-at) both; }
  .walk-step.is-playing .shot-send.is-ready { animation: shot-ready 160ms ease 520ms both, shot-press 340ms ease var(--click-at) both; }
  .walk-step.is-playing .shot-menu { animation: shot-pop 260ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .walk-step.is-playing :is(.shot-typed > *, .shot-code-line) { animation: shot-type 420ms linear both; }
  .walk-step.is-playing :is(.shot-typed, .shot-code-body) > :nth-child(2) { animation-delay: 110ms; }
  .walk-step.is-playing .shot-code-body > :nth-child(3) { animation-delay: 220ms; }
}
@keyframes shot-point {
  0% { opacity: 0; transform: var(--from); }
  30% { opacity: 1; }
  80% { transform: translate(0, 0); }
  90% { transform: scale(0.82); }
  100% { opacity: 1; transform: none; }
}
@keyframes shot-press {
  0% { outline-color: transparent; transform: none; }
  45% { outline-color: var(--sky-deep); transform: scale(0.93); }
  100% { outline-color: var(--sky-deep); transform: none; }
}
@keyframes shot-pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: none; } }
@keyframes shot-type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes shot-ready { from { background: var(--fill-3); } to { background: var(--ink); } }

/* 2. The prompt can be opened and read before it is copied */
.peek > summary {
  display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; list-style: none; border-radius: 0.25rem;
  font-size: 0.9375rem; font-weight: 600; color: var(--ink);
  text-decoration: underline; text-decoration-color: var(--sky-deep); text-decoration-thickness: 2px; text-underline-offset: 0.2em;
}
.peek > summary::-webkit-details-marker { display: none; }
.peek > summary::before {
  content: ""; width: 0.4375rem; height: 0.4375rem; flex: none;
  border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); border-radius: 1px;
  transform: rotate(-45deg); transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.peek[open] > summary::before { transform: rotate(45deg); }
.peek[open] > .prompt { margin-top: 0.875rem; max-height: 22rem; border-radius: var(--r-m); }

/* 4. ChatGPT's answer goes into a well that also takes a dropped file */
.answer-zone {
  display: flex; flex-direction: column; min-width: 0;

.answer-zone textarea.answer-box {

}
.answer-zone textarea.answer-box:focus-visible { box-shadow: none; background: transparent; }
.answer-zone:focus-within { box-shadow: 0 0 0 1.5px var(--focus), 0 0 0 5px var(--focus-halo); }
.answer-zone.is-over { background: var(--sky-soft); box-shadow: 0 0 0 2px var(--tint), 0 0 0 6px var(--focus-halo); }
.zone-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 0.625rem 0.875rem; padding: 0.875rem 1.375rem 1.25rem; border-top: 1px solid var(--hairline); }

.setup-result { display: flex; flex-direction: column; gap: 0.875rem; }
.setup-result:empty { display: none; }
.setup-card h3 { outline: none; }
.setup-card.is-problem { box-shadow: 0 0 0 1.5px var(--warn), 0 10px 26px -16px rgba(138, 80, 0, 0.5); }

.kit-row {

  {
   "id": "study-levels",
   "title": "How the support levels work together",
   "focus": [
    "support-process",
    "incidents"
   ],
   "why": "Level 2 sits between the service desk and the people who change the application, so interviewers check that you know what each level does and what you own.",
   "points": [
    "Level 1 is usually the service desk. It takes the first contact and solves common issues with known fixes.",
    "Level 2 takes what level 1 cannot solve. That means deeper troubleshooting, application settings, data checks and user access.",
    "Level 3 is usually the development team or the vendor. They fix code and product bugs.",
    "You ==own a ticket until it is solved or properly handed over==, including while it waits at level 3.",
    "Level 2 also makes level 1 stronger by writing down fixes they can use, which is often called shift left."
   ],
   "say": "When you describe a ticket, say which level had it before you, what you did yourself and what you handed over. It shows you know where level 2 starts and stops.",
   "questions": [
    "open-3",
    "people-3",
    "solve-5"
   ]
  },
  {
   "id": "study-records",
   "title": "Incident, service request, problem and change",
   "focus": [
    "support-process",
    "incidents",
    "problem-solver"
   ],
   "why": "These four words decide who works on something and when it is done, and mixing up incident and problem is a common slip in interviews.",
   "points": [
    "An incident is something broken or degraded. The goal is to ==restore service fast==, with a workaround if the full fix takes longer.",
    "A service request is a standard ask from a user, such as access or a new account. It follows a fixed path with an approval.",
    "A problem is the underlying cause of one or more incidents. It stays open until the cause is found and removed.",
    "A change adds, modifies or removes something in a controlled and approved way, including small changes to settings.",
    "They link together. Repeat incidents lead to a problem, and the permanent fix often goes in as a change."
   ],
   "say": "Use the words exactly when you tell a story. For example, say you restored the service, raised a problem for the cause and got the fix in through a change.",
   "questions": [
    "inc-3",
    "solve-4",
    "inc-5"
   ],
   "more": "These definitions follow ITIL 4, the most used framework for IT support. Its Foundation level covers all four."

  {
   "id": "study-priority",
   "title": "Priority, targets and major incidents",
   "focus": [
    "support-process",
    "incidents"
   ],
   "why": "Priority drives how fast you respond and who you alert, so expect a question on how you set it and what you do when everything looks urgent.",
   "points": [
    "Priority usually comes from impact and urgency. Impact is how many users and how critical the process. Urgency is how fast it gets worse.",
    "Many teams combine the two in a matrix that gives priority 1 to 4, with a response target and a resolution target for each.",
    "==Use the client’s own definitions==, and check the priority again as you learn more.",

   "title": "Access control",
   "focus": [
    "users"
   ],
   "why": "Access mistakes are a security risk and a common audit finding, so interviewers check that you follow the rules even when someone is in a hurry.",
   "points": [

    "Least privilege means a user gets only the access the work needs. Copying a colleague’s access usually gives too much.",
    "Segregation of duties means one person should not control every step of a sensitive process, such as both creating and approving the same thing.",
