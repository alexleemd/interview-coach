<script>
/*
  Client interview coach: the Set up screen of the blank coach.
  Only the blank build carries this file. It runs before app.js and gives app.js one function,
  window.coachSetup, which app.js calls when the page holds no role pack. The screen writes one
  prompt for ChatGPT, fixed apart from what the person adds about the client, takes ChatGPT's
  answer back as text, checks it with the same rules as build.py and then starts the coach with it.
  The job description and the CV never enter this page. The person attaches them in ChatGPT next
  to the prompt. What the person writes about the client is held in memory only and goes into the
  prompt. The check also looks for contact details and for the parts that come from the CV.
  Like app.js, this file makes no network calls, starts no file downloads and never uses
  innerHTML. It builds the screen with the helpers in app.js (h, icon, tag, optionCards and so on),
  which all exist by the time app.js calls it.
*/
"use strict";

(function () {
  /* The role a blank coach was set up with stays in this browser under one key, next to the notes. */
  const ACTIVE_KEY = "client-interview-coach:active-pack";

  /* ---------- The pack check: the same rules and the same messages as build.py ---------- */

  const QUESTION_TYPES = ["closer", "experience", "knowledge", "opener", "scenario"];
  const CHOICE_RATINGS = ["okay", "strong", "weak"];
  const FIT_STRENGTHS = ["gap", "some", "strong"];
  const REQUIRED = ["id", "version", "role", "qualities", "activities", "requirements", "implications", "storySlots",
    "exampleStory", "areas", "questions", "mock", "scenarios", "study", "askQuestions", "checklist", "terms", "aiBrief"];
  /* The client checks whether the consultant can do the work, so nothing asks or says why they want the role. */
  const MOTIVATION = /\bwhy (are you interested|do you want (this|the) (role|job|position)|you want (this|the) (role|job|position))|\bwant (the|this) (role|job|position)\b|\b(role|job|position) interests you\b/i;
  /* The coach names the AI tool itself, never a generic or company AI. */
  const GENERIC_AI = /\bAI (practice|chat|tool|provider)s?\b|\bcompany[’']s AI\b/i;
  const DASHES = /[–—]/;
  /* Two names no coach may mention. They are kept as character codes so this file never contains them. */
  const HIDDEN_NAMES = [[99, 108, 97, 117, 100, 101], [97, 110, 116, 104, 114, 111, 112, 105, 99]]
    .map(codes => String.fromCharCode.apply(null, codes));
  const NOT_IN_COACH = new RegExp(HIDDEN_NAMES.join("|"), "i");
  const NOT_IN_COACH_MESSAGE = "mentions " + HIDDEN_NAMES.map(n => n.charAt(0).toUpperCase() + n.slice(1)).join(" or ") + ", which no coach may do";

  function isObj(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }
  function present(v) { return !(v === undefined || v === null || v === "" || (Array.isArray(v) && v.length === 0)); }
  function asList(v) { return Array.isArray(v) ? v : []; }
  function idOf(v) { return v === undefined ? null : v; }
  function has(set, v) { return set.has(idOf(v)); }
  function hasKey(obj, k) { return typeof k === "string" && Object.prototype.hasOwnProperty.call(obj, k); }

  /* Values printed the way build.py prints them, so both checks report the same text. */
  function py(v) {
    if (v === undefined || v === null) return "None";
    if (v === true) return "True";
    if (v === false) return "False";
    if (Array.isArray(v)) return "[" + v.map(x => (typeof x === "string" ? "'" + x + "'" : py(x))).join(", ") + "]";
    return String(v);
  }

  /*
    The browser must never break on a pasted answer, so anything in the wrong shape stops the check
    before the rules run. build.py has no need for this, since a pack that reaches it was checked here
    or written by hand.
  */
  function shapeProblems(p) {
    const out = [];
    const list = (v, where) => {
      if (Array.isArray(v)) return v;
      out.push(where + ": must be a list");
      return [];
    };
    const obj = (v, where) => {
      if (isObj(v)) return true;
      out.push(where + ": must be an object");
      return false;
    };
    const optionalList = (o, key, where) => { if (o[key] !== undefined && o[key] !== null) list(o[key], where + "." + key); };
    const text = (o, key, where) => {
      if (o[key] !== undefined && o[key] !== null && typeof o[key] !== "string") out.push(where + "." + key + ": must be text");
    };
    ["qualities", "activities", "requirements", "storySlots", "areas", "questions", "scenarios", "study", "askQuestions", "checklist", "terms"].forEach(key => {
      list(p[key], "pack." + key).forEach((item, i) => obj(item, "pack." + key + "[" + i + "]"));
    });
    asList(p.study).forEach((t, i) => {
      if (isObj(t)) ["focus", "points", "questions"].forEach(key => optionalList(t, key, "pack.study[" + i + "]"));
    });
    list(p.implications, "pack.implications");
    list(p.aiBrief, "pack.aiBrief");
    if (obj(p.exampleStory, "pack.exampleStory")) optionalList(p.exampleStory, "tags", "pack.exampleStory");
    if (obj(p.mock, "pack.mock") && p.mock.targets !== undefined) obj(p.mock.targets, "pack.mock.targets");
    asList(p.storySlots).forEach((s, i) => { if (isObj(s)) optionalList(s, "hints", "pack.storySlots[" + i + "]"); });
    asList(p.questions).forEach((q, i) => { if (isObj(q)) optionalList(q, "covers", "pack.questions[" + i + "]"); });
    asList(p.scenarios).forEach((s, i) => {
      if (!isObj(s)) return;
      const where = "pack.scenarios[" + i + "]";
      optionalList(s, "areas", where);
      optionalList(s, "wrapUp", where);
      if (s.nodes === undefined) return;
      if (!obj(s.nodes, where + ".nodes")) return;
      Object.keys(s.nodes).forEach(nid => {
        const at = where + ".nodes." + nid;
        if (!obj(s.nodes[nid], at)) return;
        if (s.nodes[nid].choices === undefined) return;
        list(s.nodes[nid].choices, at + ".choices").forEach((c, j) => obj(c, at + ".choices[" + j + "]"));
      });
    });
    ["askQuestions", "checklist"].forEach(key => {
      asList(p[key]).forEach((g, i) => {
        if (isObj(g)) list(g.items, "pack." + key + "[" + i + "].items").forEach((it, j) => obj(it, "pack." + key + "[" + i + "].items[" + j + "]"));
      });
    });
    if (present(p.fit) && obj(p.fit, "pack.fit") && p.fit.items !== undefined) {
      list(p.fit.items, "pack.fit.items").forEach((it, i) => obj(it, "pack.fit.items[" + i + "]"));
    }
    if (present(p.storyDrafts) && obj(p.storyDrafts, "pack.storyDrafts")) {
      Object.keys(p.storyDrafts).forEach(sid => {
        if (obj(p.storyDrafts[sid], "pack.storyDrafts." + sid)) optionalList(p.storyDrafts[sid], "tags", "pack.storyDrafts." + sid);
      });
    }
    optionalList(p, "introHints", "pack");
    optionalList(p, "messagePlaceholders", "pack");
    optionalList(p, "messageDrafts", "pack");
    ["role", "introDraft", "qualitiesLead", "scenarioLabel", "scenarioHeaderNote", "extraStoriesHint", "aiSituations", "termsLead", "lead"]
      .forEach(key => text(p, key, "pack"));
    return out;
  }

  /*
    A role made before the coach had study topics still opens, so nobody loses a coach in the
    middle of their prep. It only lacks the Study content. A role with this version must have it.
  */
  const NEW_IN_PACK = ["requirements", "study"];
  function versionParts(v) {
    const m = /^(\d+)\.(\d+)\.(\d+)$/.exec(typeof v === "string" ? v : "");
    return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
  }
  function isOlderRole(p) {
    if (!isObj(p) || NEW_IN_PACK.some(k => p[k] !== undefined)) return false;
    const a = versionParts(p.version);
    const b = versionParts(APP.version);
    if (!a || !b) return false;
    for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) return a[i] < b[i]; }
    return false;
  }

  /*
    Returns a list of problems. An empty list means the pack can be used.
    keepOut is an optional list of names (the consultant, the firm, the client) that must not appear.
    olderOk lets a role from an older coach through without requirements, study topics and bridges.
    Everything else in it is checked as usual. build.py has no such case, since it only builds new coaches.
  */
  function checkPack(p, keepOut, olderOk) {
    if (!isObj(p)) return ["pack: is not a JSON object"];
    const older = !!olderOk && isOlderRole(p);
    if (older) p = Object.assign({}, p, { requirements: [], study: [] });
    const errs = [];
    const need = (obj, keys, where) => keys.forEach(k => { if (!present(obj[k])) errs.push(where + ": missing " + k); });

    need(p, older ? REQUIRED.filter(k => NEW_IN_PACK.indexOf(k) < 0) : REQUIRED, "pack");
    if (errs.length) return errs;
    const shape = shapeProblems(p);
    if (shape.length) return shape;

    const unique = (items, where) => {
      const ids = items.map(i => idOf(i.id));
      const dupes = Array.from(new Set(ids.filter((x, i) => ids.indexOf(x) !== i))).sort();
      if (dupes.length) errs.push(where + ": duplicate ids " + py(dupes));
      return new Set(ids);
    };

    const areas = unique(p.areas, "areas");
    const qualities = unique(p.qualities, "qualities");
    const activities = unique(p.activities, "activities");
    const focus = new Set(Array.from(qualities).concat(Array.from(activities)));
    /* A story shows a quality or an activity. CV fit and study topics can also point at a requirement. */
    const requirements = unique(p.requirements, "requirements");
    const fitFocus = new Set(Array.from(focus).concat(Array.from(requirements)));
    const slots = unique(p.storySlots, "storySlots");
    const questions = unique(p.questions, "questions");
    const scenarios = unique(p.scenarios, "scenarios");
    unique(p.study, "study");

    p.qualities.forEach(q => {
      need(q, ["id", "name", "means", "show"], "quality " + py(q.id));
      if (q.story && !has(slots, q.story)) errs.push("quality " + py(q.id) + ": story " + py(q.story) + " is not a story slot");
      if ("typical" in q && typeof q.typical !== "boolean") errs.push("quality " + py(q.id) + ": typical must be true or false");
    });
    p.activities.forEach(a => {
      need(a, ["id", "name", "text"], "activity " + py(a.id));
      if (a.area && !has(areas, a.area)) errs.push("activity " + py(a.id) + ": area " + py(a.area) + " does not exist");
      if (a.scenario && !has(scenarios, a.scenario)) errs.push("activity " + py(a.id) + ": scenario " + py(a.scenario) + " does not exist");
      if ("typical" in a && typeof a.typical !== "boolean") errs.push("activity " + py(a.id) + ": typical must be true or false");
    });
    p.requirements.forEach(r => {
      need(r, ["id", "name", "text"], "requirement " + py(r.id));
      if (has(focus, r.id)) errs.push("requirement " + py(r.id) + ": id is already used by a quality or an activity");
      if ("typical" in r && typeof r.typical !== "boolean") errs.push("requirement " + py(r.id) + ": typical must be true or false");
    });
    p.storySlots.forEach(s => {
      need(s, ["id", "label", "prompt"], "story slot " + py(s.id));
      if (s.focus && !has(focus, s.focus)) errs.push("story slot " + py(s.id) + ": focus " + py(s.focus) + " is not a quality or activity");
    });
    const ex = p.exampleStory;
    need(ex, ["title", "s", "t", "a", "r"], "exampleStory");
    asList(ex.tags).forEach(t => { if (!has(focus, t)) errs.push("exampleStory: tag " + py(t) + " is not a quality or activity"); });
    p.questions.forEach(q => {
      need(q, ["id", "area", "type", "q", "why", "covers", "avoid"], "question " + py(q.id));
      if (!has(areas, q.area)) errs.push("question " + py(q.id) + ": area " + py(q.area) + " does not exist");
      if (QUESTION_TYPES.indexOf(q.type) < 0) errs.push("question " + py(q.id) + ": type " + py(q.type) + " is not one of " + py(QUESTION_TYPES));
      if (q.story && !has(slots, q.story)) errs.push("question " + py(q.id) + ": story " + py(q.story) + " is not a story slot");
    });
    const m = p.mock;
    ["opener", "closer"].forEach(k => { if (!has(questions, m[k])) errs.push("mock: " + k + " " + py(m[k]) + " is not a question id"); });
    QUESTION_TYPES.forEach(k => {
      const v = isObj(m.targets) ? m.targets[k] : undefined;
      if (typeof v !== "number" || !isFinite(v)) errs.push("mock: targets." + k + " must be a number of seconds");
    });

    p.scenarios.forEach(s => {
      const where = "scenario " + py(s.id);
      need(s, ["id", "code", "title", "teaser", "ticketType", "priority", "start", "nodes", "wrapUp"], where);
      const nodes = isObj(s.nodes) ? s.nodes : {};
      if (!hasKey(nodes, s.start)) {
        errs.push(where + ": start node " + py(s.start) + " does not exist");
        return;
      }
      asList(s.areas).forEach(a => { if (!has(areas, a)) errs.push(where + ": area " + py(a) + " does not exist"); });
      Object.keys(nodes).forEach(nid => {
        const n = nodes[nid];
        need(n, ["setup", "prompt", "choices"], where + " node " + nid);
        const ch = asList(n.choices);
        if (!(ch.length >= 2 && ch.length <= 4)) errs.push(where + " node " + nid + ": needs 2 to 4 choices");
        if (!ch.some(c => c.rating === "strong")) errs.push(where + " node " + nid + ": needs at least one strong choice");
        ch.forEach(c => {
          need(c, ["text", "rating", "reaction", "tip"], where + " node " + nid + " choice");
          if (CHOICE_RATINGS.indexOf(c.rating) < 0) errs.push(where + " node " + nid + ": rating " + py(c.rating) + " is not one of " + py(CHOICE_RATINGS));
          if (c.next !== undefined && c.next !== null && !hasKey(nodes, c.next)) errs.push(where + " node " + nid + ": next " + py(c.next) + " does not exist");
        });
      });
      /* every node reachable from the start, and no loops */
      const seen = new Set();
      const stack = [[s.start, []]];
      while (stack.length) {
        const top = stack.pop();
        const nid = top[0];
        const path = top[1];
        if (path.indexOf(nid) >= 0) {
          errs.push(where + ": loop through node " + py(nid));
          break;
        }
        if (!hasKey(nodes, nid)) continue;
        seen.add(nid);
        asList(nodes[nid].choices).forEach(c => { if (c.next) stack.push([c.next, path.concat([nid])]); });
      }
      Object.keys(nodes).filter(nid => !seen.has(nid)).sort()
        .forEach(nid => errs.push(where + ": node " + nid + " can never be reached"));
    });

    /* study topics: what the consultant must be able to explain, and the questions that test it */
    p.study.forEach(t => {
      const where = "study topic " + py(t.id);
      need(t, ["id", "title", "focus", "why", "points", "say"], where);
      asList(t.focus).forEach(f => { if (!has(fitFocus, f)) errs.push(where + ": focus " + py(f) + " is not a quality, activity or requirement"); });
      asList(t.questions).forEach(q => { if (!has(questions, q)) errs.push(where + ": question " + py(q) + " is not a question id"); });
    });

    ["askQuestions", "checklist"].forEach(key => {
      const ids = [];
      p[key].forEach(g => asList(g.items).forEach(i => ids.push(idOf(i.id))));
      if (ids.length !== new Set(ids).size) errs.push(key + ": duplicate item ids");
    });
    p.terms.forEach(t => need(t, ["term", "text"], "term"));

    /* optional consultant content */
    if (isObj(p.storyDrafts)) {
      Object.keys(p.storyDrafts).forEach(sid => {
        if (!slots.has(sid)) errs.push("storyDrafts: " + sid + " is not a story slot");
        asList(p.storyDrafts[sid].tags).forEach(t => {
          if (!has(focus, t)) errs.push("storyDrafts " + sid + ": tag " + py(t) + " is not a quality or activity");
        });
      });
    }
    if (isObj(p.fit) && Object.keys(p.fit).length) {
      asList(p.fit.items).forEach(it => {
        if (!has(fitFocus, it.focus)) errs.push("fit: focus " + py(it.focus) + " is not a quality, activity or requirement");
        if (FIT_STRENGTHS.indexOf(it.strength) < 0) errs.push("fit: strength " + py(it.strength) + " is not one of " + py(FIT_STRENGTHS));
        /* A gap is only useful with something honest to say about it. */
        if (!older && it.strength === "gap" && !present(it.bridge)) errs.push("fit: gap " + py(it.focus) + " needs a bridge, a line the consultant can say");
      });
    }
    if (Array.isArray(p.messagePlaceholders) && p.messagePlaceholders.length && p.messagePlaceholders.length !== 3) {
      errs.push("messagePlaceholders: needs exactly 3");
    }

    /* house style and coach rules for text the consultant reads */
    const names = (keepOut || []).map(n => String(n).trim()).filter(Boolean);
    const nameRules = names.map(n => ({ n, re: new RegExp("(^|[^\\p{L}\\p{N}])" + escapeRe(n) + "(?![\\p{L}\\p{N}])", "iu") }));
    const walk = (v, where) => {
      if (typeof v === "string") {
        if (DASHES.test(v)) errs.push(where + ": contains a dash, rewrite as full sentences");
        if (MOTIVATION.test(v)) errs.push(where + ": reads as a motivation question or line, the coach only covers whether the consultant can do the work");
        if (GENERIC_AI.test(v)) errs.push(where + ": names a generic or company AI tool, call it " + APP.aiTool);
        if (NOT_IN_COACH.test(v)) errs.push(where + ": " + NOT_IN_COACH_MESSAGE);
        nameRules.forEach(r => { if (r.re.test(v)) errs.push(where + ": contains " + r.n + ", which must stay out of the coach"); });
      } else if (Array.isArray(v)) {
        v.forEach((x, i) => walk(x, where + "[" + i + "]"));
      } else if (isObj(v)) {
        Object.keys(v).forEach(k => walk(v[k], where + "." + k));
      }
    };
    walk(p, "pack");
    return errs;
  }

  function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  /* ---------- Reading ChatGPT's answer ---------- */

  /* Takes the JSON out of an answer, whether it came in a code block, with words around it or on its own. */
  function parseAnswer(text) {
    let t = String(text || "").trim();
    if (!t) return { error: "empty" };
    const fence = t.match(/```[a-zA-Z]*\s*([\s\S]*?)```/);
    if (fence && fence[1].indexOf("{") >= 0) t = fence[1].trim();
    const a = t.indexOf("{");
    const b = t.lastIndexOf("}");
    if (a < 0 || b <= a) return { error: "incomplete" };
    try {
      return { pack: JSON.parse(t.slice(a, b + 1)) };
    } catch (err) {
      return { error: "incomplete" };
    }
  }

  /*
    Notes are stored under the pack id, so each role and consultant needs an id of its own. The id
    ends in a short fingerprint of the content: pasting the same answer again finds the same notes,
    and a coach for another consultant in the same role gets its own.
  */
  function fingerprint(s) {
    let x = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) {
      x ^= s.charCodeAt(i);
      x = Math.imul(x, 0x01000193) >>> 0;
    }
    return x.toString(36);
  }

  function slug(s) {
    return String(s || "").toLowerCase().replace(/--[a-z0-9]+$/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "role";
  }

  function readyPack(pack) {
    const p = Object.assign({}, pack, { version: isOlderRole(pack) ? pack.version : APP.version });
    const base = slug(pack.id || pack.role);
    p.id = base + "--" + fingerprint(JSON.stringify(Object.assign({}, p, { id: "" })));
    return p;
  }

  /* ---------- Keeping the role in this browser ---------- */

  function storageWorks() {
    try {
      const k = ACTIVE_KEY + ":probe";
      window.localStorage.setItem(k, "1");
      window.localStorage.removeItem(k);
      return true;

  function storePack(pack) {
    try {
      window.localStorage.setItem(ACTIVE_KEY, JSON.stringify({ savedAt: Date.now(), pack }));
      return true;
    } catch (err) {

    }
  }

  function storedPack() {
    try {
      const raw = window.localStorage.getItem(ACTIVE_KEY);
      if (!raw) return null;
      const saved = JSON.parse(raw);
      return saved && isObj(saved.pack) ? saved.pack : null;

  function forget(packId) {

      window.localStorage.removeItem(ACTIVE_KEY);

  /* ---------- The prompt for ChatGPT ---------- */

  /*
    The example in the prompt keeps every field but fewer questions, scenarios, study topics and
    terms, so the prompt stays short. It keeps two questions per area, starting with the ones the
    mock interview and the kept study topics point at, so every id in it still exists.
  */
  function shortExample(ex) {
    const keepScenarios = new Set(ex.activities.map(a => a.scenario).filter(Boolean));
    const scenarios = ex.scenarios.filter(s => keepScenarios.has(s.id));
    const study = asList(ex.study).slice(0, 2);
    const wanted = new Set([ex.mock.opener, ex.mock.closer]);
    study.forEach(t => asList(t.questions).forEach(id => wanted.add(id)));
    const keep = new Set(wanted);
    ex.areas.forEach(a => {
      const inArea = ex.questions.filter(q => q.area === a.id);
      inArea.filter(q => wanted.has(q.id)).concat(inArea.filter(q => !wanted.has(q.id))).slice(0, 2).forEach(q => keep.add(q.id));
    });
    return Object.assign({}, ex, {
      questions: ex.questions.filter(q => keep.has(q.id)),
      scenarios: scenarios.length ? scenarios : ex.scenarios.slice(0, 2),
      study,
      terms: ex.terms.slice(0, 8)
    });
  }

  /*
    The job description and the CV never enter this page. The person attaches them in ChatGPT, next
    to the prompt. What the page can check is the answer that comes back. Contact details have no
    place in a coach, so the check looks for the ones it can recognize by their shape: email
    addresses, web links and phone numbers.
  */
  const CONTACT_LINK = /(?:https?:\/\/|www\.)[^\s<>"')\]]+|\b(?:[a-z0-9-]+\.)*(?:linkedin|github|gitlab|xing|facebook|instagram|twitter)\.com\/[^\s<>"')\]]*/i;
  const CONTACT_EMAIL = /[\p{L}\p{N}._%+-]+@[\p{L}\p{N}-]+(?:\.[\p{L}\p{N}-]+)+/u;
  /*
    A phone number counts with a country code, or right after a word for phone. Other digits stay
    as they are, so years, standards and ticket numbers pass.
  */
  const CONTACT_PHONE_CODE = /(?:\+|\b00)[1-9](?:[ ().-]{0,2}\d){7,14}/;
  const CONTACT_PHONE_WORD = /\b(?:tel|tlf|telefon|telefone|telem[oó]vel|phone|mobile|mobil|mob|cell)\)?\.?\s*(?:no\.?|nr\.?|number|nummer)?\s*[:.]?\s*\(?\d(?:[ ().-]?\d){7,11}(?![\p{L}\p{N}])/iu;

  /* Returns problems in the same words as the pack check, so they go into the same fix request. */
  function contactProblems(p) {
    const errs = [];
    const walk = (v, where) => {
      if (typeof v === "string") {
        if (CONTACT_EMAIL.test(v)) errs.push(where + ": contains an email address, which must stay out of the coach");
        if (CONTACT_LINK.test(v)) errs.push(where + ": contains a web link, which must stay out of the coach");
        if (CONTACT_PHONE_CODE.test(v) || CONTACT_PHONE_WORD.test(v)) errs.push(where + ": contains a phone number, which must stay out of the coach");
      } else if (Array.isArray(v)) {
        v.forEach((x, i) => walk(x, where + "[" + i + "]"));
      } else if (isObj(v)) {
        Object.keys(v).forEach(k => walk(v[k], where + "." + k));
      }
    };
    walk(p, "pack");
    return errs;
  }

  /*
    A coach is written for one consultant, so an answer needs the parts that come from the CV. A
    role from an older coach is let through, the same way it is for study topics.
  */
  const FROM_CV = ["fit", "storyDrafts", "introDraft", "messageDrafts"];
  function cvProblems(p) {
    if (!isObj(p) || isOlderRole(p)) return [];
    const missing = FROM_CV.filter(k => !present(p[k]) || (isObj(p[k]) && !Object.keys(p[k]).length));
    return missing.length
      ? ["pack: the parts from the CV are missing (" + missing.join(", ") + "). Write them from the attached CV, or ask me for the CV if none is attached"]
      : [];
  }

  /*
    The pictures play once, in order, as they come into view. With less motion, or in a browser that
    does not report what is in view, each picture shows its last frame from the start.
  */
  function playWalk(list) {
    const steps = Array.from(list.children);
    if (!motionOK() || !("IntersectionObserver" in window)) return;
    steps.forEach(s => s.classList.add("is-waiting"));
    let played = 0;
    let free = 0;
    let heard = false;
    const playTo = last => {
      while (played <= last) {
        const s = steps[played++];
        const wait = Math.max(0, free - performance.now());
        free = performance.now() + wait + 900;
        setTimeout(() => {
          s.classList.remove("is-waiting");
          s.classList.add("is-playing");
          setTimeout(() => s.classList.remove("is-playing"), 1400);
        }, wait);
      }
    };
    const io = new IntersectionObserver(entries => {
      heard = true;
      entries.forEach(e => { if (e.isIntersecting) playTo(steps.indexOf(e.target)); });
      if (played >= steps.length) io.disconnect();
    }, { threshold: 0.6 });
    steps.forEach(s => io.observe(s));
    setTimeout(() => {
      if (heard) return;
      io.disconnect();
      steps.forEach(s => s.classList.remove("is-waiting"));
    }, 1500);
  }

  /* What each part of the coach will hold with this pack, for the card that opens the coach. */
  function kitRows(pack) {
    const skills = asList(pack.requirements);
    const typical = pack.qualities.concat(pack.activities, skills).filter(x => x.typical === true).length;
    const drafts = isObj(pack.storyDrafts) && Object.keys(pack.storyDrafts).length > 0;
    const asks = pack.askQuestions.reduce((n, g) => n + asList(g.items).length, 0);
    const gapIds = new Set(asList(isObj(pack.fit) ? pack.fit.items : null).filter(it => it.strength === "gap").map(it => it.focus));
    const topics = asList(pack.study);
    const gapTopics = topics.filter(t => asList(t.focus).some(f => gapIds.has(f))).length;
    const what = {
      brief: (skills.length
        ? count(pack.qualities.length, "quality", "qualities") + ", " + count(pack.activities.length, "activity", "activities") + " and " + count(skills.length, "skill", "skills")
        : count(pack.qualities.length, "quality", "qualities") + " and " + count(pack.activities.length, "activity", "activities")) +
        (typical ? ", " + typical + " of them typical for this role" : ""),
      study: topics.length
        ? count(topics.length, "topic", "topics") + " to be able to explain" + (gapTopics ? ", " + gapTopics + " for gaps in the CV" : "")
        : "None, because this role comes from an older coach",
      stories: count(pack.storySlots.length, "story", "stories") + (drafts ? " with drafts from the CV" : " to write"),
      questions: count(pack.questions.length, "practice question", "practice questions"),
      scenarios: count(pack.scenarios.length, "scenario", "scenarios") + " where you choose what to do",
      mock: "A timed round of questions in a realistic order",
      "ai-practice": "A ready prompt that turns " + APP.aiTool + " into the interviewer",
      prep: (pack.introDraft ? "A drafted intro" : "Your intro") + ", three key messages, " + count(asks, "question", "questions") + " to ask and a checklist",
      terms: count(pack.terms.length, "term", "terms")
    };
    return VIEWS.map(v => ({ v, what: what[v.id] || "" }));
  }

  /* The one moment of motion on Set up: a sky blue mark passes over each part of the coach in turn. */
  function sweep(card) {
    const marks = Array.from(card.querySelectorAll(".kit-mark"));
    if (!motionOK()) {
      marks.forEach(m => { m.style.transform = "scaleX(1)"; });
      return;
    }
    marks.forEach((m, i) => {
      setTimeout(() => {
        const s = new Spring(0, p => { m.style.transform = "scaleX(" + Math.max(0, p).toFixed(3) + ")"; }, { precision: 0.002 });
        s.to(1, { damping: 0.9, response: 0.34 });
      }, 240 + i * 75);
    });
  }

  function renderSetup(start, example, notice) {
    const keeps = storageWorks();
    const notes = { wants: "", likes: "", format: "" };
    const dots = {};
    let copied = false;

    document.body.classList.add("is-setup");
    byId("tools").hidden = true;
    byId("steps-open").hidden = true;
    byId("topbar-progress").hidden = true;
    byId("brand-meta").textContent = "New coach";
    byId("topbar-count").textContent = "New coach";
    byId("topbar-title").textContent = "Set up";
    byId("nav").replaceChildren(...lockedRoute());
    const skip = document.querySelector(".skip-link");
    if (skip) skip.onclick = () => byId("main").focus();

    /*
      1. What the person knows about the client: three optional questions. The answers are held in
      memory only and go into the prompt. Nothing here is saved.
    */
    const note = (key, label, placeholder) => {
      const id = "setup-note-" + key;
      const ta = h("textarea", { id, rows: "2", placeholder });
      ta.addEventListener("input", () => { notes[key] = ta.value; changed(); });
      return h("div", { class: "field note-field" }, h("label", { class: "field-label", for: id }, label), ta);
    };
    const notesCard = h("div", { class: "sheet sheet-pad" },
      note("wants", "What is the client looking for that the job description does not say?", "For example: someone who can work alone from day one"),
      note("likes", "What does the client or the interviewer like or dislike?", "For example: likes hearing about results, dislikes jargon"),
      note("format", "How will the interview run?", "For example: 45 minutes online with two interviewers"));
    const hasNotes = () => !!(notes.wants.trim() || notes.likes.trim() || notes.format.trim());

    /* 2. The prompt: the same for every role, apart from what was written in stage 1. */
    const pre = h("pre", { class: "prompt", id: "setup-prompt", tabindex: "0", "aria-label": "Prompt to copy" });
    const peek = h("details", { class: "peek" }, h("summary", null, "See the whole prompt"), pre);
    /* The prompt is long, so it is only written out while someone is looking at it or copying it. */
    const writePrompt = () => { pre.textContent = buildSetupPrompt(example, notes); };
    peek.addEventListener("toggle", () => { if (peek.open) writePrompt(); });
    const copyStatus = h("span", { class: "small muted", id: "setup-copy-status", role: "status" });
    const copyBtn = h("button", { type: "button", class: "btn btn-primary btn-large", id: "setup-copy", onclick: copyPrompt }, icon("copy"), "Copy the prompt");
    const promptCard = h("div", { class: "sheet sheet-pad" },
      h("div", { class: "btn-row" }, copyBtn, copyStatus),
      peek);

    /* A line that asks for another press is set in the caution color, so nobody takes it for a confirmation. */
    function say(text, stop) {
      copyStatus.textContent = text;
      copyStatus.classList.toggle("is-stop", !!stop);
    }

    function changed() {
      if (peek.open) writePrompt();
      if (copied) {
        copied = false;
        say("The prompt changed since you copied it, so copy it again.", true);
      }
      markStage(dots, 1, copied || hasNotes());
      markStage(dots, 2, copied);
    }

    async function copyPrompt() {
      writePrompt();
      copied = await copyWithStatus(pre.textContent, copyStatus, "Copied. Paste it into a new chat in " + APP.aiTool + ".", pre, copyBtn);
      copyStatus.classList.toggle("is-stop", !copied);
      /* Copying the prompt settles the optional stage too, filled in or not. */
      markStage(dots, 1, copied || hasNotes());
      markStage(dots, 2, copied);
    }

    /*
      3. ChatGPT: the job description and the CV are attached there, next to the prompt. They never
      pass through this page. The answer comes back one way only, as text in a code block. Each step
      has a picture of where it happens in ChatGPT.
    */
    const walkList = h("ol", { class: "walk", role: "list" },
      walkStep(1, "Open a new chat in " + APP.aiTool + ".", shotNewChat()),
      walkStep(2, "Attach the job description and the CV.", shotAttach()),
      walkStep(3, "Paste the prompt and send it.", shotSend()),
      walkStep(4, "When the answer is done, press Copy on its code block.", shotCopy()));
    const sendCard = h("div", { class: "sheet send-card" },
      walkList,
      h("p", { class: "send-notes" }, "No file for the job description? Paste its text into the message, under the prompt."));

    /* 4. The answer is pasted into a well. A file is only the rescue for an answer that was cut off. */
    const answer = h("textarea", { id: "setup-answer", class: "answer-box", rows: "7", placeholder: "Paste the answer here" });
    const fileInput = h("input", { type: "file", id: "setup-file", class: "sr-only", tabindex: "-1", "aria-hidden": "true", accept: ".json,.txt,application/json,text/plain" });
    function readFile(f) {
      if (f.size > 4 * 1024 * 1024) {
        showResult(messageCard("That file is too big to be the answer", "Open the file named role-pack.json that " + APP.aiTool + " gave you."));
        return;
      }
      const reader = new FileReader();
      reader.onload = () => { answer.value = String(reader.result || ""); runCheck(); };
      reader.onerror = () => showResult(messageCard("That file could not be read", "Try again, or open it in a text editor and paste its content above."));
      reader.readAsText(f);
    }
    fileInput.addEventListener("change", () => {
      const f = fileInput.files && fileInput.files[0];
      if (f) readFile(f);
      fileInput.value = "";
    });
    const zone = h("div", { class: "answer-zone", id: "setup-zone" },
      h("label", { class: "sr-only", for: "setup-answer" }, APP.aiTool + "’s answer"),
      answer,
      h("div", { class: "zone-foot" },
        h("button", { type: "button", class: "btn btn-primary", id: "setup-fill", onclick: runCheck }, "Fill in the coach"),
        fileInput));
    const hasFiles = e => !!(e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf("Files") >= 0);
    zone.addEventListener("dragover", e => { if (!hasFiles(e)) return; e.preventDefault(); zone.classList.add("is-over"); });
    zone.addEventListener("dragleave", e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove("is-over"); });
    zone.addEventListener("drop", e => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      zone.classList.remove("is-over");
      const f = e.dataTransfer.files[0];
      if (f) readFile(f);
    });
    const result = h("div", { class: "setup-result", id: "setup-result", "aria-live": "polite" });

    function showResult(node, after) {
      result.replaceChildren(node);
      reveal(node, 0, 10);
      const head = node.querySelector("h3");
      if (head) { head.setAttribute("tabindex", "-1"); head.focus({ preventScroll: true }); }
      node.scrollIntoView({ block: "nearest", behavior: motionOK() ? "smooth" : "auto" });
      if (after) after(node);
    }

    function messageCard(title, text, request, requestLabel, extra) {
      const status = h("span", { class: "small muted", role: "status" });
      return h("div", { class: "sheet sheet-pad setup-card is-problem" },
        h("h3", { class: "display-s" }, title),
        text ? h("p", null, text) : null,
        request ? h("div", { class: "btn-row" },
          h("button", { type: "button", class: "btn", onclick: e => copyWithStatus(request, status, "Copied. Paste it into the same chat in " + APP.aiTool + ".", null, e.currentTarget) }, icon("copy"), requestLabel),
          extra || null,
          status) : null);
    }

    function problemsCard(problems) {
      const status = h("span", { class: "small muted", role: "status" });
      const shown = problems.slice(0, 10);
      return h("div", { class: "sheet sheet-pad setup-card is-problem" },
        h("h3", { class: "display-s" }, count(problems.length, "problem", "problems") + " to fix"),
        h("p", null, APP.aiTool + " can fix " + (problems.length === 1 ? "it" : "them") + ". Copy the fix request into the same chat, then paste its new answer above."),
        h("ul", { class: "bullets problem-list" }, shown.map(t => h("li", null, t)),
          problems.length > shown.length ? h("li", null, "and " + (problems.length - shown.length) + " more, all in the fix request") : null),
        h("div", { class: "btn-row" },
          h("button", { type: "button", class: "btn btn-primary", id: "setup-fix", onclick: e => copyWithStatus(fixRequest(problems), status, "Copied. Paste it into the same chat in " + APP.aiTool + ".", null, e.currentTarget) }, icon("copy"), "Copy the fix request"),
          status));
    }

    /* The pack passed: the card lists what each part of the coach now holds and opens it. */
    function kitCard(pack) {
      const fitItems = isObj(pack.fit) && Array.isArray(pack.fit.items) ? pack.fit.items : [];
      const gaps = fitItems.filter(it => it.strength === "gap").length;
      const list = h("ol", { class: "kit-list" }, kitRows(pack).map(r => h("li", { class: "kit-row" },
        h("span", { class: "dot-slot" }, stepDot(r.v, false)),
        h("span", { class: "kit-text" },
          h("span", { class: "kit-label" }, h("span", { class: "kit-mark", "aria-hidden": "true" }), r.v.label),
          h("span", { class: "kit-what" }, r.what)))));
      return h("div", { class: "sheet setup-card kit", id: "setup-kit" },
        h("div", { class: "kit-head" },
          h("h3", { class: "display-m" }, pack.role),
          h("p", { class: "muted" }, "Checked against the coach rules. This is what each part now holds.")),
        list,
        h("div", { class: "kit-foot" },
          gaps ? h("p", { class: "kit-note" }, count(gaps, "gap", "gaps") + " in the CV to prepare for, marked on the Brief.") : null,
          isOlderRole(pack) ? h("p", { class: "kit-note" }, "This role comes from an older coach, so it has no study topics. Set it up again to get them.") : null,
          keeps ? null : h("p", { class: "small muted" }, "This browser does not keep the role, so keep " + APP.aiTool + "’s answer to paste again next time."),
          h("div", { class: "btn-row" },
            h("button", { type: "button", class: "btn btn-primary btn-large", id: "setup-open", onclick: () => openCoach(pack) }, "Open the coach"))));
    }

    function setReady(ready) {
      /* An answer that passes shows that the earlier stages happened, also when a colleague sent the role. */
      markStage(dots, 1, ready || copied || hasNotes());
      markStage(dots, 2, ready || copied);
      markStage(dots, 3, ready);
      markStage(dots, 4, ready);
      document.body.classList.toggle("is-ready", ready);
      const note = byId("locked-note");
      if (note) note.textContent = ready ? "Ready. Open the coach to start with the Brief." : "These steps fill in once the role is in.";
    }

    function runCheck() {
      const parsed = parseAnswer(answer.value);
      if (parsed.error === "empty") {
        setReady(false);
        showResult(messageCard("Nothing to fill in yet", "Paste " + APP.aiTool + "’s whole answer above."));
        return;
      }
      if (parsed.error) {
        setReady(false);
        showResult(messageCard("This answer is not complete",
          "Wait until " + APP.aiTool + " has finished, press Copy on the code block and paste again. If the answer itself stopped part way, ask for it as a file and open that file here.",
          FILE_REQUEST, "Copy the file request",
          h("button", { type: "button", class: "btn", id: "setup-open-file", onclick: () => fileInput.click() }, "Open the file")));
        return;
      }
      const problems = cvProblems(parsed.pack).concat(checkPack(parsed.pack, null, true), contactProblems(parsed.pack));
      if (problems.length) {
        setReady(false);
        showResult(problemsCard(problems));
        return;
      }
      const pack = readyPack(parsed.pack);
      /* A role that needs a word first gets a card that says it. Every other role opens at once. */
      if (isOlderRole(pack) || !keeps) {
        setReady(true);
        showResult(kitCard(pack), sweep);
        return;
      }
      openCoach(pack);
    }

    function openCoach(pack) {
      storePack(pack);
      document.body.classList.remove("is-ready");
      launch(start, pack, true);
    }

    const view = h("div", { class: "view setup" },
      h("header", { class: "view-head" },
        h("h1", { class: "display-l" }, "Set up a new coach")),
      notice ? h("p", { class: "setup-notice", role: "status" }, notice) : null,
      stage(dots, 1, "Optional: what you know about the client", null, notesCard),
      stage(dots, 2, "Copy the prompt", null, promptCard),
      stage(dots, 3, "Send it in " + APP.aiTool, null, sendCard),
      stage(dots, 4, "Paste the answer", null, zone, result));
    byId("view").replaceChildren(view);
    playWalk(walkList);
  }

  /* A new coach starts on the Brief, not on the step an earlier coach left in the address. */
  function clearHash() {
    if (!window.location.hash) return;
    try {
      window.history.replaceState(null, "", window.location.pathname + window.location.search);
    } catch (err) {
      try { window.location.hash = ""; } catch (err2) { /* the address bar is optional */ }
    }
  }

  /* Hands the page over from Set up to the coach. */
  function launch(start, pack, fresh) {
    if (fresh) clearHash();
    document.body.classList.remove("is-setup");
    byId("tools").hidden = false;
    byId("steps-open").hidden = false;
    byId("topbar-progress").hidden = false;
    byId("nav").replaceChildren();
    window.scrollTo(0, 0);
    start(pack);
    addCoachTools(pack);
    byId("main").focus({ preventScroll: true });
  }

  /* In a coach opened from Set up, the notes tools gain a way to pass the role on and to start again. */
  function addCoachTools(pack) {
    const box = h("div", { class: "setup-tools" });
    const goBack = () => {
      clearHash();
      try { window.location.reload(); } catch (err) { /* handled below */ }
      setTimeout(() => box.replaceChildren(h("p", { class: "small muted" }, "Reload the page to see Set up.")), 1500);
    };
    const copyRole = h("button", {
      type: "button", class: "btn btn-small", id: "copy-role",
      onclick: async e => {
        const btn = e.currentTarget;
        const ok = await copyText(JSON.stringify(pack));
        if (ok) flashCopied(btn);
        toast(ok ? "Role copied. They paste it into Set up, step 4." : "Copying is blocked in this browser.");
      }
    }, icon("copy"), "Copy the role");
    const zone = h("div", null);
    const closed = () => zone.replaceChildren(h("button", { type: "button", class: "btn-link small", id: "start-over", onclick: open }, "Start a new coach"));
    const open = () => {
      zone.replaceChildren(h("div", { class: "confirm", role: "group", "aria-label": "Start a new coach" },
        h("p", null, "This removes the role and all your notes for it from this browser. Copy the role or your notes first if you want to keep them."),
        h("div", { class: "confirm-actions" },
          h("button", { type: "button", class: "btn btn-small btn-danger", id: "start-over-confirm", onclick: () => { forget(pack.id); goBack(); } }, "Start over"),
          h("button", { type: "button", class: "btn btn-small", onclick: closed }, "Cancel"))));
      byId("start-over-confirm").focus();
    };
    closed();
    box.append(
      h("p", { class: "small muted" }, "To give this coach to someone, send them the blank coach file and the role."),
      h("div", { class: "tools-actions" }, copyRole, zone));
    byId("tools").appendChild(box);
  }

  /* Called by app.js when the page holds no role pack. */
  function coachSetup(start) {
    /* The example role is only the reference inside the prompt for ChatGPT. It cannot be opened as a coach. */
    let example = null;
    try {
      example = JSON.parse(byId("coach-example").textContent);
    } catch (err) {
      example = null;
    }
    const saved = storedPack();
    if (saved) {
      if (!checkPack(saved, null, true).length) {
        launch(start, saved, false);
        return;
      }
      forget(null);
      renderSetup(start, example, "The role saved in this browser no longer passes the check, so set it up again. Your notes for it are still here and come back when you paste the same answer.");
      return;
    }
    renderSetup(start, example, null);
  }

  coachSetup.staleAdvice = "If the interview is over, choose Start a new coach to clear the role and your notes.";
  /* For the tests: the same check the screen runs, and the prompt it writes. */
  coachSetup.checkPack = checkPack;
  coachSetup.buildPrompt = buildSetupPrompt;
  coachSetup.contactProblems = contactProblems;
  coachSetup.cvProblems = cvProblems;
  coachSetup.parseAnswer = parseAnswer;
  window.coachSetup = coachSetup;
})();

</script>
<script>
/*
  Client interview coach: app code.
  Draws every view from PACK with DOM methods only. No network calls and no file downloads.
  Look and motion follow Apple's interface design principles: feedback on press, springs
  (damping ratio and response) that always start from the value on screen so any motion can be
  interrupted or reversed, gestures that track 1:1 and carry their speed into the animation,
  paths that leave the way they came, and translucent materials only for what floats over content.
*/
"use strict";

const APP = {
  name: "Client interview coach",
  version: "0.6.0",
  /* The AI chat tool the consultant practices with. Every mention of it on screen uses this name. */
  aiTool: "ChatGPT",
  wordsPerMinute: 140
};

/*
  Everything about one role and one consultant lives in the role pack, a JSON block in the page
  with the id coach-pack. Swapping that block is all it takes to make a coach for another
  interview. A blank coach leaves the block empty and opens on the Set up screen, which collects
  the role and then starts the coach with it. See the framework README for the pack format.
*/
let PACK = null;
let STORE_KEY = "";

/* The pack in the page, or null when the page is a blank coach. */
function readPack() {
  const el = document.getElementById("coach-pack");
  const text = el ? el.textContent.trim() : "";
  if (!text) return null;
  try {
    return JSON.parse(text);
  } catch (err) {
    const msg = document.createElement("p");
    msg.className = "pack-error";
    msg.textContent = "This coach could not load its role content, so the file may be damaged. Ask for a fresh copy.";
    (document.getElementById("view") || document.body).appendChild(msg);
    throw err;
  }
}

const DEFAULT_INTRO_HINTS = [
  "Who you are now, in one or two sentences.",
  "The experience that fits this role.",
  "One short example that shows the qualities they are looking for."
];
/* After this many days without a save, the coach reminds the consultant to clear their notes. */
const STALE_DAYS = 7;
const DEFAULT_MESSAGE_PLACEHOLDERS = [
  "Your strongest point for this role",
  "A second strength, with something that proves it",
  "What people can rely on you for"
];
const NARROW = window.matchMedia ? window.matchMedia("(max-width: 860px)") : null;
const REDUCE_MOTION = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : null;

/* ---------- DOM helpers ---------- */

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const key of Object.keys(props)) {
      const val = props[key];
      if (val === null || val === undefined || val === false) continue;
      if (key === "class") el.className = val;
      else if (key === "value") el.value = val;
      else if (key === "checked") el.checked = !!val;
      else if (key === "disabled") el.disabled = !!val;
      else if (key === "open") el.open = !!val;
      else if (key.indexOf("on") === 0 && typeof val === "function") el.addEventListener(key.slice(2), val);
      else el.setAttribute(key, val === true ? "" : String(val));
    }
  }
  appendAll(el, children);
  return el;
}

function appendAll(el, children) {
  const flat = [].concat(...children.map(c => (Array.isArray(c) ? c.flat(Infinity) : [c])));
  for (const child of flat) {
    if (child === null || child === undefined || child === false) continue;
    el.appendChild(typeof child === "string" || typeof child === "number" ? document.createTextNode(String(child)) : child);
  }
}

/* Text with ==highlight== marks, built from text nodes only. */
function rich(text) {
  const frag = document.createDocumentFragment();
  String(text).split("==").forEach((part, i) => {
    if (!part) return;
    frag.appendChild(i % 2 === 1 ? h("mark", null, part) : document.createTextNode(part));
  });
  return frag;
}

function byId(id) { return document.getElementById(id); }

/* Icons are defined once in the page markup and cloned where needed. */
function icon(name, cls) {
  const tpl = byId("tpl-icons");
  const src = tpl && tpl.content.querySelector('[data-icon="' + name + '"]');
  if (!src) return null;
  const svg = src.cloneNode(true);
  svg.removeAttribute("data-icon");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  svg.setAttribute("class", "icon" + (cls ? " " + cls : ""));
  return svg;
}

/*
  A numbered marker for a step in the sequence. Done steps show a check. A step that is under way
  can carry its share done (0 to 1), drawn as a ring that fills around the number.
*/
function stepDot(view, done, share) {
  if (!view.step) return h("span", { class: "dot dot-ref", "aria-hidden": "true" }, icon("book"));
  const dot = h("span", { class: "dot" + (done ? " is-done" : ""), "aria-hidden": "true" }, done ? icon("check") : String(view.step));
  if (!done && share > 0) {
    dot.classList.add("has-share");
    dot.style.setProperty("--share", share.toFixed(3));
  }
  return dot;
}

/* The share of a step that is done, read from its count such as 2/6. A step without a count has none. */
function progressShare(p) {
  const m = p ? /^(\d+)\/(\d+)$/.exec(p.short) : null;
  return m && Number(m[2]) > 0 ? Math.min(1, Number(m[1]) / Number(m[2])) : 0;
}

function tag(text, tone) {
  return h("span", { class: "tag" + (tone ? " tag-" + tone : "") }, text);
}

function section(title, sub, ...content) {
  return h("section", { class: "section" },
    h("div", { class: "section-head" },
      h("h2", { class: "display-m" }, title),
      sub ? h("p", { class: "section-sub" }, sub) : null),
    ...content);
}

function block(label, content) {
  return h("div", { class: "block" }, h("span", { class: "label" }, label), content);
}

/* In-app links are buttons. A page that hosts the coach can take over link clicks, but button clicks always reach it. */
function linkButton(text, onActivate) {
  return h("button", { type: "button", class: "link-btn", onclick: onActivate }, text);
}

/* ---------- Motion: springs that start from what is on screen ---------- */

/* No motion when the viewer asks for less of it, or when the page is hidden and nobody can see it. */
function motionOK() {
  if (REDUCE_MOTION && REDUCE_MOTION.matches) return false;
  return document.visibilityState !== "hidden";
}

/*
  A one-dimensional spring. damping 1 settles without overshoot, below 1 overshoots.
  response is roughly how quickly it reaches the target, in seconds (not a fixed duration).
  Retargeting keeps the current value and velocity, so motion never jumps.
*/
class Spring {
  constructor(value, onChange, opts) {
    this.x = value;
    this.v = 0;
    this.target = value;
    this.onChange = onChange;
    this.precision = (opts && opts.precision) || 0.01;
    this.damping = 1;
    this.response = 0.35;
    this.raf = 0;
    this.last = 0;
    this.onRest = null;
    this.watchdog = 0;
    this.deadline = 0;
    this.frame = this.frame.bind(this);
    this.checkGuard = this.checkGuard.bind(this);
  }
  /*
    Browsers stop drawing frames for pages they consider hidden, and some hosting frames throttle
    them. Each frame moves a deadline 200ms ahead and one timer per animation checks it. If no
    frame arrives by the deadline, the spring finishes at once, so motion can never leave the
    coach stuck halfway through a change.
  */
  guard() {
    this.deadline = performance.now() + 200;
    if (!this.watchdog) this.watchdog = setTimeout(this.checkGuard, 220);
  }
  checkGuard() {
    this.watchdog = 0;
    if (!this.raf) return;
    const wait = this.deadline - performance.now();
    if (wait > 0) {
      this.watchdog = setTimeout(this.checkGuard, wait + 20);
      return;
    }
    this.jump(this.target);
    this.finish();
  }
  get animating() { return this.raf !== 0; }
  jump(value) {
    this.stop();
    this.x = this.target = value;
    this.v = 0;
    this.onChange(this.x);
  }
  to(target, opts) {
    const o = opts || {};
    this.target = target;
    if (o.damping !== undefined) this.damping = o.damping;
    if (o.response !== undefined) this.response = o.response;
    if (o.velocity !== undefined) this.v = o.velocity;
    this.onRest = o.onRest || null;
    if (!motionOK()) {
      this.jump(target);
      this.finish();
      return this;
    }
    if (!this.raf) {
      this.last = 0;
      this.raf = requestAnimationFrame(this.frame);
      this.guard();
    }
    return this;
  }
  frame(now) {
    if (!this.last) this.last = now - 16;
    const dt = Math.min(0.05, (now - this.last) / 1000);
    this.last = now;
    const k = Math.pow((2 * Math.PI) / this.response, 2);
    const c = (4 * Math.PI * this.damping) / this.response;
    const steps = Math.max(1, Math.ceil(dt / 0.004));
    const step = dt / steps;
    for (let i = 0; i < steps; i++) {
      const a = -k * (this.x - this.target) - c * this.v;
      this.v += a * step;
      this.x += this.v * step;
    }
    const done = Math.abs(this.x - this.target) < this.precision && Math.abs(this.v) < this.precision * 10;
    if (done) { this.x = this.target; this.v = 0; }
    this.onChange(this.x);
    if (done) {
      this.raf = 0;
      this.stop();
      this.finish();
    } else {
      this.raf = requestAnimationFrame(this.frame);
      this.guard();
    }
  }
  finish() {
    const cb = this.onRest;
    this.onRest = null;
    if (cb) cb();
  }
  stop() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = 0;
    clearTimeout(this.watchdog);
    this.watchdog = 0;
  }
}

/* Momentum projection from Apple's fluid interfaces sample: where a flick would come to rest. */
function project(velocity, rate) {
  const d = rate || 0.998;
  return (velocity / 1000) * d / (1 - d);
}

/* The further past a boundary, the less the element follows. */
function rubberband(over, dimension, constant) {
  const c = constant || 0.55;
  return (over * dimension * c) / (dimension + c * over);
}

/* With reduced motion, things cross-fade instead of moving. */
function fadeIn(el) {
  if (el && el.animate) el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: "ease-out" });
}

/* New content rises a little into place, without overshoot. */
function reveal(el, delay, distance) {
  if (!el) return;
  if (!motionOK()) { fadeIn(el); return; }
  const dy = distance || 12;
  el.style.opacity = "0";
  el.style.transform = "translateY(" + dy + "px)";
  const start = () => {
    const s = new Spring(0, p => {
      el.style.opacity = String(Math.min(1, p * 1.25));
      el.style.transform = "translateY(" + (dy * (1 - p)).toFixed(2) + "px)";
    }, { precision: 0.002 });
    s.to(1, { damping: 1, response: 0.42, onRest: () => { el.style.opacity = ""; el.style.transform = ""; } });
  };
  if (delay) setTimeout(start, delay); else start();
}

/* Moves an element from where something else was (a tapped answer) to where it now sits. */
function flipFrom(el, from) {
  if (!el || !from) return;
  if (!motionOK()) { fadeIn(el); return; }
  const to = el.getBoundingClientRect();
  const dx = from.left - to.left;
  const dy = from.top - to.top;
  el.style.transform = "translate(" + dx + "px," + dy + "px)";
  const s = new Spring(0, p => {
    el.style.transform = "translate(" + (dx * (1 - p)).toFixed(2) + "px," + (dy * (1 - p)).toFixed(2) + "px)";
  }, { precision: 0.002 });
  s.to(1, { damping: 1, response: 0.42, onRest: () => { el.style.transform = ""; } });
}

/*
  Replaces the content of a host with a horizontal push. Forward content enters from the right
  and leaves to the left, and going back uses the same path in reverse.
*/
let activePush = null;
function pushTransition(host, node, direction) {
  if (activePush) activePush.finish();
  const old = host.firstElementChild;
  if (!old || !direction || !motionOK()) {
    host.replaceChildren(node);
    if (direction && !motionOK()) fadeIn(node);
    return;
  }
  const dir = direction === "back" ? -1 : 1;
  const hostRect = host.getBoundingClientRect();
  const oldRect = old.getBoundingClientRect();
  old.querySelectorAll("[id]").forEach(n => n.removeAttribute("id"));
  old.removeAttribute("id");
  old.setAttribute("aria-hidden", "true");
  old.inert = true;
  old.style.position = "absolute";
  old.style.top = (oldRect.top - hostRect.top) + "px";
  old.style.left = "0";
  old.style.width = oldRect.width + "px";
  old.style.pointerEvents = "none";
  host.appendChild(node);
  const dist = 28;
  node.style.opacity = "0";
  node.style.transform = "translateX(" + (dir * dist) + "px)";
  const s = new Spring(0, p => {
    old.style.opacity = String(Math.max(0, 1 - p * 1.6));
    old.style.transform = "translateX(" + (-dir * dist * p).toFixed(2) + "px)";
    node.style.opacity = String(Math.min(1, p * 1.4));
    node.style.transform = "translateX(" + (dir * dist * (1 - p)).toFixed(2) + "px)";
  }, { precision: 0.002 });
  const finish = () => {
    s.stop();
    if (old.parentNode) old.remove();
    node.style.opacity = "";
    node.style.transform = "";
    if (activePush && activePush.finish === finish) activePush = null;
  };
  activePush = { finish };
  s.to(1, { damping: 1, response: 0.38, onRest: finish });
}

/* Disclosures open and close on a spring and can be reversed mid-way. */
const disclosures = new WeakMap();

function setupDisclosures() {
  document.addEventListener("click", e => {
    const summary = e.target.closest("details.anim > summary");
    if (!summary || !motionOK()) return;
    e.preventDefault();
    const details = summary.parentElement;
    const st = disclosures.get(details);
    const goingOpen = st && st.spring.animating ? !st.opening : !details.open;
    animateDisclosure(details, goingOpen);
  });
}

function animateDisclosure(details, open) {
  const summary = details.querySelector(":scope > summary");
  let st = disclosures.get(details);
  if (!st) {
    st = { opening: details.open, closedH: 0, openH: 0, spring: null };
    st.spring = new Spring(details.getBoundingClientRect().height, value => {
      details.style.height = value.toFixed(2) + "px";
      const span = st.openH - st.closedH;
      const p = span > 0 ? Math.min(1, Math.max(0, (value - st.closedH) / span)) : (st.opening ? 1 : 0);
      details.style.setProperty("--open", p.toFixed(3));
    }, { precision: 0.5 });
    disclosures.set(details, st);
  }
  const current = details.getBoundingClientRect().height;
  if (!st.spring.animating) {
    st.spring.x = current;
    st.spring.v = 0;
  }
  st.closedH = summary.getBoundingClientRect().height;
  if (open) {
    details.open = true;
    details.style.height = "auto";
    st.openH = details.getBoundingClientRect().height;
    details.style.height = current + "px";
  } else if (!st.spring.animating || st.openH < current) {
    st.openH = current;
  }
  st.opening = open;
  details.classList.add("is-animating");
  st.spring.to(open ? st.openH : st.closedH, {
    damping: 1,
    response: 0.36,
    onRest: () => {
      details.classList.remove("is-animating");
      details.style.height = "";
      details.style.removeProperty("--open");
      if (!st.opening) details.open = false;
    }
  });
}

/* ---------- Controls ---------- */

/* A segmented control whose thumb slides to the chosen option on a spring. */
function segmented(label, key, options, current, onChange, helper) {
  const labelId = "seg-" + key + "-label";
  const thumb = h("span", { class: "seg-thumb", "aria-hidden": "true" });
  const group = h("div", { class: "seg", role: "group", "aria-labelledby": labelId }, thumb);
  let selected = current;
  const buttons = options.map(opt => h("button", {
    type: "button",
    id: "seg-" + key + "-" + opt.value,
    "aria-pressed": String(opt.value === current),
    onclick: () => select(opt.value)
  }, opt.label));
  appendAll(group, buttons);
  const spring = new Spring(0, x => { thumb.style.transform = "translateX(" + x.toFixed(2) + "px)"; }, { precision: 0.3 });

  function place(animate) {
    const i = options.findIndex(o => o.value === selected);
    const b = buttons[i];
    if (!b || !b.offsetWidth) return;
    thumb.style.width = b.offsetWidth + "px";
    thumb.style.opacity = "1";
    if (animate) spring.to(b.offsetLeft, { damping: 1, response: 0.32 });
    else spring.jump(b.offsetLeft);
  }
  function select(value) {
    if (value === selected) return;
    selected = value;
    buttons.forEach((b, i) => b.setAttribute("aria-pressed", String(options[i].value === value)));
    place(true);
    onChange(value);
  }
  if ("ResizeObserver" in window) new ResizeObserver(() => place(false)).observe(group);
  else requestAnimationFrame(() => place(false));

  return h("div", { class: "option-row" }, h("span", { class: "field-label", id: labelId }, label), group, helper || null);
}

function optionCards(name, label, options, current, onChange) {
  return h("div", { class: "options", role: "radiogroup", "aria-label": label }, options.map(opt => {
    const id = name + "-" + opt.value;
    return h("label", { class: "option", for: id },
      h("input", {
        type: "radio", class: "option-input", name, id, value: String(opt.value),
        checked: opt.value === current, onchange: () => onChange(opt.value)
      }),
      h("span", { class: "option-dot", "aria-hidden": "true" }),
      h("span", { class: "option-title" }, opt.label),
      opt.sub ? h("span", { class: "option-sub" }, opt.sub) : null);
  }));
}

function checkRow(id, text, sub, checked, disabled, onChange, dimWhenDone) {
  const input = h("input", { type: "checkbox", class: "box", id, checked, disabled, onchange: e => onChange(e.target.checked) });
  return h("label", { class: "check-row" + (dimWhenDone ? " dim-done" : "") + (disabled ? " is-disabled" : ""), for: id },
    input,
    h("span", { class: "check-text" },
      h("span", { class: "check-main" }, text),
      sub ? h("span", { class: "check-sub" }, sub) : null));
}

/* ---------- Text and number formats ---------- */

const NUMBER_WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"];
function numberWord(n) { return NUMBER_WORDS[n] || String(n); }
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }
function countWords(text) { const m = String(text || "").trim().match(/\S+/g); return m ? m.length : 0; }
function spokenSeconds(words) { return Math.round(words / APP.wordsPerMinute * 60); }
function fmtDuration(sec) {
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (m === 0) return s + " s";
  if (s === 0) return m + " min";
  return m + " min " + s + " s";
}
function fmtClock(sec) {
  sec = Math.max(0, Math.floor(sec));
  return String(Math.floor(sec / 60)).padStart(2, "0") + ":" + String(sec % 60).padStart(2, "0");
}
function fmtDate(d) {
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return d.getDate() + "-" + months[d.getMonth()] + "-" + d.getFullYear();
}
function stripEnd(q) { return q.replace(/[.?!]$/, ""); }
/* Stopwatch digits with a colon set by hand, raised to sit at the middle of the numerals. */
function clockParts(sec) {
  const parts = fmtClock(sec).split(":");
  return [parts[0], h("span", { class: "clock-colon" }, ":"), parts[1]];
}

/* ---------- State and saving ---------- */

function defaultState() {
  return {
    stories: {},
    customStories: [],
    qNotes: {},
    qStatus: {},
    scenarios: {},
    study: {},
    mockRounds: 0,
    aiCopied: false,
    savedAt: 0,
    /* Personal content stays out of the AI prompt until the consultant ticks it in. */
    ai: { mode: "coach", count: 8, includeIntro: false, includeStories: false },
    prep: { intro: "", messages: ["", "", ""], ask: [], ownAsk: "", checks: {} },
    ui: { area: "all", status: "all", mockLength: 6, mockFocus: "mixed" }
  };
}

let state = defaultState();
let storage = "ok";
let saveTimer = null;

function loadState() {
  let raw = null;
  try {
    raw = window.localStorage.getItem(STORE_KEY);
  } catch (err) {
    storage = "blocked";
    return;
  }
  if (!raw) return;
  try {
    const saved = JSON.parse(raw);
    const base = defaultState();
    Object.keys(base).forEach(key => {
      if (saved[key] === undefined || saved[key] === null) return;
      const isPlainObject = typeof base[key] === "object" && !Array.isArray(base[key]);
      state[key] = isPlainObject ? Object.assign(base[key], saved[key]) : saved[key];
    });
  } catch (err) {
    state = defaultState();
  }
  if (!Array.isArray(state.customStories)) state.customStories = [];
  if (!Array.isArray(state.prep.messages)) state.prep.messages = ["", "", ""];
  while (state.prep.messages.length < 3) state.prep.messages.push("");
  if (!Array.isArray(state.prep.ask)) state.prep.ask = [];
  if (typeof state.prep.intro !== "string") state.prep.intro = "";
}

function saveSoon() {
  setSaveStatus("saving");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 350);
}

function saveNow() {
  clearTimeout(saveTimer);
  state.savedAt = Date.now();
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify(state));
    storage = "ok";
  } catch (err) {
    storage = "blocked";
  }
  setSaveStatus();
  syncProgress();
}

/* The step markers only need redrawing when a count changed, not after every keystroke. */
let progressKey = "";
function syncProgress() {
  const key = VIEWS.map(v => {
    const p = progressFor(v.id);
    return p ? p.short + (p.done ? "!" : p.started ? "~" : "") : "";
  }).join("|");
  if (key === progressKey) return;
  progressKey = key;
  refreshNav();
  updateTopbar();
}

/* Notes left in the browser long after the interview are a privacy risk, so remind the consultant to clear them. */
function showStaleNote() {
  const el = byId("stale-note");
  if (!el) return;
  const stale = !!state.savedAt && Date.now() - state.savedAt > STALE_DAYS * 86400000;
  el.hidden = !stale;
  const advice = (window.coachSetup && window.coachSetup.staleAdvice) || "If the interview is over, clear them and delete this file.";
  el.textContent = stale
    ? "Your notes were last saved on " + fmtDate(new Date(state.savedAt)) + ". " + advice
    : "";
}

function setSaveStatus(mode) {
  const el = byId("save-status");
  if (!el) return;
  const m = mode || (storage === "blocked" ? "blocked" : "saved");
  el.classList.toggle("is-saving", m === "saving");
  el.classList.toggle("is-blocked", m === "blocked");
  el.querySelector(".save-text").textContent =
    m === "saving" ? "Saving…" :
    m === "blocked" ? "Not saved. This browser blocks storage, so copy your notes before you close it." :
    "Saved in this browser";
}

/* The qualities and activities a story can show, filled in when the coach starts. */
let FOCUS_ITEMS = [];
const TYPE_LABEL = { opener: "Opener", experience: "Experience", scenario: "Scenario", knowledge: "Knowledge", closer: "Closer" };
const RATINGS = [
  { value: "again", label: "Practice again" },
  { value: "okay", label: "Okay" },
  { value: "strong", label: "Strong" }
];
const STAR = [
  { key: "s", label: "Situation", help: "Where and when. One or two sentences." },
  { key: "t", label: "Task", help: "What you were responsible for." },
  { key: "a", label: "Action", help: "What you did, step by step. This is the biggest part." },
  { key: "r", label: "Result", help: "How it ended. Use numbers if you have them." }
];
const KEYS = ["A", "B", "C", "D"];

function focusName(id) { const f = FOCUS_ITEMS.find(x => x.id === id); return f ? f.name : ""; }
/* Requirements and study topics are lists in every checked pack, and the app copes when they are not. */
function requirementList() { return Array.isArray(PACK.requirements) ? PACK.requirements : []; }
function studyTopics() { return Array.isArray(PACK.study) ? PACK.study : []; }
function topicFocus(t) { return Array.isArray(t.focus) ? t.focus : []; }
/* The name of anything CV fit or a study topic can point at: a quality, an activity or a requirement. */
function anyFocusName(id) {
  const r = requirementList().find(x => x.id === id);
  return r ? r.name : focusName(id);
}
function areaName(id) { const a = PACK.areas.find(x => x.id === id); return a ? a.name : ""; }
function questionById(id) { return PACK.questions.find(q => q.id === id); }
function scenarioById(id) { return PACK.scenarios.find(s => s.id === id); }
function allChecks() { return [].concat(...PACK.checklist.map(g => g.items)); }
function allStoryIds() { return PACK.storySlots.map(s => s.id).concat(state.customStories); }
function customSlot(id) {
  const i = state.customStories.indexOf(id);
  return { id, label: "Extra " + (i + 1), focus: null, prompt: "Any other example you want ready.", hints: [] };
}
function slotFor(id) { return PACK.storySlots.find(s => s.id === id) || (state.customStories.indexOf(id) >= 0 ? customSlot(id) : null); }
function storyLabel(id) {
  const s = slotFor(id);
  if (!s) return "";
  return s.focus ? s.label + " (" + focusName(s.focus) + ")" : s.label;
}

function storyData(id) {
  if (!state.stories[id] || typeof state.stories[id] !== "object") {
    state.stories[id] = { title: "", s: "", t: "", a: "", r: "", tags: [] };
  }
  const st = state.stories[id];
  ["title", "s", "t", "a", "r"].forEach(k => { if (typeof st[k] !== "string") st[k] = ""; });
  if (!Array.isArray(st.tags)) st.tags = [];
  return st;
}

function storyStatus(id) {
  const st = state.stories[id];
  if (!st) return "empty";
  const filled = ["s", "t", "a", "r"].filter(k => String(st[k] || "").trim()).length;
  if (filled === 4) return "done";
  if (filled > 0 || String(st.title || "").trim()) return "started";
  return "empty";
}

function storyWords(id) {
  const st = state.stories[id];
  return st ? countWords([st.s, st.t, st.a, st.r].join(" ")) : 0;
}

function progressFor(id) {
  if (id === "study") {
    const t = studyTopics().length;
    if (!t) return null;
    const n = studyTopics().filter(x => state.study[x.id]).length;
    return { short: n + "/" + t, long: n + " of " + t + " studied", done: n === t, started: n > 0 };
  }
  if (id === "stories") {
    const t = PACK.storySlots.length;
    const n = PACK.storySlots.filter(s => storyStatus(s.id) === "done").length;
    const started = PACK.storySlots.some(s => storyStatus(s.id) !== "empty");
    return { short: n + "/" + t, long: n + " of " + t + " written", done: n === t, started };
  }
  if (id === "questions") {
    const t = PACK.questions.length;
    const n = PACK.questions.filter(q => state.qStatus[q.id]).length;
    return { short: n + "/" + t, long: n + " of " + t + " practiced", done: n === t, started: n > 0 };
  }
  if (id === "scenarios") {
    const t = PACK.scenarios.length;
    const n = PACK.scenarios.filter(s => state.scenarios[s.id]).length;
    return { short: n + "/" + t, long: n + " of " + t + " played", done: n === t, started: n > 0 };
  }
  if (id === "mock") {
    const n = state.mockRounds || 0;
    return n ? { short: String(n), long: plural(n, "round") + " done", done: true, started: true } : null;
  }
  if (id === "ai-practice") {
    return state.aiCopied ? { short: "", long: "Prompt copied", done: true, started: true } : null;
  }
  if (id === "prep") {
    const all = allChecks();
    const n = all.filter(c => state.prep.checks[c.id]).length;
    return { short: n + "/" + all.length, long: n + " of " + all.length + " ticked", done: n === all.length, started: n > 0 || !!state.prep.intro.trim() };
  }
  return null;
}
