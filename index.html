let lastViewId = null;
let activeView = null;
const pending = { story: null, scenario: null, topic: null, question: null };

function viewFromHash() {
  let id = "";
  try { id = decodeURIComponent((location.hash || "").replace(/^#/, "")); } catch (err) { id = ""; }
  return VIEWS.some(v => v.id === id) ? id : null;
}

function currentViewId() { return activeView || viewFromHash() || "brief"; }

/* Moves to a step. The address bar follows when the browser allows it, but the coach never depends on it. */
function go(id) {
  if (!viewDef(id)) return;
  if (id === activeView && !firstRoute) {
    window.scrollTo(0, 0);
    return;
  }
  activeView = id;
  route();
  try { if (location.hash !== "#" + id) location.hash = id; } catch (err) { /* the address bar is optional */ }
}

function onHashChange() {
  const id = viewFromHash();
  if (!id || id === activeView) return;
  activeView = id;
  route();
}

function route() {
  if (drawerState.open) closeDrawer(true);
  if (cleanupFn) {
    try { cleanupFn(); } catch (err) { /* nothing to undo */ }
    cleanupFn = null;
  }
  postRender = null;
  const id = currentViewId();
  const view = RENDER[id]();
  view.appendChild(nextFooter(id));
  let dir = null;
  if (!firstRoute && lastViewId && lastViewId !== id) dir = viewIndex(id) > viewIndex(lastViewId) ? "forward" : "back";
  if (!firstRoute) window.scrollTo(0, 0);
  if (dir) pushTransition(byId("view"), view, dir);
  else {
    if (activePush) activePush.finish();
    byId("view").replaceChildren(view);
  }
  lastViewId = id;
  refreshNav();
  updateTopbar();
  moveMarker(byId("nav"), firstRoute ? "sweep" : "spring");
  if (!firstRoute) byId("main").focus({ preventScroll: true });
  firstRoute = false;
  if (postRender) { const fn = postRender; postRender = null; fn(); }
}

/* ---------- The route of steps, with a selection pill that follows you ---------- */

const markers = new Map();

function buildNav(container, inDrawer) {
  const hl = h("span", { class: "route-hl", "aria-hidden": "true" });
  const steps = h("ol", { class: "route route-steps" });
  const refs = h("ul", { class: "route route-ref" });
  VIEWS.forEach(v => {
    const link = h("button", { type: "button", class: "route-link", "data-view": v.id, onclick: () => { if (inDrawer) closeDrawer(); go(v.id); } },
      h("span", { class: "dot-slot" }),
      h("span", { class: "route-label" }, v.label),
      h("span", { class: "route-progress", "aria-hidden": "true" }),
      h("span", { class: "sr-only route-progress-long" }));
    (v.step ? steps : refs).appendChild(h("li", null, link));
  });
  container.replaceChildren(hl, steps, refs);
  markers.set(container, { el: hl, placed: false });
  if ("ResizeObserver" in window) new ResizeObserver(() => moveMarker(container, "jump")).observe(container);
}

function refreshNav() {
  const id = currentViewId();
  document.querySelectorAll(".route-link").forEach(a => {
    const vid = a.getAttribute("data-view");
    const v = viewDef(vid);
    if (vid === id) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
    const p = progressFor(vid);
    a.querySelector(".dot-slot").replaceChildren(stepDot(v, !!(p && p.done), progressShare(p)));
    a.querySelector(".route-progress").textContent = p ? p.short : "";
    a.querySelector(".route-progress-long").textContent = p ? ", " + p.long : "";
  });
}

function markerFor(container) {
  const m = markers.get(container);
  if (!m) return null;
  if (!m.sy) {
    m.y = 0;
    m.s = 1;
    const paint = () => {
      const s = Math.max(0, Math.min(1, m.s));
      m.el.style.transform = "translateY(" + m.y.toFixed(2) + "px) scale(" + (0.94 + 0.06 * s).toFixed(4) + ")";
      m.el.style.opacity = s.toFixed(3);
    };
    m.sy = new Spring(0, v => { m.y = v; paint(); }, { precision: 0.2 });
    m.ss = new Spring(1, v => { m.s = v; paint(); }, { precision: 0.002 });
    m.sh = new Spring(0, v => { m.el.style.height = v.toFixed(2) + "px"; }, { precision: 0.2 });
  }
  return m;
}

/* mode: "jump" places it, "spring" moves it from where it is, "sweep" lets it settle in once on load. */
function moveMarker(container, mode) {
  const m = markerFor(container);
  if (!m || container.getClientRects().length === 0) return;
  const link = container.querySelector('.route-link[aria-current="page"]');
  if (!link) { m.el.style.opacity = "0"; return; }
  const height = link.offsetHeight;
  if (!height) return;
  /*
    The pill covers the whole row, the way a selected row looks in a sidebar. Layout offsets are
    used so that a row measured while it is pressed, and scaled down, still gives its resting size.
  */
  let x = 0;
  let y = 0;
  for (let n = link; n && n !== container; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; }
  m.el.style.left = x + "px";
  m.el.style.width = link.offsetWidth + "px";
  if (mode === "spring" && m.placed && motionOK()) {
    m.sy.to(y, { damping: 1, response: 0.38 });
    m.sh.to(height, { damping: 1, response: 0.38 });
    if (m.ss.target !== 1) m.ss.to(1, { damping: 1, response: 0.4 });
  } else {
    m.sy.jump(y);
    m.sh.jump(height);
    if (mode === "sweep" && motionOK()) {
      m.ss.jump(0);
      m.ss.to(1, { damping: 1, response: 0.6 });
    } else if (!m.ss.animating) {
      m.ss.jump(1);
    }
  }
  m.placed = true;
}

/* Phone header: where you are, and a progress bar of the steps. */
function updateTopbar() {
  const v = viewDef(currentViewId());
  byId("topbar-count").textContent = v.step ? "Step " + v.step + " of " + STEP_COUNT : "Reference";
  byId("topbar-title").textContent = v.label;
  byId("topbar-progress").replaceChildren(...VIEWS.filter(x => x.step).map(x =>
    h("span", { class: "bar-step" + (x.id === v.id ? " is-here" : isDone(x.id) ? " is-done" : "") })));
}

/* ---------- Steps drawer on phones: it comes from the left, where the steps live on a wide screen ---------- */

const drawerState = { open: false, spring: null, drag: null, returnFocus: null, suppressClick: false };

/* How far the panel travels to leave the screen: its width, its inset from the edge and room for its shadow. */
function drawerWidth() {
  const d = byId("drawer");
  return (d.offsetWidth || 320) + Math.max(0, d.offsetLeft) + 24;
}

function applyDrawer(x) {
  const w = drawerWidth();
  byId("drawer").style.transform = "translate3d(" + x.toFixed(2) + "px,0,0)";
  byId("drawer-scrim").style.opacity = String(Math.max(0, Math.min(1, 1 + x / w)));
}

function setInert(on) {
  const app = byId("app");
  app.inert = on;
  if (on) app.setAttribute("aria-hidden", "true"); else app.removeAttribute("aria-hidden");
}

function setupDrawer() {
  drawerState.spring = new Spring(-400, applyDrawer, { precision: 0.5 });
  const openBtn = byId("steps-open");
  openBtn.prepend(icon("sidebar"));
  openBtn.addEventListener("click", openDrawer);
  byId("drawer-close").addEventListener("click", () => closeDrawer());
  byId("drawer-scrim").addEventListener("click", () => closeDrawer());
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && drawerState.open) { e.preventDefault(); closeDrawer(); }
  });
  const d = byId("drawer");
  /* A link dragged with a mouse would start the browser's own link drag and cancel the gesture. */
  d.addEventListener("dragstart", e => e.preventDefault());
  d.addEventListener("pointerdown", onDrawerDown);
  d.addEventListener("pointermove", onDrawerMove);
  d.addEventListener("pointerup", onDrawerUp);
  d.addEventListener("pointercancel", onDrawerUp);
  d.addEventListener("click", e => {
    if (!drawerState.suppressClick) return;
    e.preventDefault();
    e.stopPropagation();
    drawerState.suppressClick = false;
  }, true);
}

function openDrawer() {
  const d = byId("drawer");
  const s = byId("drawer-scrim");
  drawerState.returnFocus = document.activeElement;
  const wasHidden = d.hidden;
  d.hidden = false;
  s.hidden = false;
  if (wasHidden) drawerState.spring.jump(-drawerWidth());
  drawerState.open = true;
  setInert(true);
  moveMarker(byId("nav-drawer"), "jump");
  if (motionOK()) {
    drawerState.spring.to(0, { damping: 1, response: 0.34 });
  } else {
    drawerState.spring.jump(0);
    fadeIn(d);
    fadeIn(s);
  }
  const current = d.querySelector('.route-link[aria-current="page"]') || d.querySelector(".route-link");
  if (current) current.focus({ preventScroll: true });
}

function closeDrawer(instant, velocity) {
  const d = byId("drawer");
  const s = byId("drawer-scrim");
  if (d.hidden) return;
  drawerState.open = false;
  setInert(false);
  /* A toast that rests on the panel leaves with it. */
  if (byId("toast-host").style.bottom) hideToast();
  const hideAll = () => {
    if (drawerState.open) return;
    d.hidden = true;
    s.hidden = true;
  };
  if (instant || !motionOK()) {
    drawerState.spring.jump(-drawerWidth());
    hideAll();
  } else {
    const opts = { damping: 1, response: 0.3, onRest: hideAll };
    if (typeof velocity === "number") opts.velocity = velocity;
    drawerState.spring.to(-drawerWidth(), opts);
  }
  const back = drawerState.returnFocus;
  drawerState.returnFocus = null;
  if (back && back.isConnected && typeof back.focus === "function") back.focus({ preventScroll: true });
}

/* Taps and vertical scrolls behave as normal. A sideways drag of 10px or more becomes a drag. */
function onDrawerDown(e) {
  if (e.button !== undefined && e.button !== 0) return;
  drawerState.drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, base: 0, active: false, samples: [] };
}

function onDrawerMove(e) {
  const g = drawerState.drag;
  if (!g || e.pointerId !== g.id) return;
  const dx = e.clientX - g.x0;
  const dy = e.clientY - g.y0;
  if (!g.active) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { drawerState.drag = null; return; }
    if (Math.abs(dx) < 10) return;
    g.active = true;
    g.x0 = e.clientX;
    g.base = drawerState.spring.x;
    drawerState.spring.stop();
    drawerState.suppressClick = true;
    try { byId("drawer").setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  }
  let x = g.base + (e.clientX - g.x0);
  if (x > 0) x = rubberband(x, drawerWidth());
  drawerState.spring.x = x;
  drawerState.spring.v = 0;
  applyDrawer(x);
  const now = performance.now();
  g.samples.push({ x, t: now });
  while (g.samples.length > 2 && now - g.samples[0].t > 100) g.samples.shift();
}

function onDrawerUp(e) {
  const g = drawerState.drag;
  if (!g || e.pointerId !== g.id) return;
  drawerState.drag = null;
  if (!g.active) return;
  setTimeout(() => { drawerState.suppressClick = false; }, 350);
  const first = g.samples[0];
  const last = g.samples[g.samples.length - 1];
  const velocity = first && last && last.t > first.t ? ((last.x - first.x) / (last.t - first.t)) * 1000 : 0;
  const projected = drawerState.spring.x + project(velocity);
  if (projected < -drawerWidth() * 0.5) closeDrawer(false, velocity);
  else drawerState.spring.to(0, { damping: 0.8, response: 0.3, velocity });
}

/* The notes tools live in the rail on wide screens and in the drawer on phones. */
function placeTools() {
  const tools = byId("tools");
  const target = NARROW && NARROW.matches ? byId("drawer-body") : byId("rail");
  if (tools.parentElement !== target) target.appendChild(tools);
}

/* ---------- Toast ---------- */

let toastSpring = null;
let toastTimer = null;

function toast(msg) {
  const host = byId("toast-host");
  const el = byId("toast");
  byId("toast-live").textContent = msg;
  el.replaceChildren(icon("check-circle", "toast-icon"), h("span", null, msg));
  /*
    On a phone the notes tools sit at the bottom of the Steps panel, which is where every toast
    comes from. There the toast rests just above the tools and inside the panel, so it never
    covers the button that was pressed.
  */
  const tools = byId("tools");
  if (drawerState.open && tools) {
    const panel = byId("drawer").getBoundingClientRect();
    host.style.bottom = Math.round(window.innerHeight - tools.getBoundingClientRect().top + 10) + "px";
    host.style.left = Math.round(panel.left + panel.width / 2) + "px";
    host.style.maxWidth = Math.round(panel.width - 24) + "px";
  } else {
    host.style.bottom = "";
    host.style.left = "";
    host.style.maxWidth = "";
  }
  host.hidden = false;
  if (!toastSpring) {
    /* The toast arrives as a material: it sharpens and grows to size while it rises, and leaves the same way. */
    toastSpring = new Spring(0, p => {
      const q = Math.max(0, Math.min(1, p));
      el.style.opacity = String(Math.min(1, q * 1.3));
      el.style.transform = "translateY(" + ((1 - q) * 18).toFixed(2) + "px) scale(" + (0.94 + 0.06 * q).toFixed(4) + ")";
      el.style.filter = q > 0.985 ? "" : "blur(" + ((1 - q) * 6).toFixed(2) + "px)";
    }, { precision: 0.002 });
  }
  if (motionOK()) toastSpring.to(1, { damping: 1, response: 0.38 });
  else { toastSpring.jump(1); fadeIn(el); }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 3400);
}

function hideToast() {
  const host = byId("toast-host");
  if (!toastSpring || !motionOK()) { host.hidden = true; return; }
  toastSpring.to(0, { damping: 1, response: 0.32, onRest: () => { host.hidden = true; } });
}

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (err) {
    /* fall back below */
  }
  try {
    const ta = h("textarea", { readonly: true, "aria-hidden": "true", tabindex: "-1", class: "sr-only" });
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    const ok = typeof document.execCommand === "function" && document.execCommand("copy");
    ta.remove();
    return !!ok;
  } catch (err) {
    return false;
  }
}

function selectNode(node) {
  const range = document.createRange();
  range.selectNodeContents(node);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

/*
  A copy button says Copied for a moment, right where the person is looking. It keeps its width,
  so nothing beside it moves, and a second press while it shows only restarts the moment.
*/
const copiedButtons = new WeakMap();
function flashCopied(btn) {
  if (!btn) return;
  let shown = copiedButtons.get(btn);
  if (shown) {
    clearTimeout(shown.timer);
  } else {
    shown = { rest: Array.from(btn.childNodes), timer: 0 };
    copiedButtons.set(btn, shown);
    btn.style.minWidth = btn.offsetWidth + "px";
    btn.replaceChildren(icon("check"), "Copied");
  }
  shown.timer = setTimeout(() => {
    btn.replaceChildren(...shown.rest);
    btn.style.minWidth = "";
    copiedButtons.delete(btn);
  }, 1800);
}

function focusEl(id) {
  const el = byId(id);
  if (!el) return;
  el.focus({ preventScroll: true });
  el.scrollIntoView({ block: "nearest", behavior: motionOK() ? "smooth" : "auto" });
}

/* ---------- Step 1: Brief ---------- */

/*
  A short job description leaves gaps, and the pack fills them with what roles like this usually
  need. Those qualities and activities carry typical: true and a tag, so nobody mistakes them for
  something the client said.
*/
const TYPICAL_NOTE = " Rows tagged Typical for this role were not in the job description.";

function typicalTag(item) {
  return item.typical === true ? tag("Typical for this role", "outline") : null;
}

function renderBrief() {
  const fitLead = PACK.fit && PACK.fit.lead ? " " + PACK.fit.lead : "";
  const typicalQualities = PACK.qualities.some(q => q.typical === true) ? TYPICAL_NOTE : "";
  const typicalActivities = PACK.activities.some(a => a.typical === true) ? TYPICAL_NOTE : "";
  const requirements = requirementList();
  const typicalRequirements = requirements.some(r => r.typical === true) ? TYPICAL_NOTE : "";
  return h("div", { class: "view" },
    h("header", { class: "hero" },
      h("h1", { class: "display-xl" }, PACK.role),
      PACK.lead ? h("p", { class: "lead" }, PACK.lead) : null),
    section("Start here", null, renderPlan()),
    section("What they are looking for", (PACK.qualitiesLead || "What each quality means in this role and how to show it in your answers.") + fitLead + typicalQualities,
      h("div", { class: "sheet rows" }, PACK.qualities.map(renderQuality))),
    section("The work", "The activities named for the role, with practice for each." + typicalActivities,
      h("div", { class: "sheet rows" }, PACK.activities.map(renderActivity))),
    requirements.length ? section("Skills and knowledge", "What the role asks you to know or to have done, with a topic to study where it helps." + typicalRequirements,
      h("div", { class: "sheet rows" }, requirements.map(renderRequirement))) : null,
    section("What this means for your answers", null,
      h("div", { class: "sheet sheet-pad" }, h("ul", { class: "bullets roomy" }, PACK.implications.map(t => h("li", null, rich(t)))))));
}

/*
  Optional, from the consultant's CV: how their experience lines up with a quality, an activity or
  a requirement. It is shown inside that row, so the brief lists each one once. A gap also carries
  a bridge, an honest line the consultant can say about it.
*/
const FIT_TONES = { strong: ["Strong match", "good"], some: ["Some evidence", "accent"], gap: ["Gap to prepare", "warn"] };

function fitFor(id) {
  const items = PACK.fit && Array.isArray(PACK.fit.items) ? PACK.fit.items : [];
  return items.find(it => it.focus === id) || null;
}

function fitTag(fit) {
  if (!fit) return null;
  const t = FIT_TONES[fit.strength] || FIT_TONES.some;
  return tag(t[0], t[1]);
}

function fitBlocks(fit) {
  if (!fit) return [];
  return [
    fit.evidence ? block("From your CV", h("p", null, fit.evidence)) : null,
    fit.angle ? block("How to use it", h("p", null, rich(fit.angle))) : null,
    fit.bridge ? block("What you can say", h("p", null, rich(fit.bridge))) : null
  ];
}

/* Buttons from a row on the Brief to the study topics that cover it. */
function studyButtons(id) {
  return studyTopics().filter(t => topicFocus(t).indexOf(id) >= 0)
    .map(t => linkButton("Study “" + t.title + "”", () => { pending.topic = t.id; go("study"); }));
}

/* A suggestion the consultant can copy into empty fields, then rewrite in their own words. */
function draftBlock(label, content, applyLabel, apply) {
  const status = h("span", { class: "small muted", role: "status" });
  const btn = h("button", {
    type: "button", class: "btn btn-small",
    onclick: () => {
      const filled = apply();
      status.textContent = filled
        ? "Added to the empty fields. Now put it in your own words."
        : "Nothing to fill, those fields already have your text.";
    }
  }, applyLabel);
  return h("div", { class: "draft" },
    h("div", { class: "draft-head" }, h("span", { class: "label" }, label), h("span", { class: "small muted" }, "Square brackets mark details only you know.")),
    content,
    h("div", { class: "btn-row" }, btn, status));
}

function renderPlan() {
  return h("ol", { class: "sheet rows plan" }, VIEWS.filter(v => v.step).map(v => {
    const here = v.id === "brief";
    const p = progressFor(v.id);
    /* One line per step. The number already shows how far a step is, so words are added only once there is something to say. */
    let status = null;
    if (here) status = "You are here";
    else if (p && (p.done || p.started)) status = p.long;
    const inner = [
      stepDot(v, !!(p && p.done), progressShare(p)),
      h("span", { class: "plan-text" },
        h("span", { class: "plan-title" }, h("span", { class: "sr-only" }, "Step " + v.step + ". "), v.title),
        h("span", { class: "plan-time" }, v.time)),
      status ? h("span", { class: "plan-status" }, status) : null
    ];
    return h("li", null, here
      ? h("div", { class: "plan-row", "aria-current": "step" }, inner)
      : h("button", { type: "button", class: "plan-row", onclick: () => go(v.id) }, inner));
  }));
}

function renderQuality(q) {
  const slot = q.story ? PACK.storySlots.find(s => s.id === q.story) : null;
  const fit = fitFor(q.id);
  return h("article", { class: "def-row" },
    h("div", { class: "def-term" }, h("h3", { class: "display-s" }, q.name), q.goodToHave ? tag("Good to have", "outline") : null, typicalTag(q), fitTag(fit)),
    h("div", { class: "def-body" },
      block("What it means here", h("p", null, rich(q.means))),
      block("How to show it", h("p", null, rich(q.show))),
      fitBlocks(fit),
      linkRow([slot ? linkButton("Prepare " + slot.label.toLowerCase(), () => { pending.story = slot.id; go("stories"); }) : null].concat(studyButtons(q.id)))));
}

function linkRow(buttons) {
  const shown = buttons.filter(Boolean);
  return shown.length ? h("p", { class: "link-row" }, shown) : null;
}

function renderRequirement(r) {
  const fit = fitFor(r.id);
  return h("article", { class: "def-row" },
    h("div", { class: "def-term" }, h("h3", { class: "display-s" }, r.name), r.goodToHave ? tag("Good to have", "outline") : null, typicalTag(r), fitTag(fit)),
    h("div", { class: "def-body" },
      h("p", null, rich(r.text)),
      fitBlocks(fit),
      linkRow(studyButtons(r.id))));
}

function renderActivity(a) {
  const scn = scenarioById(a.scenario);
  const area = PACK.areas.find(x => x.id === a.area);
  const fit = fitFor(a.id);
  return h("article", { class: "def-row" },
    h("div", { class: "def-term" }, h("h3", { class: "display-s" }, a.name), typicalTag(a), fitTag(fit)),
    h("div", { class: "def-body" },
      h("p", null, a.text),
      fitBlocks(fit),
      linkRow([
        area ? linkButton("Practice the " + area.name.toLowerCase() + " questions", () => { state.ui.area = area.id; state.ui.status = "all"; saveSoon(); go("questions"); }) : null,
        scn ? linkButton("Play “" + scn.title + "”", () => { pending.scenario = scn.id; go("scenarios"); }) : null
      ].concat(studyButtons(a.id)))));
}

/* ---------- Step 2: Study ---------- */

/*
  Each topic teaches one thing the consultant must be able to explain: why it matters, the points
  to know, how to use it in an answer and the questions that test it. Hiding the points turns
  reading into recall. With a CV in the pack, topics that cover a gap come first.
*/
function coversGap(topic) {
  return topicFocus(topic).some(id => { const f = fitFor(id); return !!f && f.strength === "gap"; });
}

function orderedTopics() {
  const all = studyTopics();
  return all.filter(coversGap).concat(all.filter(t => !coversGap(t)));
}

function studiedTag(done) {
  return done ? tag("Studied", "good") : tag("Not studied", "outline");
}

function renderStudy() {
  const topics = orderedTopics();
  const lead = "What you should be able to explain in this interview. Read a topic, hide the points and say them out loud, then tick it off."
    + (topics.some(coversGap) ? " Topics that cover a gap in your CV come first." : "")
    + " The points are general good practice for roles like this, so use the client’s own words where you know them.";
  const target = pending.topic || (topics.find(t => !state.study[t.id]) || {}).id || null;
  const scrollTo = pending.topic;
  pending.topic = null;
  if (scrollTo) {
    postRender = () => {
      const el = byId("topic-" + scrollTo);
      if (!el) return;
      el.open = true;
      el.scrollIntoView({ block: "start" });
      el.querySelector("summary").focus({ preventScroll: true });
    };
  }
  return h("div", { class: "view" },
    viewHead("Study topics", lead),
    topics.length
      ? h("div", { class: "stack" }, topics.map(t => renderTopic(t, t.id === target)))
      : h("p", { class: "empty" }, "This role was set up with an older coach, so it has no study topics. Start a new coach to get them."));
}

function renderTopic(t, openIt) {
  const id = "topic-" + t.id;
  const statusEl = h("span", null, studiedTag(!!state.study[t.id]));
  const points = h("ul", { class: "bullets", id: id + "-points" }, (Array.isArray(t.points) ? t.points : []).map(p => h("li", null, rich(p))));
